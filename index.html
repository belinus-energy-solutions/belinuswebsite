}
@media (max-width: 640px) { .display, .display-mid, .display-sm { hyphens: auto; overflow-wrap: break-word; } }
/* Align warranty strips and data sheet buttons across cards in a row */
.pl-card .warranty-wrap { margin-top: auto; padding-top: 8px; }
.pl-card .pl-actions { margin-top: 0; }
.pl-card .pl-specs div:last-child { border-bottom: 0; }
.pl-card .warranty-strip { min-height: 92px; align-content: center; }
.pl-card .warranty-wrap { min-height: 128px; display: flex; flex-direction: column; justify-content: flex-start; }
.pl-card .warranty-strip.is-project { min-height: 92px; display: flex; align-items: center; }


/* Kratos band (home + products) */
.kband { padding: 96px 0; border-top: 1px solid var(--ink-4); border-bottom: 1px solid var(--ink-4); background: radial-gradient(60% 80% at 75% 50%, rgba(46,185,234,.10), transparent 70%), #000; }
.kband-in { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: center; }
.kband-text { display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
.kband-text .display-mid, .kband-text .body-lg { margin: 0; }
.kband-text { min-width: 0; }
.kband-text .display-mid { font-size: clamp(32px, 3.6vw, 52px); overflow-wrap: break-word; hyphens: auto; }
.kband-note { margin: 0; font-size: 12px; color: var(--fg-3); }
.kband-media { display: block; }
.kband-media img, .kratos figure img { --fx: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent); --fy: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent); -webkit-mask-image: var(--fx), var(--fy); -webkit-mask-composite: source-in; mask-image: var(--fx), var(--fy); mask-composite: intersect; }
.kband-media img { display: block; width: 100%; height: auto; }
@media (max-width: 900px) { .kband { padding: 64px 0; } .kband-in { grid-template-columns: 1fr; gap: 32px; } .kband-media { order: -1; } }
/* Kratos supercapacitor showcase (power storage page) */
.kratos { margin: 8px 0 72px; scroll-margin-top: 140px; }
.kratos figure { margin: 0; position: relative; }
.kratos figure img { display: block; width: 100%; height: auto; }
.kratos figcaption { position: absolute; left: 20px; bottom: 16px; color: var(--fg-3); }
.kratos-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; margin-top: 24px; align-items: start; }
.kratos-text { display: flex; flex-direction: column; gap: 16px; }
.kratos-text .display-mid { margin: 4px 0 0; }
.kratos-sub { color: var(--brand-blue); margin: 0; }
.kratos-text .body-md { margin: 0; }
.kratos-specs-h { margin: 12px 0 0; color: var(--fg-3); font-weight: inherit; }
.kratos-specs dd { max-width: 60%; }
.kratos-note { margin: 0; font-size: 12px; color: var(--fg-3); }
.kratos-text .btn { align-self: flex-start; margin-top: 8px; }
@media (max-width: 900px) { .kratos-body { grid-template-columns: 1fr; gap: 28px; } .kratos-cab { max-width: 420px; } }

/* align card rows horizontally (title, text, specs, warranty, datasheet) */
@supports (grid-template-rows: subgrid) {
  .pl-grid { row-gap: 20px; }
  .pl-card { display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: 0; align-content: start; }
  .pl-card > h3 { grid-row: 1; }
  .pl-card > .body-md { grid-row: 2; margin-top: 16px; }
  .pl-card > .pl-specs { grid-row: 3; margin-top: 16px; align-self: start; }
  .pl-card > .pl-project { grid-row: 4; margin-top: 16px; }
  .pl-card > .warranty-wrap { grid-row: 5; margin-top: 16px; }
  .pl-card > .pl-actions { grid-row: 6; margin-top: 16px; align-self: end; }
}

/* ---- Home energy infographic ---- */
.home-energy { margin: 8px 0 48px; border: 1px solid var(--ink-4); border-radius: var(--r-md); overflow: hidden; background: #05080b; }
.home-energy svg { display: block; width: 100%; height: auto; }
.he-dash { animation: heDash 1.2s linear infinite; }
@keyframes heDash { to { stroke-dashoffset: -24; } }
.home-energy-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 24px; padding: 20px 24px; border-top: 1px solid var(--ink-4); font-size: 13px; color: var(--fg-2); }
.home-energy-legend span { display: flex; align-items: center; gap: 10px; }
.home-energy-legend b { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--brand-blue); color: var(--fg-1); font-size: 11px; display: grid; place-items: center; }
@media (max-width: 900px) { .home-energy-legend { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .home-energy-legend { grid-template-columns: 1fr; } }
.ha-pulse { animation: haPulse 3s linear infinite; }
@keyframes haPulse { from { stroke-dashoffset: 614; } to { stroke-dashoffset: 0; } }
.home-energy-legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-blue); flex: 0 0 auto; }
.home-energy-legend em { font-style: normal; color: var(--brand-blue); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-left: 4px; }
.home-energy svg text { font-family: inherit; }

/* Solar product line: why back-contact + families */
.pl-why { list-style: none; margin: 8px 0 24px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.pl-why li { border-left: 1px solid var(--brand-blue); padding: 2px 0 2px 16px; color: var(--fg-2); min-width: 0; }
@media (max-width: 1000px) { .pl-why { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .pl-why { grid-template-columns: 1fr; } }
.pl-group { padding-top: 56px; margin-top: 40px; border-top: 1px solid var(--ink-4); scroll-margin-top: 96px; }
.pl-group-head { display: grid; gap: 12px; margin-bottom: 24px; max-width: 72ch; }
.pl-group-head .eyebrow { color: var(--brand-blue); }
.products-grid.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .products-grid.n4 { grid-template-columns: 1fr; } }

:root{color-scheme:dark}

.pl-card.is-link { cursor: pointer; }
.pl-card.is-link:hover { border-color: rgba(46,185,234,.7); }
.pl-sheet.is-kratos { border-style: solid; border-color: rgba(46,185,234,.5); }
.kratos-page .kratos { margin-top: 24px; }
.kratos .kratos-hero { max-width: 600px; margin: 0 auto; }
.kratos-body { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); }
.kratos .kratos-cab { max-width: 340px; justify-self: center; }
.kband-in { grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); }
.kband-media { max-width: 440px; justify-self: end; width: 100%; }
@media (max-width: 900px) { .kratos-body { grid-template-columns: 1fr; } .kratos .kratos-cab { max-width: 260px; } .kband-media { justify-self: center; } }

/* Warranty format: big blue figures, centred labels, blue dividers */
.warranty-strip { gap: 0; padding: 22px 0; border-top: 0; border-bottom: 1px solid var(--ink-4); }
.warranty-strip.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pl-card .warranty-strip { min-height: 0; }
.warranty-item { flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 2px 10px; border-left: 1px solid var(--brand-blue); }
.warranty-item:first-child { border-left: 0; }
.warranty-v { display: inline-flex; align-items: baseline; color: var(--brand-blue); font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.warranty-v small { font-size: 17px; font-weight: 700; letter-spacing: 0; margin-left: 2px; }
.warranty-k { color: var(--fg-1); font-family: inherit; font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; line-height: 1.35; }
.warranty-strip.is-project .warranty-k { color: var(--fg-2); }
@media (max-width: 520px) {
  .warranty-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
  .warranty-strip.n1 { grid-template-columns: 1fr; }
  .warranty-item { flex-direction: column; align-items: center; gap: 6px; padding: 2px 6px; }
  .warranty-v { min-width: 0; font-size: 36px; }
  .warranty-v small { font-size: 14px; }
  .warranty-k { font-size: 12.5px; }
}

@media (max-width: 900px) {
  .kratos .kratos-hero { max-width: 320px; }
  .kratos .kratos-cab { order: 2; max-width: 220px; margin-top: 8px; }
  .kratos .kratos-text { order: 1; }
  .kratos figcaption { font-size: 9px; left: 12px; bottom: 8px; }
}

/* Kratos page layout v2: images left (shelf above cabinet), text right; mobile: shelf, text, cabinet */
.kratos { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-areas: "hero text" "cab text"; column-gap: 64px; row-gap: 32px; align-items: start; }
.kratos .kratos-body { display: contents; }
.kratos .kratos-hero { grid-area: hero; max-width: 460px; width: 100%; margin: 0; justify-self: center; }
.kratos .kratos-cab { grid-area: cab; max-width: 300px; width: 100%; margin: 0; justify-self: center; order: 0; }
.kratos .kratos-text { grid-area: text; order: 0; }
@media (max-width: 900px) {
  .kratos { grid-template-columns: 1fr; grid-template-areas: "hero" "text" "cab"; row-gap: 28px; }
  .kratos .kratos-hero { max-width: 320px; }
  .kratos .kratos-cab { max-width: 220px; }
}

/* Kratos applications */
.kratos-apps { grid-column: 1 / -1; margin-top: 40px; padding-top: 40px; border-top: 1px solid var(--ink-4); }
.kratos-apps-grid { list-style: none; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kratos-apps-grid li { border: 1px solid var(--ink-4); border-radius: var(--r-md); padding: 24px; display: flex; flex-direction: column; gap: 10px; transition: border-color 300ms; }
.kratos-apps-grid li:hover { border-color: rgba(46,185,234,.5); }
.kratos-app-n { color: var(--brand-blue); font-size: 12px; }
.kratos-app-t { margin: 0; font-size: 19px; font-weight: 400; line-height: 1.25; color: var(--fg-1); }
.kratos-apps-grid .body-md { margin: 0; color: var(--fg-2); font-size: 15px; }
@media (max-width: 900px) { .kratos-apps { margin-top: 16px; } .kratos-apps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kratos-apps-grid { grid-template-columns: 1fr; } .kratos-apps-grid li { padding: 20px; } }

g 8 Energywall home batteries (Energywall LV and HV). Customers who have these batteries installed are being contacted personally.","The cause lies in storage: while in storage, these batteries were deeply discharged, which can permanently affect the battery cells. As a precaution, we are replacing these batteries with new products.","Have you been contacted about this recall? Please contact our customer service at service@belinus.com with your name and installation address, and we will schedule the replacement with you. Do you have an Energywall LV or HV but have not been contacted? Please email us too, and we will confirm whether your installation is affected."],links:[{href:"mailto:service@belinus.com?subject=Energywall%20recall",label:"service@belinus.com"}]},{date:"2026-10-15",tag:"Partnership",title:"Belinus and Clavoris sign a strategic partnership for service contracts and financing models",body:["Belinus has signed a strategic partnership with Clavoris, a financial enablement platform. Together we are preparing a secure, institutionally compliant framework for Belinus customer service contracts, including financing models such as leasing, rental and power purchase agreements (PPAs).","Clavoris is developing a compliant security token on an institutional-grade blockchain network built for regulated financial markets. Three features matter most for our customers and investors. Transaction details are visible only to the parties involved, so contract and payment data stay private. Payment and delivery are settled in a single step, or not at all, which removes the gap in which one side has paid and the other has not delivered. And the network is already used by established financial institutions, so contracts can connect to existing capital-market infrastructure.","Belinus can rely on the standards the Clavoris platform has adopted: qualified electronic signatures under the EU eIDAS regulation, identity and company checks (KYC and KYB) in line with anti-money-laundering rules, GDPR-compliant data protection with hosting in the EU, and a security framework being aligned with the EU Digital Operational Resilience Act (DORA) and ISO/IEC 27001.","For Belinus this means that energy-as-a-service contracts, from a home system on a monthly fee to a supercapacitor installation under a PPA, can be documented, signed and administered on one platform, with a clear route to financing them with institutional investors. Tokenisation on the network is planned for 2027.","This announcement is for information only and is not an offer of financial instruments."],link:{href:"https://www.clavoris.com",label:"Visit www.clavoris.com"}},{date:"2026-10-01",tag:"Technology",title:"Belinus presents three cell technologies for power and energy storage",body:"Belinus now offers three cell technologies through a Belinus Invest strategic partnership: the SC-60138 supercapacitor for high-power, high-cycle applications, the lithium-free NIB-60138 sodium-ion cell for stationary energy storage, and the HUC-60138 hybrid ultracapacitor for automotive and other high-power uses. Together they let us build hybrid systems that combine power and energy storage, coordinated by our own battery management and Themis energy management. Preliminary data sheets are available on request.",link:{href:"#technology",label:"Explore the technology"}},{date:"2026-06",tag:"Technology",title:"Belinus develops supercapacitor-based systems for the European market",body:"Belinus is developing power storage systems built on supercapacitors for European industry, grid and mobility customers. Supercapacitors charge and discharge in seconds and are rated for very high cycle counts, which makes them well suited to the fast, repeated power peaks that batteries handle less well: industrial pulse loads, grid support, backup bridging and braking-energy recovery. As electrification and renewable generation grow, so does the need for this kind of fast power storage, and market studies expect continued strong growth. Our cells are produced in India by our technology partner. The EU and India concluded a free trade agreement in principle in January 2026, with signature planned for the end of 2026 and entry into force expected in 2027. We expect this to support a stable supply chain for the European market, alongside our longer-term target of production in Europe.",link:{href:"#applications",label:"See the applications"}},{date:"2026-04",tag:"Company",title:"EV ChargeKing to join the Belinus group",body:"Belinus Invest BV and SOME BV, the company behind EV ChargeKing, have reached an agreement in principle for EV ChargeKing to join the Belinus group. EV ChargeKing brings its residential EV charging portfolio, which will be offered under the Belinus brand alongside our solar, inverter and storage products. Completion of the transaction is subject to final agreements and customary conditions.",links:[{href:"#products",label:"See the products"},{href:"https://www.etap.pro/en",label:"Visit www.etap.pro"}]},,{date:"2026-02",tag:"Solar",title:"Belinus bets on back-contact: a new solar portfolio built only on BC technology",body:["Belinus is preparing the launch of a new solar panel portfolio based solely on back-contact (BC) cell technology. The range is built around Gaia and Gaia Smart, the latter with an integrated optimiser assembled in Belgium.","In a conventional solar cell, metal contacts run across the front and cast small shadows on the surface. A back-contact cell moves all contacts to the rear. The front is fully open to the light, so more of the cell area produces power, and the panel has a clean, uniform look without visible busbars.","Solar cell technology has moved in steps: from PERC, which dominated the market for years, to TOPCon, and now to back-contact designs, which a growing number of leading manufacturers see as the next step in efficiency. BC also lends itself to better behaviour in partial shade and to premium all-black designs for homes.","Energy storage is at the heart of every Belinus system. Our supercapacitor and sodium-ion storage, managed by Themis, decides when energy is stored, used or delivered. Back-contact solar extends that system: fewer, better panels on every roof, each one feeding into Belinus storage."],link:{href:"#products",label:"See the products"}}],NEWS_PREVIEW=/[?&]preview=news\b/.test(location.search);function newsLive(e){return!e.publishAt||NEWS_PREVIEW||Date.now()>=Date.parse(e.publishAt)}function newsPending(e){return e.publishAt&&Date.now()<Date.parse(e.publishAt)}function formatDate(e){if(/^\d{4}-\d{2}$/.test(e)){const[a,s]=e.split("-");return new Date(+a,+s-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}try{return new Date(e+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}catch{return e}}function NewsPage(){return React.createElement("section",{className:"news",id:"news"},React.createElement("div",{className:"wrap"},React.createElement("div",{className:"section-head"},React.createElement("span",{className:"eyebrow eyebrow-dot"},"News"),React.createElement("h2",{className:"display-mid",style:{maxWidth:"20ch"}},"Latest from Belinus."),React.createElement("p",{className:"body-lg",style:{marginTop:28}},"Company updates, product news and project milestones.")),NEWS.filter(newsLive).length===0?React.createElement("div",{className:"news-empty"},React.createElement("span",{className:"label",style:{color:"var(--brand-blue)"}},"Coming soon"),React.createElement("p",{className:"body-md"},"Our first updates will be published here shortly. For press enquiries, contact us at service@belinus.com.")):React.createElement("ol",{className:"news-list"},NEWS.filter(newsLive).map(e=>React.createElement("li",{key:e.date+e.title,className:"news-item"+(e.recall?" news-recall":"")},React.createElement("div",{className:"news-meta"},React.createElement("time",{className:"mono",dateTime:e.date},formatDate(e.date)),React.createElement("span",{cla nergy, for vehicles and heavy duty cycles.", "more": "A hybrid ultracapacitor (lithium-ion capacitor) sits between a supercapacitor and a battery: more energy than a supercapacitor, far more power than a battery cell, over 50,000 cycles and a typical life of 10 to 15 years. It suits vehicles and machines that brake and accelerate all day."}, {"q": "Why sodium-ion for stationary storage?", "a": "Long cycle life and a supply chain free of lithium, cobalt and nickel.", "more": "Our NVPF sodium-ion cells deliver over 10,000 cycles to 80 % state of health, 5C continuous and 20C peak power, and operate from −30 °C to +55 °C. They can be discharged to 0 V for transport and storage, and contain no lithium, cobalt or nickel."}, {"q": "Why three technologies from one partner?", "a": "Every load gets the right technology, in one hybrid system.", "more": "Supercapacitors take the peaks, hybrid ultracapacitors the repeated high-power duty, sodium-ion the hours of energy. Belinus combines them in one hybrid system with its own battery management and Themis energy management, deciding moment by moment which technology takes the load."}, {"q": "Where are Belinus systems made?", "a": "Engineered and assembled in Europe.", "more": "Belinus engineers its modules and systems in Europe, assembles its packs in Europe and builds its devices with European partners. That means short supply lines, European standards and support, and a step towards European energy sovereignty."}, {"q": "What is special about the Belinus BMS?", "a": "One battery management system for every chemistry, built on Formula One know-how.", "more": "BMS-1, the battery management standard Belinus is developing for its next generation of modules, manages supercapacitor, sodium-ion, hybrid ultracapacitor and LFP modules with one architecture, with balancing, temperature monitoring and current limits set for each chemistry. Its development draws on our partners’ experience in Formula One and high-performance automotive applications."}], "nl": [{"q": "Waarom supercondensatoren?", "a": "Vermogen in seconden, tot 500.000 cycli, zonder lithium.", "more": "Supercondensatoren slaan energie elektrostatisch op, niet chemisch. Ze laden en ontladen in seconden, keer op keer, en zijn ontworpen voor tot 500.000 cycli (verwacht), van −40 °C tot +65 °C. Ideaal voor pieken, pulsen, netondersteuning en het overbruggen van onderbrekingen."}, {"q": "Wat is een hybride ultracondensator?", "a": "Vermogen van een condensator met meer opgeslagen energie, voor voertuigen en zware werkcycli.", "more": "Een hybride ultracondensator (lithium-ioncondensator) zit tussen een supercondensator en een batterij in: meer energie dan een supercondensator, veel meer vermogen dan een batterijcel, meer dan 50.000 cycli en een typische levensduur van 10 tot 15 jaar. Hij past bij voertuigen en machines die de hele dag remmen en optrekken."}, {"q": "Waarom natrium-ion voor stationaire opslag?", "a": "Lange levensduur en een toeleveringsketen zonder lithium, kobalt of nikkel.", "more": "Onze NVPF-natrium-ioncellen halen meer dan 10.000 cycli tot 80 % state of health, 5C continu en 20C piekvermogen, en werken van −30 °C tot +55 °C. Ze kunnen tot 0 V ontladen worden voor transport en opslag, en bevatten geen lithium, kobalt of nikkel."}, {"q": "Waarom drie technologieën bij één partner?", "a": "Elke belasting krijgt de juiste technologie, in één hybride systeem.", "more": "Supercondensatoren vangen de pieken op, hybride ultracondensatoren het herhaalde hoge vermogen, natrium-ion de energie over uren. Belinus combineert ze in één hybride systeem met eigen batterijbeheer en Themis-energiebeheer, dat op elk moment beslist welke technologie de last draagt."}, {"q": "Waar worden Belinus-systemen gemaakt?", "a": "Ontwikkeld en geassembleerd in Europa.", "more": "Belinus ontwikkelt zijn modules en systemen in Europa, assembleert zijn packs in Europa en bouwt zijn toestellen met Europese partners. Dat betekent korte toeleveringsketens, Europese normen en ondersteuning, en een stap naar Europese energiesoevereiniteit."}, {"q": "Wat maakt het Belinus-BMS bijzonder?", "a": "Eén batterijbeheersysteem voor elke chemie, gebouwd op knowhow uit de Formule 1.", "more": "BMS-1, de standaard voor batterijbeheer die Belinus ontwikkelt voor zijn volgende generatie modules, beheert supercondensator-, natrium-ion-, hybride ultracondensator- en LFP-modules met één architectuur, met balancering, temperatuurbewaking en stroomlimieten per chemie. De ontwikkeling steunt op de ervaring van onze partners in de Formule 1 en in high-performance automotive."}], "fr": [{"q": "Pourquoi des supercondensateurs ?", "a": "De la puissance en quelques secondes, jusqu’à 500 000 cycles, sans lithium.", "more": "Les supercondensateurs stockent l’énergie de manière électrostatique et non chimique. Ils se chargent et se déchargent en quelques secondes, encore et encore, et sont conçus pour jusqu’à 500 000 cycles (prévisionnel), de −40 °C à +65 °C. Idéals pour les pics, les impulsions, le soutien au réseau et la continuité d’alimentation."}, {"q": "Qu’est-ce qu’un ultracondensateur hybride ?", "a": "La puissance d’un condensateur avec plus d’énergie stockée, pour les véhicules et les cycles intensifs.", "more": "Un ultracondensateur hybride (condensateur lithium-ion) se situe entre un supercondensateur et une batterie : plus d’énergie qu’un supercondensateur, bien plus de puissance qu’une cellule de batterie, plus de 50 000 cycles et une durée de vie typique de 10 à 15 ans. Il convient aux véhicules et machines qui freinent et accélèrent toute la journée."}, {"q": "Pourquoi le sodium-ion pour le stockage stationnaire ?", "a": "Une longue durée de vie et une chaîne d’approvisionnement sans lithium, cobalt ni nickel.", "more": "Nos cellules sodium-ion NVPF dépassent 10 000 cycles jusqu’à 80 % d’état de santé, offrent 5C en continu et 20C en pointe, et fonctionnent de −30 °C à +55 °C. Elles peuvent être déchargées à 0 V pour le transport et le stockage, et ne contiennent ni lithium, ni cobalt, ni nickel."}, {"q": "Pourquoi trois technologies chez un seul partenaire ?", "a": "Chaque charge reçoit la bonne technologie, dans un seul système hybride.", "more": "Les supercondensateurs absorbent les pics, les ultracondensateurs hybrides les fortes puissances répétées, le sodium-ion l’énergie sur plusieurs heures. Belinus les combine dans un système hybride unique, avec sa propre gestion de batterie et la gestion énergétique Themis, qui décide à chaque instant quelle technologie prend la charge."}, {"q": "Où sont fabriqués les systèmes Belinus ?", "a": "Conçus et assemblés en Europe.", "more": "Belinus conçoit ses modules et systèmes en Europe, assemble ses packs en Europe et fabrique ses équipements avec des partenaires européens. Cela signifie des chaînes d’approvisionnement courtes, des normes et un support européens, et un pas vers la souveraineté énergétique européenne."}, {"q": "Qu’est-ce qui rend le BMS Belinus unique ?", "a": "Un seul système de gestion de batterie pour toutes les chimies, fondé sur le savoir-faire de la Formule 1.", "more": "Le BMS-1, standard de gestion de batterie que Belinus développe pour sa prochaine génération de modules, gère les modules supercondensateur, sodium-ion, ultracondensateur hybride et LFP avec une seule architecture, avec équilibrage, surveillance de la température et limites de courant propres à chaque chimie. Son développement s’appuie sur l’expérience de nos partenaires en Formule 1 et dans l’automobile haute performance."}], "de": [{"q": "Warum Superkondensatoren?", "a": "Leistung in Sekunden, bis zu 500.000 Zyklen, lithiumfrei.", "more": "Superkondensatoren speichern Energie elektrostatisch statt chemisch. Sie laden und entladen sich in Sekunden, immer wieder, und sind für bis zu 500.000 Zyklen (prognostiziert) von −40 °C bis +65 °C ausgelegt. Ideal für Lastspitzen, Pulse, Netzstützung und Überbrückung bei Stromausfällen."}, {"q": "Was ist ein Hybrid-Ultrakondensator?", "a": "Die Leistung eines Kondensators mit mehr gespeicherter Energie, für Fahrzeuge und harte Lastzyklen.", "more": "Ein Hybrid-Ultrakondensator (Lithium-Ionen-Kondensator) liegt zwischen Superkondensator und Batterie: mehr Energie als ein Superkondensator, weit mehr Leistung als eine Batteriezelle, über 50.000 Zyklen und eine typische Lebensdauer von 10 bis 15 Jahren. Er eignet sich für Fahrzeuge und Maschinen, die den ganzen Tag bremsen und beschleunigen."}, {"q": "Warum Natrium-Ionen für stationäre Speicher?", "a": "Lange Zyklenlebensdauer und eine Lieferkette ohne Lithium, Kobalt und Nickel.", "more": "Unsere NVPF-Natrium-Ionen-Zellen erreichen über 10.000 Zyklen bis 80 % State of Health, 5C Dauer- und 20C Spitzenleistung und arbeiten von −30 °C bis +55 °C. Sie lassen sich für Transport und Lagerung auf 0 V entladen und enthalten weder Lithium noch Kobalt oder Nickel."}, {"q": "Warum drei Technologien von einem Partner?", "a": "Jede Last bekommt die passende Technologie, in einem Hybridsystem.", "more": "Superkondensatoren übernehmen die Spitzen, Hybrid-Ultrakondensatoren die wiederholte Hochleistung, Natrium-Ionen die Energie über Stunden. Belinus kombiniert sie in einem Hybridsystem mit eigenem Batteriemanagement und dem Energiemanagement Themis, das in jedem Moment entscheidet, welche Technologie die Last trägt."}, {"q": "Wo werden Belinus-Systeme hergestellt?", "a": "In Europa entwickelt und montiert.", "more": "Belinus entwickelt seine Module und Systeme in Europa, montiert seine Packs in Europa und fertigt seine Geräte mit europäischen Partnern. Das bedeutet kurze Lieferketten, europäische Normen und Betreuung und einen Schritt hin zu europäischer Energiesouveränität."}, {"q": "Was ist das Besondere am Belinus-BMS?", "a": "Ein Batteriemanagementsystem für jede Zellchemie, aufgebaut auf Formel-1-Know-how.", "more": "BMS-1, der Batteriemanagement-Standard, den Belinus für seine nächste Modulgeneration entwickelt, steuert Superkondensator-, Natrium-Ionen-, Hybrid-Ultrakondensator- und LFP-Module mit einer einzigen Architektur, mit Balancing, Temperaturüberwachung und Stromgrenzen je Zellchemie. Die Entwicklung stützt sich auf die Erfahrung unserer Partner in der Formel 1 und im High-Performance-Automobilbereich."}], "es": [{"q": "¿Por qué supercondensadores?", "a": "Potencia en segundos, hasta 500.000 ciclos y sin litio.", "more": "Los supercondensadores almacenan la energía de forma electrostática, no química. Se cargan y descargan en segundos, una y otra vez, y están diseñados para hasta 500.000 ciclos (previstos), de −40 °C a +65 °C. Ideales para picos, pulsos, apoyo a la red y respaldo ante cortes."}, {"q": "¿Qué es un ultracondensador híbrido?", "a": "La potencia de un condensador con más energía almacenada, para vehículos y ciclos de trabajo exigentes.", "more": "Un ultracondensador híbrido (condensador de iones de litio) se sitúa entre un supercondensador y una batería: más energía que un supercondensador, mucha más potencia que una celda de batería, más de 50.000 ciclos y una vida útil típica de 10 a 15 años. Es idóneo para vehículos y máquinas que frenan y aceleran todo el día."}, {"q": "¿Por qué sodio-ion para el almacenamiento estacionario?", "a": "Larga vida útil y una cadena de suministro sin litio, cobalto ni níquel.", "more": "Nuestras celdas de sodio-ion NVPF superan los 10.000 ciclos hasta el 80 % de estado de salud, ofrecen 5C en continuo y 20C de pico, y funcionan de −30 °C a +55 °C. Pueden descargarse a 0 V para su transporte y almacenamiento, y no contienen litio, cobalto ni níquel."}, {"q": "¿Por qué tres tecnologías con un solo socio?", "a": "Cada carga recibe la tecnología adecuada, en un único sistema híbrido.", "more": "Los supercondensadores asumen los picos, los ultracondensadores híbridos la alta potencia repetida y el sodio-ion la energía durante horas. Belinus los combina en un único sistema híbrido, con su propia gestión de baterías y la gestión energética Themis, que decide en cada momento qué tecnología asume la carga."}, {"q": "¿Dónde se fabrican los sistemas Belinus?", "a": "Diseñados y ensamblados en Europa.", "more": "Belinus diseña sus módulos y sistemas en Europa, ensambla sus packs en Europa y fabrica sus equipos con socios europeos. Eso significa cadenas de suministro cortas, normas y soporte europeos, y un paso hacia la soberanía energética europea."}, {"q": "¿Qué tiene de especial el BMS de Belinus?", "a": "Un único sistema de gestión de baterías para todas las químicas, basado en la experiencia de la Fórmula 1.", "more": "El BMS-1, el estándar de gestión de baterías que Belinus está desarrollando para su próxima generación de módulos, gestiona módulos de supercondensador, sodio-ion, ultracondensador híbrido y LFP con una sola arquitectura, con equilibrado, control de temperatura y límites de corriente para cada química. Su desarrollo se apoya en la experiencia de nuestros socios en la Fórmula 1 y en la automoción de alto rendimiento."}], "it": [{"q": "Perché i supercondensatori?", "a": "Potenza in pochi secondi, fino a 500.000 cicli, senza litio.", "more": "I supercondensatori accumulano energia in modo elettrostatico anziché chimico. Si caricano e si scaricano in pochi secondi, ancora e ancora, e sono progettati per fino a 500.000 cicli (previsti), da −40 °C a +65 °C. Ideali per picchi, impulsi, supporto alla rete e continuità in caso di interruzioni."}, {"q": "Che cos’è un ultracondensatore ibrido?", "a": "La potenza di un condensatore con più energia accumulata, per veicoli e cicli di lavoro intensi.", "more": "Un ultracondensatore ibrido (condensatore agli ioni di litio) si colloca tra un supercondensatore e una batteria: più energia di un supercondensatore, molta più potenza di una cella di batteria, oltre 50.000 cicli e una vita tipica di 10-15 anni. È adatto a veicoli e macchine che frenano e accelerano tutto il giorno."}, {"q": "Perché il sodio-ione per l’accumulo stazionario?", "a": "Lunga durata in cicli e una filiera senza litio, cobalto e nichel.", "more": "Le nostre celle sodio-ione NVPF superano i 10.000 cicli fino all’80 % di stato di salute, offrono 5C in continuo e 20C di picco e funzionano da −30 °C a +55 °C. Possono essere scaricate a 0 V per il trasporto e lo stoccaggio e non contengono litio, cobalto né nichel."}, {"q": "Perché tre tecnologie da un unico partner?", "a": "Ogni carico riceve la tecnologia giusta, in un unico sistema ibrido.", "more": "I supercondensatori gestiscono i picchi, gli ultracondensatori ibridi la potenza elevata ripetuta, il sodio-ione l’energia per ore. Belinus li combina in un unico sistema ibrido, con una propria gestione delle batterie e la gestione energetica Themis, che decide istante per istante quale tecnologia sostiene il carico."}, {"q": "Dove vengono prodotti i sistemi Belinus?", "a": "Progettati e assemblati in Europa.", "more": "Belinus progetta i suoi moduli e sistemi in Europa, assembla i suoi pacchi in Europa e realizza i suoi dispositivi con partner europei. Questo significa filiere corte, standard e assistenza europei e un passo verso la sovranità energetica europea."}, {"q": "Che cosa ha di speciale il BMS di Belinus?", "a": "Un unico sistema di gestione delle batterie per ogni chimica, basato sul know-how della Formula 1.", "more": "Il BMS-1, lo standard di gestione delle batterie che Belinus sta sviluppando per la sua prossima generazione di moduli, gestisce moduli a supercondensatore, sodio-ione, ultracondensatore ibrido e LFP con un’unica architettura, con bilanciamento, monitoraggio della temperatura e limiti di corrente per ciascuna chimica. Lo sviluppo si basa sull’esperienza dei nostri partner nella Formula 1 e nell’automotive ad alte prestazioni."}]},QA_UI_B2B={"en": {"q": "Question", "a": "Answer", "more": "Read more", "less": "Close", "prev": "Previous question", "next": "Next question", "hide": "Close banner"}, "nl": {"q": "Vraag", "a": "Antwoord", "more": "Lees meer", "less": "Sluiten", "prev": "Vorige v

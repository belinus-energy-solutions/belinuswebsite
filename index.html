<style>/* ============================================================================
   Belinus — Colors & Type
   ----------------------------------------------------------------------------
   Derived from: Belinus Logo Vector.pdf (#2EB9EA), Style guide.pdf (dark cinematic
   photography, neon-blue accents, premium/confident mood) and belinus.com
   product copy. The brand reads: Belgian, engineered, premium, ultra-black.
   ========================================================================= */



/* ---- Arial Nova — brand font (replaces Helvetica/Arial fallback) -------- */
@font-face {
  font-family: 'Arial Nova';
  src: url('fonts/ArialNova-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Arial Nova';
  src: url('fonts/ArialNova-LightItalic.woff2') format('woff2');
  font-weight: 300;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'Arial Nova';
  src: url('fonts/ArialNova.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Arial Nova';
  src: url('fonts/ArialNova-Italic.woff2') format('woff2');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'Arial Nova';
  src: url('fonts/ArialNova-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Arial Nova Cond';
  src: url('fonts/ArialNovaCond-Light.woff2') format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Arial Nova Cond';
  src: url('fonts/ArialNovaCond.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Arial Nova Cond';
  src: url('fonts/ArialNovaCond-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}


:root {
  /* ---- Brand -------------------------------------------------------------- */
  --brand-blue:        #2EB9EA;   /* logo blue, exact (from vector PDF) */
  --brand-blue-bright: #3FCBFF;   /* neon / glow accent */
  --brand-blue-deep:   #1B8FBE;   /* pressed / shadow variant */
  --brand-blue-ink:    #003A54;   /* deep teal-blue for tinted dark surfaces */

  /* ---- Ultra black (core identity) --------------------------------------- */
  --ink-0:  #000000;   /* true black — panel glass, full bleed backgrounds */
  --ink-1:  #0A0C0F;   /* app background */
  --ink-2:  #121519;   /* elevated surface */
  --ink-3:  #1C2128;   /* card */
  --ink-4:  #272D36;   /* hairline / divider on dark */
  --ink-5:  #3A424D;   /* muted outline on dark */

  /* ---- Neutrals (light side) --------------------------------------------- */
  --paper:   #FFFFFF;
  --bone:    #F5F6F7;   /* page background on light */
  --mist:    #E7EAEE;   /* divider on light */
  --steel:   #AFB6BF;   /* muted text on light */
  --slate:   #5A6370;   /* secondary text on light */
  --graphite:#222830;   /* primary text on light */

  /* ---- Semantic (foreground on dark) ------------------------------------ */
  --fg-1: #FFFFFF;                 /* primary */
  --fg-2: rgba(255,255,255,0.72);  /* secondary */
  --fg-3: rgba(255,255,255,0.48);  /* tertiary / captions */
  --fg-4: rgba(255,255,255,0.24);  /* disabled / hairline labels */

  /* ---- Semantic (foreground on light) ----------------------------------- */
  --fgL-1: #0A0C0F;
  --fgL-2: #3A424D;
  --fgL-3: #7A828C;
  --fgL-4: #AFB6BF;

  /* ---- Status ------------------------------------------------------------ */
  --success: #37C98A;   /* "producing" / "savings" */
  --warning: #F5B301;   /* mid-day / caution */
  --danger:  #E85D4D;   /* fault / offline */
  --sun:     #FFB547;   /* sunlight accent (sparingly) */

  /* ---- Effects ----------------------------------------------------------- */
  --glow-blue:   0 0 24px rgba(0,161,233,0.55), 0 0 60px rgba(0,161,233,0.25);
  --glow-hair:   0 0 1px rgba(43,184,255,0.9),   0 0 8px rgba(43,184,255,0.45);
  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 32px rgba(0,0,0,0.45);
  --shadow-lift: 0 24px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
  --shadow-soft: 0 8px 24px rgba(10,12,15,0.08), 0 1px 2px rgba(10,12,15,0.06);

  /* ---- Radii — restrained, engineered ------------------------------------ */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* ---- Spacing (4px base) ------------------------------------------------ */
  --s-1: 4px;   --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 24px;  --s-6: 32px;  --s-7: 48px;  --s-8: 64px;
  --s-9: 96px;  --s-10: 128px;

  /* ---- Type families -----------------------------------------------------
     belinus.com uses Helvetica (Wix "helvetica-w01-light/roman") for the hero
     display and for most headings; Space Grotesk is used for the all-caps
     tag/subhead copy. We mirror that pairing.

     Helvetica is not a webfont we can embed freely; the brand uses Arial Nova
     (TTF files in /fonts) as its primary type. It loads via @font-face above. */
  --font-display: 'Arial Nova', 'Helvetica Neue', Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
  --font-sans:    'Arial Nova', 'Helvetica Neue', Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
  --font-cond:    'Arial Nova Cond', 'Arial Narrow', 'Arial Nova', Helvetica, Arial, sans-serif;
  --font-caps:    'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* ---- Type scale (semantic) -------------------------------------------- */
  /* ---- Type scale (semantic) --------------------------------------------
     belinus.com uses Helvetica LIGHT (300) for all display sizes — mirror that.
     Tight tracking and generous leading (1.4) are the house defaults. */
  --t-hero-size:   clamp(48px, 7vw, 96px);
  --t-hero-lh:     1.08;
  --t-hero-ls:     -0.02em;
  --t-hero-w:      300;

  --t-h1-size: 56px;  --t-h1-lh: 1.1;   --t-h1-ls: -0.015em; --t-h1-w: 300;
  --t-h2-size: 40px;  --t-h2-lh: 1.15;  --t-h2-ls: -0.01em;  --t-h2-w: 300;
  --t-h3-size: 28px;  --t-h3-lh: 1.25;  --t-h3-ls: -0.005em; --t-h3-w: 400;
  --t-h4-size: 20px;  --t-h4-lh: 1.4;   --t-h4-ls: 0;        --t-h4-w: 500;

  --t-body-size:  16px; --t-body-lh: 1.55; --t-body-w: 400;
  --t-lead-size:  18px; --t-lead-lh: 1.55; --t-lead-w: 400;
  --t-small-size: 14px; --t-small-lh: 1.5;
  --t-cap-size:   12px; --t-cap-lh: 1.35; --t-cap-ls: 0.12em; /* uppercase */
  --t-mono-size:  13px;

  /* ---- Motion ------------------------------------------------------------ */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in:    cubic-bezier(0.55, 0, 1, 0.45);
  --ease-std:   cubic-bezier(0.4, 0, 0.2, 1);
  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 320ms;
  --dur-4: 600ms;
}

/* ==========================================================================
   Semantic element defaults — drop this stylesheet in and get sane defaults
   ========================================================================= */

html, body {
  font-family: var(--font-sans);
  font-size: var(--t-body-size);
  line-height: var(--t-body-lh);
  color: var(--fgL-1);
  background: var(--bone);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

.on-dark, body.on-dark {
  background: var(--ink-1);
  color: var(--fg-1);
}

h1, h2, h3, h4, h5 {
  font-family: var(--font-display);
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: var(--t-h1-size); line-height: var(--t-h1-lh); letter-spacing: var(--t-h1-ls); font-weight: var(--t-h1-w); }
h2 { font-size: var(--t-h2-size); line-height: var(--t-h2-lh); letter-spacing: var(--t-h2-ls); font-weight: var(--t-h2-w); }
h3 { font-size: var(--t-h3-size); line-height: var(--t-h3-lh); letter-spacing: var(--t-h3-ls); font-weight: var(--t-h3-w); }
h4 { font-size: var(--t-h4-size); line-height: var(--t-h4-lh); letter-spacing: var(--t-h4-ls); font-weight: var(--t-h4-w); }

.hero {
  font-family: var(--font-display);
  font-size: var(--t-hero-size);
  line-height: var(--t-hero-lh);
  letter-spacing: var(--t-hero-ls);
  font-weight: var(--t-hero-w);
}

p { margin: 0 0 var(--s-3) 0; text-wrap: pretty; }
.lead  { font-size: var(--t-lead-size); line-height: var(--t-lead-lh); }
.small { font-size: var(--t-small-size); line-height: var(--t-small-lh); }

.eyebrow, .caption {
  font-family: var(--font-caps);
  font-size: var(--t-cap-size);
  line-height: var(--t-cap-lh);
  letter-spacing: var(--t-cap-ls);
  text-transform: uppercase;
  font-weight: 400;
  color: var(--fgL-2);
}
.on-dark .eyebrow, .on-dark .caption { color: var(--fg-2); }

code, .mono {
  font-family: var(--font-mono);
  font-size: var(--t-mono-size);
  letter-spacing: 0;
}

/* The lowercase "belinus" wordmark style (for inline brand mentions) */
.wordmark {
  font-family: var(--font-sans);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--brand-blue);
  text-transform: lowercase;
}

/* Utility: a subtle neon-blue hairline accent (seen in product photos) */
.accent-hair {
  position: relative;
}
.accent-hair::after {
  content: "";
  position: absolute; inset: auto 0 0 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brand-blue) 50%, transparent);
  box-shadow: var(--glow-hair);
}
/* ================================================================
   Corporate site — layout & chrome on top of colors_and_type.css
   ================================================================ */

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--ink-0);
  color: var(--fg-1);
  overflow-x: hidden;
}

/* ---- Grain + vignette treatment for cinematic feel ---- */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(46,185,234,0.05), transparent 60%),
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0,0,0,0.6), transparent 60%);
}

/* ---- Layout containers ---- */
.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 48px;
}
.wrap-narrow { max-width: 960px; margin: 0 auto; padding: 0 48px; }
.wrap-wide   { max-width: 1480px; margin: 0 auto; padding: 0 48px; }

/* ---- Section rhythm ---- */
section {
  position: relative;
  padding: clamp(96px, 14vh, 180px) 0;
  z-index: 2;
}
section + section {
  border-top: 1px solid var(--ink-4);
}

/* ---- Eyebrows ---- */
.eyebrow {
  display: inline-block;
  color: var(--brand-blue);
  font-family: var(--font-caps);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 32px;
}
.eyebrow.muted { color: var(--fg-3); }

.eyebrow-dot::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--brand-blue);
  vertical-align: middle;
  margin-right: 10px;
  box-shadow: 0 0 8px var(--brand-blue);
  transform: translateY(-2px);
}

/* ---- Display type ---- */
.display {
  font-family: var(--font-display);
  font-weight: 200;
  font-size: clamp(44px, 7.2vw, 112px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--fg-1);
  text-wrap: balance;
}
.display em {
  font-style: normal;
  color: var(--brand-blue);
}

.display-mid {
  font-family: var(--font-display);
  font-weight: 250;
  font-size: clamp(32px, 4.4vw, 64px);
  line-height: 1.08;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.display-sm {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(22px, 2.2vw, 30px);
  line-height: 1.22;
  letter-spacing: -0.01em;
}

.body-lg {
  font-size: 18px;
  line-height: 1.55;
  color: var(--fg-2);
  max-width: 62ch;
  text-wrap: pretty;
  font-weight: 300;
}
.body-md {
  font-size: 15px;
  line-height: 1.65;
  color: var(--fg-2);
  max-width: 60ch;
  font-weight: 300;
}

/* ---- Rule / divider ---- */
.rule {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink-4) 20%, var(--ink-4) 80%, transparent);
}
.rule-blue {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--brand-blue) 50%, transparent);
  opacity: 0.65;
}

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 24px;
  font-family: var(--font-caps);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  background: transparent;
  color: var(--fg-1);
  border: 1px solid var(--ink-5);
  border-radius: var(--r-pill);
  cursor: pointer;
  text-decoration: none;
  transition: all 200ms var(--ease-out);
}
.btn:hover {
  border-color: var(--brand-blue);
  color: var(--brand-blue);
  box-shadow: 0 0 0 4px rgba(46,185,234,0.08);
}
.btn-arrow::after {
  content: "→";
  font-family: var(--font-sans);
  font-size: 16px;
  letter-spacing: 0;
  transition: transform 200ms var(--ease-out);
}
.btn:hover.btn-arrow::after { transform: translateX(4px); }

.btn-ghost {
  padding: 0;
  background: none;
  border: none;
  color: var(--fg-2);
}
.btn-ghost:hover { color: var(--brand-blue); box-shadow: none; }

/* ---- Label system ---- */
.label {
  font-family: var(--font-caps);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.num {
  font-family: var(--font-caps);
  font-feature-settings: "tnum";
  font-weight: 300;
  letter-spacing: -0.01em;
}

/* ---- Card surfaces ---- */
.panel {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  padding: 32px;
  transition: border-color 300ms var(--ease-out), background 300ms var(--ease-out);
}
.panel:hover {
  border-color: var(--ink-5);
  background: linear-gradient(180deg, rgba(46,185,234,0.03), rgba(255,255,255,0));
}

/* ---- Grid utilities ---- */
.cols-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 48px; }
.cols-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 32px; }
.cols-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 24px; }
.cols-12 { display: grid; grid-template-columns: repeat(12,1fr); gap: 24px; }

@media (max-width: 900px) {
  .cols-2, .cols-3, .cols-4 { grid-template-columns: 1fr; gap: 32px; }
  .wrap, .wrap-narrow, .wrap-wide { padding: 0 24px; }
  section { padding: 80px 0; }
}

/* ---- Reveal animation ---- */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 900ms var(--ease-out), transform 900ms var(--ease-out);
}
.reveal.is-in {
  opacity: 1;
  transform: translateY(0);
}

/* ---- Focus ring ---- */
:focus-visible {
  outline: 2px solid var(--brand-blue);
  outline-offset: 3px;
}
/* ================================================================
   Corporate site — component styles (header, hero, innovation,
   architecture, ems, products, partners, references, roadmap,
   contact, footer)
   ================================================================ */

/* ------------------ Header ------------------ */
.site-header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 16px 0;
  transition: background 300ms var(--ease-out), padding 300ms var(--ease-out);
  background: linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
}
.site-header.is-scrolled {
  padding: 10px 0;
  background: rgba(6,8,10,0.78);
  backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--ink-4);
}
.site-header-inner {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 24px;
}
.site-header-right { margin-left: auto; }

/* ---- Desktop page navigation ---- */
.site-nav { display: none; gap: 32px; margin-left: 24px; }
.site-nav a {
  font-family: var(--font-caps);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-2); text-decoration: none;
  padding: 6px 0;
  border-bottom: 1px solid transparent;
  transition: color 200ms var(--ease-out), border-color 200ms var(--ease-out);
}
.site-nav a:hover { color: var(--fg-1); }
.site-nav a.is-active { color: var(--fg-1); border-bottom-color: var(--brand-blue); }
.site-nav a:focus-visible { outline: 1px solid var(--brand-blue); outline-offset: 4px; }
/* Horizontal menu hidden on all screen sizes: navigation is in the side menu. */
.drawer-nav a.is-active .drawer-nav-label { color: var(--brand-blue); }
.site-logo img { height: 22px; display: block; }
.site-header-right {
  display: flex; align-items: center; gap: 12px;
}

/* ---- Hamburger ---- */
.hamburger {
  width: 44px; height: 44px;
  display: inline-flex; flex-direction: column;
  justify-content: center; align-items: flex-start;
  gap: 5px;
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 0 0 0 8px;
}
.hamburger:focus-visible { outline: 1px solid var(--brand-blue); outline-offset: 2px; border-radius: 4px; }
.hamburger span {
  display: block; height: 1.5px;
  background: var(--fg-1);
  transform-origin: center;
  transition: width 320ms var(--ease-out), transform 320ms var(--ease-out),
              opacity 200ms var(--ease-out), background 200ms var(--ease-out);
}
.hamburger span { width: 24px; }
/* hover: outer lines shorten (staggered), centre line steps forward once */
.hamburger { overflow: hidden; }
.hamburger:hover span { background: var(--brand-blue); }
.hamburger:hover span:nth-child(1) { width: 14px; }
.hamburger:hover span:nth-child(3) { width: 19px; transition-delay: 60ms; }
.hamburger:hover span:nth-child(2) { transform: translateX(6px); transition-delay: 30ms; }
/* open: morph into a cross */
.hamburger.is-open span { width: 24px; transition-delay: 0ms; }
.hamburger.is-open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.hamburger.is-open span:nth-child(2) { opacity: 0; transform: translateX(-8px); }
.hamburger.is-open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
@media (prefers-reduced-motion: reduce) {
  .hamburger span { transition: none; animation: none !important; }
}

/* ---- Region badge ---- */
.region-badge {
  display: inline-flex; align-items: center; gap: 10px;
  background: transparent; border: 0;
  color: var(--fg-2);
  padding: 8px 4px;
  font-family: var(--font-caps);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer; white-space: nowrap;
  transition: color 200ms var(--ease-out);
}
.region-badge:hover { color: var(--fg-1); }
.region-badge:hover .region-country { color: var(--brand-blue); }
.region-badge:focus-visible { outline: 1px solid var(--brand-blue); outline-offset: 4px; border-radius: 4px; }
.region-country { color: var(--fg-1); transition: color 200ms var(--ease-out); }
.region-seg { color: var(--brand-blue); }
.region-sep { opacity: 0.35; }
.intl-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--brand-blue);
  box-shadow: 0 0 6px var(--brand-blue);
}
.header-cta { padding: 10px 18px !important; font-size: 11px !important; }

@media (max-width: 640px) {
  .header-cta { display: none; }
  .region-badge { gap: 7px; letter-spacing: 0.08em; }
  .region-country { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
}

/* ------------------ Drawer ------------------ */
.drawer-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 300ms var(--ease-out);
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: min(460px, 100vw);
  background: rgba(10,12,15,0.98);
  backdrop-filter: blur(24px) saturate(140%);
  border-right: 1px solid var(--ink-4);
  box-shadow: 20px 0 60px rgba(0,0,0,0.5);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 380ms var(--ease-out);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.drawer.is-open { transform: translateX(0); }

.drawer-head, .drawer-foot {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 28px;
}
.drawer-head { border-bottom: 1px solid var(--ink-4); }
.drawer-foot { border-top: 1px solid var(--ink-4); }
.drawer-close {
  position: relative;
  width: 36px; height: 36px;
  background: transparent; border: 0; padding: 0;
  cursor: pointer;
  transition: transform 260ms cubic-bezier(.2,.7,.2,1);
}
.drawer-close span {
  position: absolute; left: 50%; top: 50%;
  width: 22px; height: 2px; margin: -1px 0 0 -11px;
  background: var(--fg-2); border-radius: 2px;
  transition: background 200ms, transform 260ms cubic-bezier(.2,.7,.2,1);
}
.drawer-close span:nth-child(1) { transform: rotate(45deg) scaleX(0); }
.drawer-close span:nth-child(2) { transform: rotate(-45deg) scaleX(0); }
.drawer.is-open .drawer-close span:nth-child(1) { transform: rotate(45deg) scaleX(1); transition-delay: 180ms; }
.drawer.is-open .drawer-close span:nth-child(2) { transform: rotate(-45deg) scaleX(1); transition-delay: 260ms; }
.drawer-close:hover { transform: rotate(90deg); }
.drawer-close:hover span { background: var(--brand-blue); transition-delay: 0ms; }
.drawer-close:focus-visible { outline: 1px solid var(--brand-blue); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  .drawer-close, .drawer-close span { transition: none !important; }
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 28px 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-5) transparent;
}
.drawer-body::-webkit-scrollbar { width: 6px; }
.drawer-body::-webkit-scrollbar-thumb { background: var(--ink-5); border-radius: 3px; }

/* Drawer nav */
.drawer-nav {
  display: flex; flex-direction: column;
  border-top: 1px solid var(--ink-4);
  margin-bottom: 32px;
}
.drawer-nav a {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 4px;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 22px;
  letter-spacing: -0.01em;
  color: var(--fg-1);
  text-decoration: none;
  border-bottom: 1px solid var(--ink-4);
  transition: color 180ms var(--ease-out), padding 180ms var(--ease-out);
}
.drawer-nav a:hover {
  color: var(--brand-blue);
  padding-left: 12px;
}
.drawer-nav-arrow {
  font-size: 16px; color: var(--fg-4);
  transition: transform 180ms var(--ease-out), color 180ms var(--ease-out);
}
.drawer-nav a:hover .drawer-nav-arrow { color: var(--brand-blue); transform: translateX(4px); }

/* Drawer sections */
.drawer-section {
  margin-bottom: 32px;
  padding: 0;            /* not a page section: no section rhythm */
  border-top: 0;
}
.drawer-section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.drawer-seg {
  display: inline-flex;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-pill);
  padding: 2px;
}
.drawer-seg-btn {
  background: transparent; border: none;
  color: var(--fg-3);
  font-family: var(--font-caps);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em;
  padding: 5px 12px;
  border-radius: var(--r-pill);
  cursor: pointer;
  transition: all 180ms var(--ease-out);
}
.drawer-seg-btn.is-active {
  background: var(--brand-blue);
  color: var(--ink-0);
}

/* Countries */
.drawer-countries {
  display: flex; flex-direction: column;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  overflow: hidden;
}
.drawer-country {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--ink-4);
  gap: 12px;
  transition: background 180ms var(--ease-out);
}
.drawer-country:last-child { border-bottom: none; }
.drawer-country.is-active { background: rgba(46,185,234,0.06); }
.drawer-country-pick {
  display: flex; align-items: center; gap: 12px;
  background: transparent; border: none;
  color: var(--fg-1);
  cursor: pointer;
  padding: 4px 0;
  flex: 1;
  text-align: left;
}
.drawer-country-code {
  font-family: var(--font-caps);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--fg-3);
  border: 1px solid var(--ink-5);
  padding: 5px 7px;
  border-radius: var(--r-xs);
  min-width: 32px; text-align: center;
}
.drawer-country.is-active .drawer-country-code {
  color: var(--brand-blue);
  border-color: var(--brand-blue);
}
.drawer-country-name { display: flex; flex-direction: column; gap: 2px; line-height: 1.2; }
.drawer-country-name .n { font-size: 14px; color: var(--fg-1); }
.drawer-country-name .native { font-size: 11px; color: var(--fg-3); }
.drawer-country-langs { display: flex; gap: 4px; }
.drawer-lang {
  font-family: var(--font-caps);
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--fg-2);
  background: transparent;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-xs);
  padding: 4px 7px;
  cursor: pointer;
  transition: all 160ms var(--ease-out);
}
.drawer-lang:hover { border-color: var(--brand-blue); color: var(--brand-blue); }
.drawer-lang.is-active {
  background: var(--brand-blue);
  color: var(--ink-0);
  border-color: var(--brand-blue);
}

/* Login */
.drawer-login-stack { display: flex; flex-direction: column; gap: 8px; }
.drawer-login-btn {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px;
  background: transparent;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  color: var(--fg-1);
  text-decoration: none;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 200ms var(--ease-out);
}
.drawer-login-btn:hover {
  border-color: var(--brand-blue);
  background: rgba(46,185,234,0.04);
}
.drawer-login-btn.primary {
  border-color: var(--brand-blue);
  background: rgba(46,185,234,0.08);
}
.drawer-login-btn .icon {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--ink-5);
  border-radius: var(--r-xs);
  font-family: var(--font-caps);
  font-size: 12px;
  color: var(--brand-blue);
  flex-shrink: 0;
}
.drawer-login-btn > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.drawer-login-btn strong { font-weight: 500; font-size: 14px; color: var(--fg-1); }
.drawer-login-btn .sub { font-size: 12px; color: var(--fg-3); font-weight: 300; }

.drawer-login-form { display: flex; flex-direction: column; gap: 14px; }
.drawer-login-form label { display: flex; flex-direction: column; gap: 6px; }
.drawer-login-form input {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--ink-5);
  border-radius: var(--r-sm);
  color: var(--fg-1);
  padding: 12px 14px;
  font: inherit;
  font-size: 14px;
}
.drawer-login-form input:focus {
  outline: none;
  border-color: var(--brand-blue);
  background: rgba(46,185,234,0.06);
}
.drawer-login-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.drawer-forgot { margin-top: 4px; text-decoration: none; }
.drawer-forgot:hover { color: var(--brand-blue); }
.muted { color: var(--fg-4); }

/* ------------------ Hero (Puma full-bleed) ------------------ */
.hero-section {
  position: relative;
  min-height: 100vh;
  padding: 0;
  display: flex; align-items: flex-end;
  overflow: hidden;
  border-top: none;
}
.hero-section + section { border-top: 1px solid var(--ink-4); }
.hero-bg {
  position: absolute; inset: 0;
  z-index: 0;
}
.hero-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 65% 50%;
  filter: contrast(1.1) brightness(0.95);
}
.hero-bg-mask {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.15) 25%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.85) 100%),
    linear-gradient(90deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.25) 45%, transparent 70%);
}
.hero-inner {
  position: relative; z-index: 2;
  padding-top: 120px; padding-bottom: 96px;
  min-height: 100vh;
  display: flex; align-items: flex-end;
}
.hero-left { max-width: 720px; }
.hero-scrollhint {
  position: absolute; bottom: 32px; right: 48px;
  z-index: 2;
  display: flex; align-items: center; gap: 12px;
}
.hero-scrolltick {
  width: 40px; height: 1px;
  background: var(--brand-blue);
  box-shadow: 0 0 8px var(--brand-blue);
  animation: tick 2.2s var(--ease-out) infinite;
}
@keyframes tick {
  0%, 100% { transform: scaleX(0.2); transform-origin: left; opacity: 0.4; }
  50%      { transform: scaleX(1);   transform-origin: left; opacity: 1;   }
}
@media (max-width: 900px) {
  .hero-inner { padding-top: 100px; padding-bottom: 72px; }
  .hero-scrollhint { left: 24px; right: auto; bottom: 24px; }
  .hero-bg img { object-position: 60% 50%; }
  .hero-bg-mask {
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.9) 100%);
  }
}

/* ------------------ Section head shared ------------------ */
.section-head {
  max-width: 920px;
  margin-bottom: 80px;
}

/* ------------------ Pillars ------------------ */
.pillars-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--ink-4);
  border: 1px solid var(--ink-4);
}
.pillar {
  background: var(--ink-0);
  padding: 64px 56px;
  transition: background 300ms var(--ease-out);
}
.pillar:hover { background: rgba(46,185,234,0.03); }
.pillar-num {
  font-family: var(--font-caps);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--brand-blue);
  margin-bottom: 32px;
}
@media (max-width: 900px) {
  .pillars-grid { grid-template-columns: 1fr; }
  .pillar { padding: 40px 32px; }
}

/* ------------------ Innovation / Cell switch ------------------ */
.cell-switch {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--ink-4);
  border: 1px solid var(--ink-4);
  margin-bottom: 64px;
}
.cell-switch-btn {
  background: var(--ink-0);
  border: none;
  padding: 24px 28px;
  text-align: left;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 6px;
  transition: all 200ms var(--ease-out);
  color: var(--fg-2);
}
.cell-switch-btn:hover { background: rgba(46,185,234,0.03); color: var(--fg-1); }
.cell-switch-btn.is-active {
  background: rgba(46,185,234,0.06);
  color: var(--fg-1);
  border-bottom: 1px solid var(--brand-blue);
  box-shadow: inset 0 -1px 0 var(--brand-blue);
}
.cell-switch-btn.is-active .label { color: var(--brand-blue); }
.cell-switch-code {
  font-size: 13px;
  font-weight: 400;
}
@media (max-width: 900px) { .cell-switch { grid-template-columns: 1fr; } }

.cell-detail {
  display: grid; grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: start;
}
.cell-detail > * { min-width: 0; }
.cell-detail .spec-list { margin-top: 8px; }
@media (max-width: 900px) { .cell-detail { grid-template-columns: 1fr; gap: 48px; } }

.cell-detail-vis {
  display: flex; justify-content: center;
  padding: 40px;
  position: relative;
}

/* Cell visualisation (cylindrical) */
.cell-tube {
  position: relative;
  width: 160px; height: 400px;
}
.cell-tube-body {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, #1a1f26 0%, #2a3240 20%, #434c5a 50%, #2a3240 80%, #1a1f26 100%);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 40px 80px rgba(0,0,0,0.7);
}
.cell-tube-stripe {
  position: absolute; left: 0; right: 0; top: 38%;
  height: 4px;
  background: var(--brand-blue);
  box-shadow: 0 0 16px var(--brand-blue), 0 0 32px rgba(46,185,234,0.4);
}
.cell-tube-code {
  position: absolute; top: 48%; left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.1em;
}
.cell-tube-ridges {
  position: absolute; inset: 12px 8px 80px;
  display: flex; flex-direction: column; justify-content: space-around;
}
.cell-tube-ridges span {
  height: 1px;
  background: rgba(255,255,255,0.04);
}
.cell-tube-cap {
  position: absolute; left: -2px; right: -2px; height: 14px;
  background: linear-gradient(180deg, #6a7586 0%, #2a3240 100%);
  border-radius: 4px;
}
.cell-tube-cap-top { top: -4px; }
.cell-tube-cap-bot { bottom: -4px; background: linear-gradient(0deg, #6a7586 0%, #2a3240 100%); }
.cell-tube-glow {
  position: absolute; inset: -60px;
  border-radius: 50%;
  opacity: 0.6;
  filter: blur(48px);
  z-index: -1;
}
.cell-tube-glow-nib { background: radial-gradient(circle, rgba(46,185,234,0.55), transparent 70%); }
.cell-tube-glow-sc  { background: radial-gradient(circle, rgba(120,220,255,0.55), transparent 70%); }
.cell-tube-glow-huc { background: radial-gradient(circle, rgba(180,140,255,0.45), transparent 70%); }
.cell-tube-dim {
  position: absolute; bottom: -40px; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-caps);
  font-size: 10px; letter-spacing: 0.18em;
  color: var(--fg-3);
  text-transform: uppercase;
}

.spec-list {
  margin: 40px 0 0;
  border-top: 1px solid var(--ink-4);
  padding: 0;
}
.spec-row {
  display: grid; grid-template-columns: 1fr 1.4fr;
  padding: 14px 0;
  border-bottom: 1px solid var(--ink-4);
  gap: 24px;
  align-items: baseline;
}
.spec-row .label { color: var(--fg-3); }
.spec-row .num { color: var(--fg-1); font-size: 15px; }
.spec-row dt, .spec-row dd { margin: 0; }

/* ------------------ Architecture / stack ------------------ */
.stack-diagram {
  display: flex; flex-direction: column;
  gap: 2px;
  max-width: 1040px;
  margin: 0 auto 64px;
}
.stack-layer {
  display: grid; grid-template-columns: 80px 1fr auto;
  gap: 32px;
  align-items: center;
  padding: 22px 28px;
  background: var(--ink-0);
  border: 1px solid var(--ink-4);
  transition: all 200ms var(--ease-out);
}
.stack-layer:hover {
  background: rgba(46,185,234,0.03);
  border-color: var(--ink-5);
}
.stack-layer-own { border-left: 2px solid var(--brand-blue); }
.stack-layer-partner { border-left: 2px solid var(--ink-5); }
.stack-level { color: var(--fg-3); }
.stack-main { display: flex; flex-direction: column; gap: 4px; }
.stack-label { color: var(--fg-1); font-size: 17px; font-weight: 400; }
.stack-detail { color: var(--fg-2); font-size: 13px; }
.stack-tag {
  font-family: var(--font-caps);
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 6px 10px;
  border-radius: var(--r-xs);
}
.stack-tag.own {
  background: rgba(46,185,234,0.08);
  color: var(--brand-blue);
  border: 1px solid rgba(46,185,234,0.3);
}
.stack-tag.partner {
  background: rgba(255,255,255,0.02);
  color: var(--fg-2);
  border: 1px solid var(--ink-5);
}

.arch-specs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--ink-4);
  border: 1px solid var(--ink-4);
  max-width: 1040px;
  margin: 0 auto;
}
.arch-specs-row {
  background: var(--ink-0);
  padding: 24px 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.arch-specs-row .num { color: var(--fg-1); font-size: 14px; }
@media (max-width: 900px) {
  .stack-layer { grid-template-columns: 60px 1fr; gap: 16px; }
  .stack-layer .stack-tag { grid-column: 2; justify-self: start; }
  .arch-specs { grid-template-columns: 1fr 1fr; }
}

/* ------------------ EMS ------------------ */
.ems-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-bottom: 80px;
}
@media (max-width: 900px) { .ems-grid { grid-template-columns: 1fr; } }
.ems-card {
  background: linear-gradient(180deg, rgba(46,185,234,0.02), transparent);
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  padding: 40px;
}
.ems-card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--ink-4);
}
.ems-list {
  list-style: none; padding: 0; margin: 0;
}
.ems-list li {
  color: var(--fg-2);
  font-size: 14px;
  line-height: 1.6;
  padding: 14px 0;
  border-bottom: 1px solid var(--ink-4);
}
.ems-list li:last-child { border-bottom: none; }
.ems-list li b { color: var(--fg-1); font-weight: 500; }

.ems-schematic {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 40px 0;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(46,185,234,0.06), transparent 70%);
}
.ems-sig {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-pill);
  background: var(--ink-0);
}
.ems-sig .mono { font-size: 11px; color: var(--fg-2); }
.ems-sig-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--brand-blue);
  box-shadow: 0 0 6px var(--brand-blue);
}
.ems-arrow { color: var(--brand-blue); font-size: 20px; opacity: 0.7; }
.ems-core {
  padding: 16px 24px;
  border: 1px solid var(--brand-blue);
  border-radius: var(--r-md);
  background: rgba(46,185,234,0.1);
  text-align: center;
  box-shadow: 0 0 24px rgba(46,185,234,0.2);
}
.ems-core-name { color: var(--fg-1); font-weight: 500; font-size: 14px; letter-spacing: 0.02em; }
.ems-core-sub  { color: var(--brand-blue); font-size: 10px; margin-top: 4px; }
.ems-out {
  display: flex; flex-direction: column; gap: 8px;
}
.ems-out .mono {
  font-size: 11px; color: var(--fg-2);
  padding: 4px 12px;
  border-left: 1px solid var(--brand-blue);
}

/* ------------------ Products ------------------ */
.products-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
}
@media (max-width: 1100px) { .products-grid { grid-template-columns: 1fr; } }
.products-grid > * { min-width: 0; }
.product-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  padding: 48px;
  transition: border 300ms var(--ease-out);
}
.product-card:hover { border-color: var(--brand-blue); }
.product-card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--ink-4);
}
.product-bom {
  list-style: none; padding: 0; margin: 0;
}
.product-bom li {
  display: grid; grid-template-columns: 32px 1fr;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--ink-4);
  color: var(--fg-2);
  font-size: 14px;
  align-items: baseline;
}
.product-bom li:last-child { border-bottom: none; }
.product-bom li .label { color: var(--fg-3); font-size: 10px; }

/* ------------------ Cell chips (lithium / energy density badges) ---------- */
.cell-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.cell-chip {
  font-family: var(--font-caps);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--ink-5);
  border-radius: var(--r-pill);
  color: var(--fg-2);
  background: rgba(255,255,255,0.02);
}
.cell-chip:first-child {
  border-color: rgba(46,185,234,0.5);
  color: var(--brand-blue);
  background: rgba(46,185,234,0.06);
}

/* ------------------ Puma break ------------------ */
.puma-break {
  position: relative;
  padding: clamp(140px, 22vh, 260px) 0;
  overflow: hidden;
  border-top: 1px solid var(--ink-4);
}
.puma-media {
  position: absolute; inset: 0;
  z-index: 0;
}
.puma-media img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 60% 50%;
  filter: contrast(1.1);
}
.puma-mask {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.1) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
}
.puma-inner {
  position: relative; z-index: 1;
  max-width: 1080px;
}
@media (max-width: 900px) {
  .puma-mask {
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.65) 60%, rgba(0,0,0,0.9) 100%);
  }
}

/* ------------------ F1 BMS spotlight ------------------ */
.f1-bms-inner {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
@media (max-width: 900px) { .f1-bms-inner { grid-template-columns: 1fr; gap: 48px; } }
.f1-bms-media {
  position: relative;
  aspect-ratio: 1/1;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--ink-4);
  box-shadow: var(--shadow-lift);
}
.f1-bms-media img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: contrast(1.1) brightness(0.95);
}
.f1-bms-media-tag {
  position: absolute; bottom: 16px; left: 16px;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--brand-blue);
  padding: 6px 10px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(46,185,234,0.35);
  border-radius: var(--r-xs);
  backdrop-filter: blur(8px);
}
.f1-specs {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--ink-4);
  border: 1px solid var(--ink-4);
  margin-bottom: 32px;
}
.f1-spec {
  background: var(--ink-0);
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 6px;
}
.f1-spec-v { color: var(--fg-1); font-size: 14px; }
.f1-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.f1-tag {
  font-family: var(--font-caps);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  padding: 6px 12px;
  border: 1px solid var(--ink-5);
  border-radius: var(--r-pill);
  color: var(--fg-2);
}

/* ------------------ Partners ------------------ */
.partner-block-head {
  display: flex; align-items: center; margin-bottom: 24px;
}
.partner-grid {
  display: grid; grid-template-columns: 1fr;
  gap: 0;
}
.partner-row {
  display: grid; grid-template-columns: 260px 1fr;
  gap: 56px;
  align-items: center;
  padding: 32px 0;
  border-bottom: 1px solid var(--ink-4);
}
.partner-logo {
  font-size: 32px;
  line-height: 1;
  color: var(--fg-1);
  user-select: none;
}
.partner-desc {
  color: var(--fg-2);
  font-size: 14px;
}
@media (max-width: 900px) {
  .partner-row { grid-template-columns: 1fr; gap: 8px; }
}

/* ------------------ References ------------------ */
.ref-wall {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--ink-4);
  border: 1px solid var(--ink-4);
}
.ref-cell {
  background: var(--ink-0);
  padding: 40px 32px;
  min-height: 140px;
  display: flex; flex-direction: column; justify-content: center;
  gap: 8px;
  transition: background 300ms var(--ease-out);
}
.ref-cell:hover { background: rgba(46,185,234,0.03); }
.ref-name {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 300;
  letter-spacing: -0.005em;
  color: var(--fg-1);
  text-wrap: balance;
}
.ref-cell { min-width: 0; }
.ref-segment { color: var(--fg-3); }
@media (max-width: 900px) { .ref-wall { grid-template-columns: 1fr 1fr; } }

/* ------------------ Roadmap ------------------ */
.roadmap-list {
  list-style: none; padding: 0; margin: 0;
  max-width: 960px;
}
.roadmap-row {
  display: grid; grid-template-columns: 120px 40px 1fr;
  gap: 24px;
  align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid var(--ink-4);
}
.roadmap-date { color: var(--fg-3); font-size: 13px; }
.roadmap-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--ink-5);
  justify-self: center;
  position: relative;
}
.roadmap-event { color: var(--fg-1); font-size: 16px; font-weight: 300; }
.roadmap-row.is-done .roadmap-dot { background: var(--fg-3); }
.roadmap-row.is-done .roadmap-date { color: var(--fg-2); }
.roadmap-row.is-now .roadmap-dot {
  background: var(--brand-blue);
  box-shadow: 0 0 12px var(--brand-blue), 0 0 0 3px rgba(46,185,234,0.18);
}
.roadmap-row.is-now .roadmap-date { color: var(--brand-blue); }
.roadmap-row.is-next .roadmap-dot {
  background: transparent; border: 2px solid var(--brand-blue);
}
.roadmap-row.is-future { opacity: 0.85; }

/* ------------------ Contact ------------------ */
.contact {
  background:
    radial-gradient(ellipse 60% 80% at 50% 30%, rgba(46,185,234,0.10), transparent 70%),
    var(--ink-0);
  padding: clamp(120px, 18vh, 220px) 0;
}

/* ------------------ Footer ------------------ */
.site-footer {
  background: var(--ink-0);
  padding: 80px 0 40px;
  border-top: 1px solid var(--ink-4);
  position: relative; z-index: 2;
}
.site-footer-top {
  display: grid; grid-template-columns: 1.2fr 2fr;
  gap: 80px;
}
.site-footer-brand img { height: 26px; }
.site-footer-cols {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 32px;
}
.site-footer-cols .label { margin-bottom: 16px; }
.site-footer-cols a {
  display: block;
  color: var(--fg-2);
  text-decoration: none;
  font-size: 13px;
  padding: 6px 0;
  transition: color 150ms var(--ease-out);
}
.site-footer-cols a:hover { color: var(--brand-blue); }
.site-footer-bottom {
  display: flex; justify-content: space-between;
  padding: 0 0;
}
@media (max-width: 900px) {
  .site-footer-top { grid-template-columns: 1fr; gap: 48px; }
  .site-footer-cols { grid-template-columns: 1fr 1fr; }
}

/* ------------------ Multi-page: entries + next-page ------------------ */
.page { min-height: 60vh; }
.page:not(.page-home) > section:first-child { padding-top: clamp(140px, 18vh, 200px); }

.entry-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4);
}
@media (max-width: 1000px) { .entry-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px)  { .entry-grid { grid-template-columns: 1fr; } }
.entry-card {
  background: var(--ink-0);
  padding: 36px 28px;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 260px; min-width: 0;
  color: var(--fg-1); text-decoration: none;
  transition: background 300ms var(--ease-out);
}
.entry-card:hover { background: rgba(46,185,234,0.05); }
.entry-card:focus-visible { outline: 1px solid var(--brand-blue); outline-offset: -1px; }
.entry-card h3 {
  font-family: var(--font-display); font-weight: 300;
  font-size: 22px; line-height: 1.25; letter-spacing: -0.005em;
}
.entry-card p { color: var(--fg-2); font-size: 15px; line-height: 1.55; margin: 0; }
.entry-go {
  margin-top: auto;
  font-family: var(--font-caps); font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--brand-blue);
}

section.next-page { padding: 48px 0 64px; border-top: 1px solid var(--ink-4); }
.next-page-inner { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.next-page-link {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(28px, 4vw, 48px); letter-spacing: -0.01em;
  color: var(--fg-1); text-decoration: none;
  transition: color 200ms var(--ease-out);
}
.next-page-link:hover { color: var(--brand-blue); }

/* ------------------ Conservative-claims additions ------------------ */
.hero-sub { margin-top: 28px; max-width: 46ch; color: var(--fg-2); }
.fineprint {
  margin-top: 40px; max-width: 80ch;
  font-size: 13px; line-height: 1.6; color: var(--fg-3);
}
.product-card { padding: 40px 36px; }
.product-card.is-lead, .app-card.is-lead {
  border-color: rgba(46,185,234,0.45);
  background: linear-gradient(180deg, rgba(46,185,234,0.06), transparent 60%);
}

/* Applications */
.app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
@media (max-width: 1100px) { .app-grid { grid-template-columns: 1fr; } }
.app-card {
  min-width: 0;
  display: flex; flex-direction: column; gap: 18px;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  padding: 40px 36px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
}
.app-card-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.app-tech {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(30px, 3vw, 40px); letter-spacing: -0.015em; line-height: 1.1;
  color: var(--fg-1);
}
.app-card .display-sm { color: var(--fg-2); }
.app-card .body-md { margin: 0; }
.app-uses {
  list-style: none; margin: 4px 0 0; padding: 0;
  border-top: 1px solid var(--ink-4);
}
.app-uses li {
  padding: 12px 0 12px 22px; position: relative;
  border-bottom: 1px solid var(--ink-4);
  font-size: 15px; line-height: 1.45; color: var(--fg-1);
}
.app-uses li::before {
  content: ""; position: absolute; left: 2px; top: 19px;
  width: 8px; height: 1px; background: var(--brand-blue);
}

.app-compare {
  margin-top: 64px;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  overflow-x: auto;
}
.app-compare-row {
  display: grid; grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 16px; align-items: center;
  min-width: 560px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--ink-4);
}
.app-compare-row:last-child { border-bottom: 0; }
.app-compare-head { background: rgba(255,255,255,0.02); }
.app-compare-head .label { color: var(--fg-3); }
.app-compare-need { color: var(--fg-1); font-size: 15px; }
.app-fit {
  font-family: var(--font-caps); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3);
}
.app-fit.fit-bestfit, .app-fit.fit-yes { color: var(--brand-blue); }
.app-fit.fit-goodfit { color: var(--fg-1); }

/* ------------------ Home intro: power vs energy ------------------ */
.intro-scale {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 20px;
  font-family: var(--font-caps); font-size: 11px; font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3);
}
.intro-scale-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--brand-blue), var(--ink-5));
}
.intro-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4);
}
@media (max-width: 900px) { .intro-grid { grid-template-columns: 1fr; } .intro-scale { display: none; } }
.intro-card {
  min-width: 0; background: var(--ink-0);
  padding: 40px 32px;
  display: flex; flex-direction: column; gap: 16px;
}
.intro-card-head { display: flex; justify-content: space-between; gap: 12px; }
.intro-card .body-md { margin: 0; }
.intro-tech { margin-top: auto; padding-top: 12px; color: var(--fg-3); font-size: 12px; }
.intro-power { background: linear-gradient(180deg, rgba(46,185,234,0.07), var(--ink-0) 70%); }

.partner-logo-tile {
  display: inline-flex; align-items: center; justify-content: flex-start;
  background: transparent;
  width: 200px; height: 84px; max-width: 100%;
}
.partner-logo-tile img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

.ref-cell.has-logo {
  display: grid; grid-template-columns: auto 1fr;
  column-gap: 20px; row-gap: 6px; align-content: center; align-items: center;
}
.ref-cell.has-logo .ref-logo { grid-row: 1 / span 2; }
.ref-logo { height: 64px; width: auto; max-width: 96px; object-fit: contain; }

/* ------------------ Header support link ------------------ */
.header-support {
  color: var(--fg-2); text-decoration: none; padding: 8px 6px;
  border-bottom: 1px solid transparent;
}
.header-support:hover, .header-support.is-active { color: var(--fg-1); border-bottom-color: var(--brand-blue); }
@media (max-width: 640px) { .header-support { display: none; } }

/* ------------------ Support & partner pages ------------------ */
.support-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 900px) { .support-grid { grid-template-columns: 1fr; } }
.support-grid > * { min-width: 0; }
.login-box, .support-contact {
  display: flex; flex-direction: column; gap: 16px;
  border: 1px solid var(--ink-4); border-radius: var(--r-md);
  padding: 40px 36px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
}
.login-box { border-color: rgba(46,185,234,0.4); }
.login-box label { display: flex; flex-direction: column; gap: 6px; }
.login-box input {
  font: inherit; font-size: 15px; color: var(--fg-1);
  background: var(--ink-1); border: 1px solid var(--ink-5); border-radius: var(--r-sm);
  padding: 12px 14px;
}
.login-box input:focus-visible { outline: 1px solid var(--brand-blue); border-color: var(--brand-blue); }
.login-box .btn { align-self: flex-start; }
.login-note { min-height: 1.4em; margin: 0; color: var(--brand-blue); font-size: 14px; }
.login-small { margin: 0; color: var(--fg-3); font-size: 13px; line-height: 1.5; }
.support-contact .body-md { margin: 0; }

.copy-email { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px; }
.copy-email-addr {
  font-family: var(--font-display); font-size: clamp(20px, 2.2vw, 28px); font-weight: 300;
  color: var(--fg-1); user-select: all; overflow-wrap: anywhere;
}
.copy-email-btn {
  font-family: var(--font-caps); font-size: 11px; font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; cursor: pointer;
  color: var(--brand-blue); background: rgba(46,185,234,0.08);
  border: 1px solid rgba(46,185,234,0.35); border-radius: var(--r-pill); padding: 7px 14px;
}
.copy-email-btn:hover { background: rgba(46,185,234,0.16); }
.copy-email-open { color: var(--fg-3); }

.steps-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.step {
  display: grid; grid-template-columns: 64px 1fr; gap: 24px;
  padding: 28px 0; border-bottom: 1px solid var(--ink-4);
}
.step > div { min-width: 0; }
.step-num { color: var(--brand-blue); font-size: 14px; padding-top: 4px; }
.step-h { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin-bottom: 8px; }
.step .body-md { margin: 0; max-width: 62ch; }
.support-note {
  margin-top: 40px; padding: 24px 28px;
  border: 1px solid rgba(245,179,1,0.35); border-radius: var(--r-md);
  background: rgba(245,179,1,0.05);
}
.support-note .body-md { margin: 0; }
.support-note b { color: var(--warning); font-weight: 500; }

.partner-types {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4);
}
@media (max-width: 900px) { .partner-types { grid-template-columns: 1fr; } }
.partner-type { background: var(--ink-0); padding: 36px 32px; min-width: 0; }
.partner-type .body-md { margin: 12px 0 0; }
.partner-gets { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.partner-gets li {
  padding: 11px 0 11px 22px; position: relative; border-bottom: 1px solid var(--ink-4);
  font-size: 15px; color: var(--fg-1);
}
.partner-gets li::before { content: ""; position: absolute; left: 2px; top: 20px; width: 8px; height: 1px; background: var(--brand-blue); }

/* ------------------ Legal pages ------------------ */
.footer-legal { display: inline-flex; gap: 20px; flex-wrap: wrap; }
.footer-legal a { color: var(--fg-3); text-decoration: none; }
.footer-legal a:hover { color: var(--fg-1); }
.legal-wrap { max-width: 860px; }
.legal-meta { color: var(--fg-3); margin-top: 16px; }
.legal-toc {
  display: flex; flex-direction: column; gap: 6px;
  padding: 20px 24px; margin-bottom: 48px;
  border: 1px solid var(--ink-4); border-radius: var(--r-md);
}
.legal-toc a { color: var(--fg-2); text-decoration: none; font-size: 15px; }
.legal-toc a:hover { color: var(--brand-blue); }
.legal-sec { padding: 28px 0; border-top: 1px solid var(--ink-4); scroll-margin-top: 96px; }
.legal-sec h3 {
  font-family: var(--font-display); font-weight: 400; font-size: 22px;
  color: var(--fg-1); margin-bottom: 14px;
}
.legal-sec p, .legal-sec li { color: var(--fg-2); font-size: 16px; line-height: 1.65; max-width: 68ch; }
.legal-sec p { margin: 0 0 12px; }
.legal-sec ul { margin: 0 0 12px; padding-left: 20px; }
.legal-sec li { margin-bottom: 6px; }
.legal-sec b { color: var(--fg-1); font-weight: 500; }
.legal-sec a { color: var(--brand-blue); }
.legal-ph { background: rgba(245,179,1,0.18); color: var(--warning); padding: 0 4px; border-radius: 3px; }

/* ------------------ News ------------------ */
.news-empty {
  display: flex; flex-direction: column; gap: 12px;
  padding: 40px 36px; max-width: 640px;
  border: 1px dashed var(--ink-5); border-radius: var(--r-md);
}
.news-empty .body-md { margin: 0; }
.news-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.news-item {
  display: grid; grid-template-columns: 200px 1fr; gap: 32px;
  padding: 32px 0; border-bottom: 1px solid var(--ink-4);
}
@media (max-width: 700px) { .news-item { grid-template-columns: 1fr; gap: 12px; } }
.news-item > * { min-width: 0; }
.news-meta { display: flex; flex-direction: column; gap: 8px; color: var(--fg-3); }
.news-meta time { color: var(--brand-blue); font-size: 13px; }
.news-body .body-md { margin: 12px 0 0; max-width: 62ch; }

.news-link { display: inline-block; margin-top: 16px; color: var(--brand-blue); text-decoration: none; }
.news-link:hover { text-decoration: underline; }

/* ------------------ Press kit ------------------ */
.press-h { display: block; color: var(--fg-3); margin: 56px 0 20px; }
.press-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
@media (max-width: 800px) { .press-grid { grid-template-columns: 1fr; } }
.press-card { min-width: 0; border: 1px solid var(--ink-4); border-radius: var(--r-md); overflow: hidden; }
.press-preview { height: 180px; display: flex; align-items: center; justify-content: center; padding: 32px; }
.press-preview img { max-width: 80%; max-height: 100%; object-fit: contain; }
.press-light { background: #FFFFFF; }
.press-dark { background: var(--ink-1); }
.press-card-body { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 22px; border-top: 1px solid var(--ink-4); }
.press-name { color: var(--fg-1); font-size: 15px; }
.press-files { display: flex; gap: 8px; flex-wrap: wrap; }
.press-file {
  color: var(--brand-blue); text-decoration: none;
  border: 1px solid rgba(46,185,234,0.35); border-radius: var(--r-pill); padding: 6px 12px;
}
.press-file:hover { background: rgba(46,185,234,0.1); }
.press-slogan { font-family: var(--font-display); font-weight: 300; font-size: clamp(32px, 4.5vw, 64px); line-height: 1.1; letter-spacing: -0.015em; color: var(--fg-1); margin: 0; }
.press-slogan em { font-style: normal; color: var(--brand-blue); }
.press-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 800px) { .press-colors { grid-template-columns: 1fr 1fr; } }
.press-color { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.press-swatch { height: 72px; border-radius: var(--r-sm); border: 1px solid var(--ink-4); }
.press-hex { color: var(--fg-2); font-size: 13px; }

for service contracts and financing models",body:["Belinus has signed a strategic partnership with Clavoris, a financial enablement platform. Together we are preparing a secure, institutionally compliant framework for Belinus customer service contracts, including financing models such as leasing, rental and power purchase agreements (PPAs).","Clavoris is developing a compliant security token on an institutional-grade blockchain network built for regulated financial markets. Three features matter most for our customers and investors. Transaction details are visible only to the parties involved, so contract and payment data stay private. Payment and delivery are settled in a single step, or not at all, which removes the gap in which one side has paid and the other has not delivered. And the network is already used by established financial institutions, so contracts can connect to existing capital-market infrastructure.","Belinus can rely on the standards the Clavoris platform has adopted: qualified electronic signatures under the EU eIDAS regulation, identity and company checks (KYC and KYB) in line with anti-money-laundering rules, GDPR-compliant data protection with hosting in the EU, and a security framework being aligned with the EU Digital Operational Resilience Act (DORA) and ISO/IEC 27001.","For Belinus this means that energy-as-a-service contracts, from a home system on a monthly fee to a supercapacitor installation under a PPA, can be documented, signed and administered on one platform, with a clear route to financing them with institutional investors. Tokenisation on the network is planned for 2027.","This announcement is for information only and is not an offer of financial instruments."],link:{href:"https://www.clavoris.com",label:"Visit www.clavoris.com"}},{date:"2026-10-01",tag:"Technology",title:"Belinus presents three cell technologies for power and energy storage",body:"Belinus now offers three cell technologies through a Belinus Invest strategic partnership: the SC-60138 supercapacitor for high-power, high-cycle applications, the lithium-free NIB-60138 sodium-ion cell for stationary energy storage, and the HUC-60138 hybrid ultracapacitor for automotive and other high-power uses. Together they let us build hybrid systems that combine power and energy storage, coordinated by our own battery management and Themis energy management. Preliminary data sheets are available on request.",link:{href:"#technology",label:"Explore the technology"}},{date:"2026-06",tag:"Technology",title:"Belinus develops supercapacitor-based systems for the European market",body:"Belinus is developing power storage systems built on supercapacitors for European industry, grid and mobility customers. Supercapacitors charge and discharge in seconds and are rated for very high cycle counts, which makes them well suited to the fast, repeated power peaks that batteries handle less well: industrial pulse loads, grid support, backup bridging and braking-energy recovery. As electrification and renewable generation grow, so does the need for this kind of fast power storage, and market studies expect continued strong growth. Our cells are produced in India by our technology partner. The EU and India concluded a free trade agreement in principle in January 2026, with signature planned for the end of 2026 and entry into force expected in 2027. We expect this to support a stable supply chain for the European market, alongside our longer-term target of production in Europe.",link:{href:"#applications",label:"See the applications"}},{date:"2026-04",tag:"Company",title:"EV ChargeKing to join the Belinus group",body:"Belinus Invest BV and SOME BV, the company behind EV ChargeKing, have reached an agreement in principle for EV ChargeKing to join the Belinus group. EV ChargeKing brings its residential EV charging portfolio, which will be offered under the Belinus brand alongside our solar, inverter and storage products. Completion of the transaction is subject to final agreements and customary conditions.",links:[{href:"#products",label:"See the products"},{href:"https://www.etap.pro/en",label:"Visit www.etap.pro"}]},,{date:"2026-02",tag:"Solar",title:"Belinus bets on back-contact: a new solar portfolio built only on BC technology",body:["Belinus is preparing the launch of a new solar panel portfolio based solely on back-contact (BC) cell technology. The range is built around Gaia and Gaia Smart, the latter with an integrated optimiser assembled in Belgium.","In a conventional solar cell, metal contacts run across the front and cast small shadows on the surface. A back-contact cell moves all contacts to the rear. The front is fully open to the light, so more of the cell area produces power, and the panel has a clean, uniform look without visible busbars.","Solar cell technology has moved in steps: from PERC, which dominated the market for years, to TOPCon, and now to back-contact designs, which a growing number of leading manufacturers see as the next step in efficiency. BC also lends itself to better behaviour in partial shade and to premium all-black designs for homes.","Energy storage is at the heart of every Belinus system. Our supercapacitor and sodium-ion storage, managed by Themis, decides when energy is stored, used or delivered. Back-contact solar extends that system: fewer, better panels on every roof, each one feeding into Belinus storage."],link:{href:"#products",label:"See the products"}}],NEWS_PREVIEW=/[?&]preview=news\b/.test(location.search);function newsLive(e){return!e.publishAt||NEWS_PREVIEW||Date.now()>=Date.parse(e.publishAt)}function newsPending(e){return e.publishAt&&Date.now()<Date.parse(e.publishAt)}function formatDate(e){if(/^\d{4}-\d{2}$/.test(e)){const[s,a]=e.split("-");return new Date(+s,+a-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}try{return new Date(e+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}catch{return e}}function NewsPage()

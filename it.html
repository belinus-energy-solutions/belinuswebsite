ct.createElement(React.Fragment,null,React.createElement("p",null,"Il modo in cui trattiamo i dati personali \xE8 spiegato nella nostra ",React.createElement("a",{href:"#privacy"},"informativa sulla privacy"),"."))},{h:"Legge applicabile e foro competente",body:React.createElement(React.Fragment,null,React.createElement("p",null,"Le presenti condizioni sono disciplinate dalla legge belga. Le controversie sono di competenza dei tribunali di Anversa, divisione di Anversa, salvo che norme imperative, come la normativa a tutela dei consumatori, attribuiscano la competenza a un altro tribunale."))},{h:"Modifiche",body:React.createElement(React.Fragment,null,React.createElement("p",null,"Possiamo modificare le presenti condizioni in qualsiasi momento. Si applica la versione pubblicata su questo sito web."))}];function TermsPage(){return React.createElement(LegalDoc,{eyebrow:"Condizioni",title:"Condizioni d\u2019uso",intro:"Le condizioni generali per l\u2019utilizzo di belinus.com.",sections:TERMS_SECTIONS})}Object.assign(window,{PrivacyPage,TermsPage});const NEWS=[{date:"2026-11-02",publishAt:"2026-11-02T12:00:00+01:00",scheduledLabel:"Programmato \xB7 2 novembre 2026, ore 12:00",tag:"Sicurezza dei prodotti",recall:!0,title:"Richiamo di 8 batterie domestiche Energywall",body:["Belinus Energy BV richiama 8 batterie domestiche Energywall (Energywall LV e HV). I clienti presso i quali sono installate queste batterie vengono contattati personalmente.","La causa \xE8 legata allo stoccaggio: durante lo stoccaggio queste batterie hanno subito una scarica profonda, che pu\xF2 danneggiare in modo permanente le celle. Per precauzione, sostituiamo queste batterie con prodotti nuovi.","\xC8 stato contattato in merito a questo richiamo? La preghiamo di contattare il nostro servizio clienti all\u2019indirizzo service@belinus.com indicando il Suo nome e l\u2019indirizzo dell\u2019impianto: concorderemo con Lei la sostituzione. Possiede una Energywall LV o HV ma non \xE8 stato contattato? Ci scriva anche in questo caso e Le confermeremo se il Suo impianto \xE8 interessato."],links:[{href:"mailto:service@belinus.com?subject=Energywall%20recall",label:"service@belinus.com"}]},{date:"2026-10-15",tag:"Partnership",title:"Belinus e Clavoris firmano una partnership strategica per contratti di servizio e modelli di finanziamento",body:["Belinus ha firmato una partnership strategica con Clavoris, una piattaforma di abilitazione finanziaria. Insieme stiamo preparando un quadro sicuro e conforme agli standard istituzionali per i contratti di servizio ai clienti Belinus, compresi modelli di finanziamento come leasing, noleggio e contratti di acquisto di energia (PPA).","Clavoris sta sviluppando un security token conforme su una rete blockchain di livello istituzionale, concepita per i mercati finanziari regolamentati. Per i nostri clienti e investitori contano soprattutto tre caratteristiche. I dettagli delle transazioni sono visibili solo alle parti coinvolte, quindi i dati contrattuali e di pagamento restano riservati. Pagamento e consegna vengono regolati in un unico passaggio, oppure non vengono regolati affatto, il che elimina l\u2019intervallo in cui una parte ha pagato e l\u2019altra non ha ancora consegnato. Infine, la rete \xE8 gi\xE0 utilizzata da istituzioni finanziarie affermate, per cui i contratti possono collegarsi all\u2019infrastruttura esistente dei mercati dei capitali.","Belinus pu\xF2 contare sugli standard adottati dalla piattaforma Clavoris: firme elettroniche qualificate ai sensi del regolamento UE eIDAS, verifiche dell\u2019identit\xE0 e delle imprese (KYC e KYB) in linea con le norme antiriciclaggio, protezione dei dati conforme al GDPR con hosting nell\u2019UE e un quadro di sicurezza in fase di allineamento al regolamento UE sulla resilienza operativa digitale (DORA) e alla norma ISO/IEC 27001.","Per Belinus ci\xF2 significa che i contratti energy-as-a-service, da un sistema domestico a canone mensile a un impianto a supercondensatori nell\u2019ambito di un PPA, possono essere documentati, firmati e gestiti su un\u2019unica piattaforma, con un percorso chiaro verso il loro finanziamento da parte di investitori istituzionali. La tokenizzazione sulla rete \xE8 prevista per il 2027.","Il presente annuncio ha scopo puramente informativo e non costituisce un\u2019offerta di strumenti finanziari."],link:{href:"https://www.clavoris.com",label:"Visiti www.clavoris.com"}},{date:"2026-10-01",tag:"Tecnologia",title:"Belinus presenta tre tecnologie di cella per l\u2019accumulo di potenza e di energia",body:"Grazie a una partnership strategica di Belinus Invest, Belinus offre ora tre tecnologie di cella: il supercondensatore SC-60138 per applicazioni ad alta potenza e con elevato numero di cicli, la cella al sodio-ione senza litio NIB-60138 per l\u2019accumulo stazionario di energia e l\u2019ultracondensatore ibrido HUC-60138 per l\u2019automotive e altri impieghi ad alta potenza. Insieme ci permettono di realizzare sistemi ibridi che combinano accumulo di potenza e di energia, coordinati dal nostro sistema di gestione delle batterie e dalla gestione energetica Themis. Le schede tecniche preliminari sono disponibili su richiesta.",link:{href:"#technology",label:"Esplori la tecnologia"}},{date:"2026-06",tag:"Tecnologia",title:"Belinus sviluppa sistemi a supercondensatori per il mercato europeo",body:"Belinus sta sviluppando sistemi di accumulo di potenza basati su supercondensatori per clienti europei dell\u2019industria, della rete e della mobilit\xE0. I supercondensatori si caricano e si scaricano in pochi secondi e sono dimensionati per un numero di cicli molto elevato, il che li rende particolarmente adatti ai picchi di potenza rapidi e ripetuti che le batterie gestiscono meno bene: carichi impulsivi industriali, supporto alla rete, continuit\xE0 di alimentazione di riserva e recupero dell\u2019energia di frenata. Con la crescita dell\u2019elettrificazione e della produzione da fonti rinnovabili cresce anche il fabbisogno di questo tipo di accumulo rapido di potenza, e gli studi di mercato prevedono una crescita sostenuta. Le nostre celle sono prodotte in India dal nostro partner tecnologico. Nel gennaio 2026 l\u2019UE e l\u2019India hanno concluso in linea di principio un accordo di libero scambio, la cui firma \xE8 prevista per la fine del 2026 e la cui entrata in vigore \xE8 attesa nel 2027. Ci aspettiamo che ci\xF2 favorisca una filiera di approvvigionamento stabile per il mercato europeo, accanto al nostro obiettivo di lungo periodo di una produzione in Europa.",link:{href:"#applications",label:"Scopra le applicazioni"}},{date:"2026-04",tag:"Azienda",title:"EV ChargeKing entrer\xE0 a far parte del gruppo Belinus",body:"Belinus Invest BV e SOME BV, la societ\xE0 che sta dietro a EV ChargeKing, hanno raggiunto un accordo di principio per l\u2019ingresso di EV ChargeKing nel gruppo Belinus. EV ChargeKing apporta il proprio portafoglio di soluzioni di ricarica EV residenziale, che sar\xE0 offerto con il marchio Belinus accanto ai nostri prodotti fotovoltaici, inverter e di accumulo. Il perfezionamento dell\u2019operazione \xE8 subordinato agli accordi definitivi e alle consuete condizioni.",links:[{href:"#products",label:"Vedi i prodotti"},{href:"https://www.etap.pro/en",label:"Visiti www.etap.pro"}]},,{date:"2026-02",tag:"Fotovoltaico",title:"Belinus punta sul back-contact: un nuovo portafoglio fotovoltaico basato esclusivamente sulla tecnologia BC",body:["Belinus sta preparando il lancio di un nuovo portafoglio di pannelli solari basato esclusivamente sulla tecnologia di cella back-contact (BC). La gamma ruota attorno a Gaia e Gaia Smart, quest\u2019ultimo con un ottimizzatore integrato assemblato in Belgio.","In una cella solare convenzionale, i contatti metallici corrono sul lato anteriore e proiettano piccole ombre sulla superficie. Una cella back-contact sposta tutti i contatti sul retro. Il lato anteriore \xE8 completamente esposto alla luce, quindi una parte maggiore della superficie della cella produce energia, e il pannello ha un aspetto pulito e uniforme, senza busbar visibili.","La tecnologia delle celle solari \xE8 evoluta per tappe: dalla PERC, che ha dominato il mercato per anni, alla TOPCon, e ora alle soluzioni back-contact, che un numero crescente di produttori di primo piano considera il passo successivo in termini di efficienza. La tecnologia BC si presta inoltre a un migliore comportamento in condizioni di ombreggiamento parziale e a design premium completamente neri per le abitazioni.","L\u2019accumulo di energia \xE8 al centro di ogni sistema Belinus. Il nostro accumulo a supercondensatori e al sodio-ione, gestito da Themis, decide quando l\u2019energia viene accumulata, utilizzata o ceduta. Il fotovoltaico back-contact amplia questo sistema: meno pannelli, ma migliori, su ogni tetto, ciascuno collegato all\u2019accumulo Belinus."],link:{href:"#products",label:"Vedi i prodotti"}}],NEWS_PREVIEW=/[?&]preview=news\b/.test(location.search);function newsLive(e){return!e.publishAt||NEWS_PREVIEW||Date.now()>=Date.parse(e.publishAt)}function newsPending(e){return e.publishAt&&Date.now()<Date.parse(e.publishAt)}function formatDate(e){if(/^\d{4}-\d{2}$/.test(e)){const[a,i]=e.split("-");return new Date(+a,+i-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"})}try{return new Date(e+"T00:00:00").toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})}catch{return e}}function NewsPage(){return React.createElement("section",{className:"news",id:"news"},React.createElement("div",{className:"wrap"},React.createElement("div",{className:"section-head"},React.createElement("span",{className:"eyebrow eyebrow-dot"},"Notizie"),React.createElement("h2",{className:"display-mid",style:{maxWidth:"20ch"}},"Le ultime novit\xE0 da Belinus."),React.createElement("p",{className:"body-lg",style:{marginTop:28}},"Aggiornamenti aziendali, novit\xE0 sui prodotti e tappe dei progetti.")),NEWS.filter(newsLive).l ment(Intro,null),React.createElement(Entries,null),React.createElement(References,null),React.createElement(Contact,null))}}Object.assign(window,{PAGES,usePage,Page,Entries,NextPage}),function(){try{if(new URLSearchParams(window.location.search).get("c"))return;const e=window.BelinusConsent&&window.BelinusConsent.getRegion();e&&e.seg==="B2C"&&!window.location.hash?window.location.replace(B2C_URL):e&&e.seg==="B2B"&&e.lang&&e.lang.toLowerCase()!==PAGE_LANG&&LANG_FILES[e.lang]&&window.location.replace(LANG_FILES[e.lang]+window.location.hash)}catch{}}();const QA_B2B={"en": [{"q": "Why supercapacitors?", "a": "Power in seconds, for up to 500,000 cycles, lithium-free.", "more": "Supercapacitors store energy electrostatically rather than chemically. They charge and discharge in seconds, again and again, and are rated for up to 500,000 cycles (projected), from −40 °C to +65 °C. Ideal for peaks, pulses, grid support and backup bridging."}, {"q": "What is a hybrid ultracapacitor?", "a": "Capacitor-class power with more stored energy, for vehicles and heavy duty cycles.", "more": "A hybrid ultracapacitor (lithium-ion capacitor) sits between a supercapacitor and a battery: more energy than a supercapacitor, far more power than a battery cell, over 50,000 cycles and a typical life of 10 to 15 years. It suits vehicles and machines that brake and accelerate all day."}, {"q": "Why sodium-ion for stationary storage?", "a": "Long cycle life and a supply chain free of lithium, cobalt and nickel.", "more": "Our NVPF sodium-ion cells deliver over 10,000 cycles to 80 % state of health, 5C continuous and 20C peak power, and operate from −30 °C to +55 °C. They can be discharged to 0 V for transport and storage, and contain no lithium, cobalt or nickel."}, {"q": "Why three technologies from one partner?", "a": "Every load gets the right technology, in one hybrid system.", "more": "Supercapacitors take the peaks, hybrid ultracapacitors the repeated high-power duty, sodium-ion the hours of energy. Belinus combines them in one hybrid system with its own battery management and Themis energy management, deciding moment by moment which technology takes the load."}, {"q": "Where are Belinus systems made?", "a": "Engineered and assembled in Europe.", "more": "Belinus engineers its modules and systems in Europe, assembles its packs in Europe and builds its devices with European partners. That means short supply lines, European standards and support, and a step towards European energy sovereignty."}, {"q": "What is special about the Belinus BMS?", "a": "One battery management system for every chemistry, built on Formula One know-how.", "more": "BMS-1, the battery management standard Belinus is developing for its next generation of modules, manages supercapacitor, sodium-ion, hybrid ultracapacitor and LFP modules with one architecture, with balancing, temperature monitoring and current limits set for each chemistry. Its development draws on our partners’ experience in Formula One and high-performance automotive applications."}], "nl": [{"q": "Waarom supercondensatoren?", "a": "Vermogen in seconden, tot 500.000 cycli, zonder lithium.", "more": "Supercondensatoren slaan energie elektrostatisch op, niet chemisch. Ze laden en ontladen in seconden, keer op keer, en zijn ontworpen voor tot 500.000 cycli (verwacht), van −40 °C tot +65 °C. Ideaal voor pieken, pulsen, netondersteuning en het overbruggen van onderbrekingen."}, {"q": "Wat is een hybride ultracondensator?", "a": "Vermogen van een condensator met meer opgeslagen energie, voor voertuigen en zware werkcycli.", "more": "Een hybride ultracondensator (lithium-ioncondensator) zit tussen een supercondensator en een batterij in: meer energie dan een supercondensator, veel meer vermogen dan een batterijcel, meer dan 50.000 cycli en een typische levensduur van 10 tot 15 jaar. Hij past bij voertuigen en machines die de hele dag remmen en optrekken."}, {"q": "Waarom natrium-ion voor stationaire opslag?", "a": "Lange levensduur en een toeleveringsketen zonder lithium, kobalt of nikkel.", "more": "Onze NVPF-natrium-ioncellen halen meer dan 10.000 cycli tot 80 % state of health, 5C continu en 20C piekvermogen, en werken van −30 °C tot +55 °C. Ze kunnen tot 0 V ontladen worden voor transport en opslag, en bevatten geen lithium, kobalt of nikkel."}, {"q": "Waarom drie technologieën bij één partner?", "a": "Elke belasting krijgt de juiste technologie, in één hybride systeem.", "more": "Supercondensatoren vangen de pieken op, hybride ultracondensatoren het herhaalde hoge vermogen, natrium-ion de energie over uren. Belinus combineert ze in één hybride systeem met eigen batterijbeheer en Themis-energiebeheer, dat op elk moment beslist welke technologie de last draagt."}, {"q": "Waar worden Belinus-systemen gemaakt?", "a": "Ontwikkeld en geassembleerd in Europa.", "more": "Belinus ontwikkelt zijn modules en systemen in Europa, assembleert zijn packs in Europa en bouwt zijn toestellen met Europese partners. Dat betekent korte toeleveringsketens, Europese normen en ondersteuning, en een stap naar Europese energiesoevereiniteit."}, {"q": "Wat maakt het Belinus-BMS bijzonder?", "a": "Eén batterijbeheersysteem voor elke chemie, gebouwd op knowhow uit de Formule 1.", "more": "BMS-1, de standaard voor batterijbeheer die Belinus ontwikkelt voor zijn volgende generatie modules, beheert supercondensator-, natrium-ion-, hybride ultracondensator- en LFP-modules met één architectuur, met balancering, temperatuurbewaking en stroomlimieten per chemie. De ontwikkeling steunt op de ervaring van onze partners in de Formule 1 en in high-performance automotive."}], "fr": [{"q": "Pourquoi des supercondensateurs ?", "a": "De la puissance en quelques secondes, jusqu’à 500 000 cycles, sans lithium.", "more": "Les supercondensateurs stockent l’énergie de manière électrostatique et non chimique. Ils se chargent et se déchargent en quelques secondes, encore et encore, et sont conçus pour jusqu’à 500 000 cycles (prévisionnel), de −40 °C à +65 °C. Idéals pour les pics, les impulsions, le soutien au réseau et la continuité d’alimentation."}, {"q": "Qu’est-ce qu’un ultracondensateur hybride ?", "a": "La puissance d’un condensateur avec plus d’énergie stockée, pour les véhicules et les cycles intensifs.", "more": "Un ultracondensateur hybride (condensateur lithium-ion) se situe entre un supercondensateur et une batterie : plus d’énergie qu’un supercondensateur, bien plus de puissance qu’une cellule de batterie, plus de 50 000 cycles et une durée de vie typique de 10 à 15 ans. Il convient aux véhicules et machines qui freinent et accélèrent toute la journée."}, {"q": "Pourquoi le sodium-ion pour le stockage stationnaire ?", "a": "Une longue durée de vie et une chaîne d’approvisionnement sans lithium, cobalt ni nickel.", "more": "Nos cellules sodium-ion NVPF dépassent 10 000 cycles jusqu’à 80 % d’état de santé, offrent 5C en continu et 20C en pointe, et fonctionnent de −30 °C à +55 °C. Elles peuvent être déchargées à 0 V pour le transport et le stockage, et ne contiennent ni lithium, ni cobalt, ni nickel."}, {"q": "Pourquoi trois technologies chez un seul partenaire ?", "a": "Chaque charge reçoit la bonne technologie, dans un seul système hybride.", "more": "Les supercondensateurs absorbent les pics, les ultracondensateurs hybrides les fortes puissances répétées, le sodium-ion l’énergie sur plusieurs heures. Belinus les combine dans un système hybride unique, avec sa propre gestion de batterie et la gestion énergétique Themis, qui décide à chaque instant quelle technologie prend la charge."}, {"q": "Où sont fabriqués les systèmes Belinus ?", "a": "Conçus et assemblés en Europe.", "more": "Belinus conçoit ses modules et systèmes en Europe, assemble ses packs en Europe et fabrique ses équipements avec des partenaires européens. Cela signifie des chaînes d’approvisionnement courtes, des normes et un support européens, et un pas vers la souveraineté énergétique européenne."}, {"q": "Qu’est-ce qui rend le BMS Belinus unique ?", "a": "Un seul système de gestion de batterie pour toutes les chimies, fondé sur le savoir-faire de la Formule 1.", "more": "Le BMS-1, standard de gestion de batterie que Belinus développe pour sa prochaine génération de modules, gère les modules supercondensateur, sodium-ion, ultracondensateur hybride et LFP avec une seule architecture, avec équilibrage, surveillance de la température et limites de courant propres à chaque chimie. Son développement s’appuie sur l’expérience de nos partenaires en Formule 1 et dans l’automobile haute performance."}], "de": [{"q": "Warum Superkondensatoren?", "a": "Leistung in Sekunden, bis zu 500.000 Zyklen, lithiumfrei.", "more": "Superkondensatoren speichern Energie elektrostatisch statt chemisch. Sie laden und entladen sich in Sekunden, immer wieder, und sind für bis zu 500.000 Zyklen (prognostiziert) von −40 °C bis +65 °C ausgelegt. Ideal für Lastspitzen, Pulse, Netzstützung und Überbrückung bei Stromausfällen."}, {"q": "Was ist ein Hybrid-Ultrakondensator?", "a": "Die Leistung eines Kondensators mit mehr gespeicherter Energie, für Fahrzeuge und harte Lastzyklen.", "more": "Ein Hybrid-Ultrakondensator (Lithium-Ionen-Kondensator) liegt zwischen Superkondensator und Batterie: mehr Energie als ein Superkondensator, weit mehr Leistung als eine Batteriezelle, über 50.000 Zyklen und eine typische Lebensdauer von 10 bis 15 Jahren. Er eignet sich für Fahrzeuge und Maschinen, die den ganzen Tag bremsen und beschleunigen."}, {"q": "Warum Natrium-Ionen für stationäre Speicher?", "a": "Lange Zyklenlebensdauer und eine Lieferkette ohne Lithium, Kobalt und Nickel.", "more": "Unsere NVPF-Natrium-Ionen-Zellen erreichen über 10.000 Zyklen bis 80 % State of Health, 5C Dauer- und 20C Spitzenleistung und arbeiten von −30 °C bis +55 °C. Sie lassen sich für Transport und Lagerung auf 0 V entladen und enthalten weder Lithium noch Kobalt oder Nickel."}, {"q": "Warum drei Technologien von einem Partner?", "a": "Jede Last bekommt die passende Technologie, in einem Hybridsystem.", "more": "Superkondensatoren übernehmen die Spitzen, Hybrid-Ultrakondensatoren die wiederholte Hochleistung, Natrium-Ionen die Energie über Stunden. Belinus kombiniert sie in einem Hybridsystem mit eigenem Batteriemanagement und dem Energiemanagement Themis, das in jedem Moment entscheidet, welche Technologie die Last trägt."}, {"q": "Wo werden Belinus-Systeme hergestellt?", "a": "In Europa entwickelt und montiert.", "more": "Belinus entwickelt seine Module und Systeme in Europa, montiert seine Packs in Europa und fertigt seine Geräte mit europäischen Partnern. Das bedeutet kurze Lieferketten, europäische Normen und Betreuung und einen Schritt hin zu europäischer Energiesouveränität."}, {"q": "Was ist das Besondere am Belinus-BMS?", "a": "Ein Batteriemanagementsystem für jede Zellchemie, aufgebaut auf Formel-1-Know-how.", "more": "BMS-1, der Batteriemanagement-Standard, den Belinus für seine nächste Modulgeneration entwickelt, steuert Superkondensator-, Natrium-Ionen-, Hybrid-Ultrakondensator- und LFP-Module mit einer einzigen Architektur, mit Balancing, Temperaturüberwachung und Stromgrenzen je Zellchemie. Die Entwicklung stützt sich auf die Erfahrung unserer Partner in der Formel 1 und im High-Performance-Automobilbereich."}], "es": [{"q": "¿Por qué supercondensadores?", "a": "Potencia en segundos, hasta 500.000 ciclos y sin litio.", "more": "Los supercondensadores almacenan la energía de forma electrostática, no química. Se cargan y descargan en segundos, una y otra vez, y están diseñados para hasta 500.000 ciclos (previstos), de −40 °C a +65 °C. Ideales para picos, pulsos, apoyo a la red y respaldo ante cortes."}, {"q": "¿Qué es un ultracondensador híbrido?", "a": "La potencia de un condensador con más energía almacenada, para vehículos y ciclos de trabajo exigentes.", "more": "Un ultracondensador híbrido (condensador de iones de litio) se sitúa entre un supercondensador y una batería: más energía que un supercondensador, mucha más potencia que una celda de batería, más de 50.000 ciclos y una vida útil típica de 10 a 15 años. Es idóneo para vehículos y máquinas que frenan y aceleran todo el día."}, {"q": "¿Por qué sodio-ion para el almacenamiento estacionario?", "a": "Larga vida útil y una cadena de suministro sin litio, cobalto ni níquel.", "more": "Nuestras celdas de sodio-ion NVPF superan los 10.000 ciclos hasta el 80 % de estado de salud, ofrecen 5C en continuo y 20C de pico, y funcionan de −30 °C a +55 °C. Pueden descargarse a 0 V para su transporte y almacenamiento, y no contienen litio, cobalto ni níquel."}, {"q": "¿Por qué tres tecnologías con un solo socio?", "a": "Cada carga recibe la tecnología adecuada, en un único sistema híbrido.", "more": "Los supercondensadores asumen los picos, los ultracondensadores híbridos la alta potencia repetida y el sodio-ion la energía durante horas. Belinus los combina en un único sistema híbrido, con su propia gestión de baterías y la gestión energética Themis, que decide en cada momento qué tecnología asume la carga."}, {"q": "¿Dónde se fabrican los sistemas Belinus?", "a": "Diseñados y ensamblados en Europa.", "more": "Belinus diseña sus módulos y sistemas en Europa, ensambla sus packs en Europa y fabrica sus equipos con socios europeos. Eso significa cadenas de suministro cortas, normas y soporte europeos, y un paso hacia la soberanía energética europea."}, {"q": "¿Qué tiene de especial el BMS de Belinus?", "a": "Un único sistema de gestión de baterías para todas las químicas, basado en la experiencia de la Fórmula 1.", "more": "El BMS-1, el estándar de gestión de baterías que Belinus está desarrollando para su próxima generación de módulos, gestiona módulos de supercondensador, sodio-ion, ultracondensador híbrido y LFP con una sola arquitectura, con equilibrado, control de temperatura y límites de corriente para cada química. Su desarrollo se apoya en la experiencia de nuestros socios en la Fórmula 1 y en la automoción de alto rendimiento."}], "it": [{"q": "Perché i supercondensatori?", "a": "Potenza in pochi secondi, fino a 500.000 cicli, senza litio.", "more": "I supercondensatori accumulano energia in modo elettrostatico anziché chimico. Si caricano e si scaricano in pochi secondi, ancora e ancora, e sono progettati per fino a 500.000 cicli (previsti), da −40 °C a +65 °C. Ideali per picchi, impulsi, supporto alla rete e continuità in caso di interruzioni."}, {"q": "Che cos’è un ultracondensatore ibrido?", "a": "La potenza di un condensatore con più energia accumulata, per veicoli e cicli di lavoro intensi.", "more": "Un ultracondensatore ibrido (condensatore agli ioni di litio) si colloca tra un supercondensatore e una batteria: più energia di un supercondensatore, molta più potenza di una cella di batteria, oltre 50.000 cicli e una vita tipica di 10-15 anni. È adatto a veicoli e macchine che frenano e accelerano tutto il giorno."}, {"q": "Perché il sodio-ione per l’accumulo stazionario?", "a": "Lunga durata in cicli e una filiera senza litio, cobalto e nichel.", "more": "Le nostre celle sodio-ione NVPF superano i 10.000 cicli fino all’80 % di stato di salute, offrono 5C in continuo e 20C di picco e funzionano da −30 °C a +55 °C. Possono essere scaricate a 0 V per il trasporto e lo stoccaggio e non contengono litio, cobalto né nichel."}, {"q": "Perché tre tecnologie da un unico partner?", "a": "Ogni carico riceve la tecnologia giusta, in un unico sistema ibrido.", "more": "I supercondensatori gestiscono i picchi, gli ultracondensatori ibridi la potenza elevata ripetuta, il sodio-ione l’energia per ore. Belinus li combina in un unico sistema ibrido, con una propria gestione delle batterie e la gestione energetica Themis, che decide istante per istante quale tecnologia sostiene il carico."}, {"q": "Dove vengono prodotti i sistemi Belinus?", "a": "Progettati e assemblati in Europa.", "more": "Belinus progetta i suoi moduli e sistemi in Europa, assembla i suoi pacchi in Europa e realizza i suoi dispositivi con partner europei. Questo significa filiere corte, standard e assistenza europei e un passo verso la sovranità energetica europea."}, {"q": "Che cosa ha di speciale il BMS di Belinus?", "a": "Un unico sistema di gestione delle batterie per ogni chimica, basato sul know-how della Formula 1.", "more": "Il BMS-1, lo standard di gestione delle batterie che Belinus sta sviluppando per la sua prossima generazione di moduli, gestisce moduli a supercondensatore, sodio-ione, ultracondensatore ibrido e LFP con un’unica architettura, con bilanciamento, monitoraggio della temperatura e limiti di corrente per ciascuna chimica. Lo sviluppo si basa sull’esperienza dei nostri partner nella Formula 1 e nell’automotive ad alte prestazioni."}]},QA_UI_B2B={"en": {"q": "Question", "a": "Answer", "more": "Read more", "less": "Close", "prev": "Previous question", "next": "Next question", "hide": "Close banner"}, "nl": {"q": "Vraag", "a": "Antwoord", "more": "Lees meer", "less": "Sluiten", "prev": "Vorige vraag", "next": "Volgende vraag", "hide": "Banner sluiten"}, "fr": {"q": "Question", "a": "Réponse", "more": "Lire plus", "less": "Fermer", "prev": "Question précédente", "next": "Question suivante", "hide": "Fermer le bandeau"}, "de": {"q": "Frage", "a": "Antwort", "more": "Mehr lesen", "less": "Schließen", "prev": "Vorherige Frage", "next": "Nächste Frage", "hide": "Banner schließen"}, "es": {"q": "Pregunta", "a": "Respuesta", "more": "Leer más", "less": "Cerrar", "prev": "Pregunta anterior", "next": "Pregunta siguiente", "hide": "Cerrar el banner"}, "it": {"q": "Domanda", "a": "Risposta", "more": "Leggi di più", "less": "Chiudi", "prev": "Domanda precedente", "next": "Domanda successiva", "hide": "Chiudi il banner"}};function QABannerB2B(){const a=(document.documentElement.lang||"en").slice(0,2),e=QA_B2B[a]||QA_B2B.en,n=QA_UI_B2B[a]||QA_UI_B2B.en,[t,s]=React.useState(()=>{try{return sessionStorage.getItem("b2b_qa_hidden")==="1"}catch{return!1}}),[i,o]

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belinus klantenportaal</title>
<meta name="description" content="Belinus klantenportaal: uw producten, terugroepingen, bestellingen, facturen en support.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0C0F">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<style>/* Belinus customer portal — tokens from belinus.com (colors_and_type.css). */
@font-face { font-family: 'Arial Nova'; src: url('fonts/ArialNova-Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'Arial Nova'; src: url('fonts/ArialNova.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Arial Nova'; src: url('fonts/ArialNova-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
:root {
  --blue: #2EB9EA; --blue-deep: #1B8FBE; --blue-ink: #003A54; --blue-tint: #E8F7FD;
  --ink-1: #0A0C0F; --ink-2: #121519; --ink-3: #1C2128; --ink-4: #272D36;
  --paper: #FFFFFF; --bone: #F5F6F7; --mist: #E7EAEE; --steel: #AFB6BF; --slate: #5A6370; --graphite: #222830;
  --fg1: #0A0C0F; --fg2: #3A424D; --fg3: #7A828C;
  --ok: #1F9D6A; --ok-bg: #E6F6EF; --warn: #B07A00; --warn-bg: #FFF5D9; --bad: #C8402F; --bad-bg: #FDECEA;
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px;
  --font: 'Arial Nova', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow: 0 8px 24px rgba(10,12,15,.06), 0 1px 2px rgba(10,12,15,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bone); color: var(--fg1); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 300; letter-spacing: -.01em; margin: 0 0 .4em; line-height: 1.2; }
h1 { font-size: clamp(28px, 4vw, 40px); }
h2 { font-size: 24px; } h3 { font-size: 19px; font-weight: 400; } h4 { font-size: 15px; font-weight: 700; margin-top: 1em; }
a { color: var(--blue-deep); }
p { margin: 0 0 1em; }
.muted { color: var(--fg3); }
.mono { font-family: var(--mono); font-size: .9em; }
.small { font-size: 13px; }
.pre { white-space: pre-wrap; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg3); margin: 0 0 6px; }
.logo { height: 26px; width: auto; display: block; align-self: flex-start; flex: none; }
.boot { min-height: 100vh; display: grid; place-items: center; } .boot .logo { height: 34px; opacity: .6; }

/* buttons, fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; font: 700 15px var(--font); cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn-primary { background: var(--blue); color: var(--ink-1); } .btn-primary:hover { background: #45C3EE; }
.btn-ghost { background: transparent; color: var(--fg1); border-color: var(--mist); } .btn-ghost:hover { border-color: var(--steel); }
.btn-danger { background: var(--bad); color: #fff; } .btn-danger:hover { background: #B43626; }
.btn.sm { min-height: 36px; padding: 0 16px; font-size: 14px; }
.btn:disabled { opacity: .55; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--blue-deep); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.stack { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field-l { font-size: 13px; color: var(--fg2); }
.field-h { font-size: 12px; color: var(--fg3); } .field-h.ok { color: var(--ok); } .field-h.bad { color: var(--bad); }
input, select, textarea { width: 100%; font: 400 16px var(--font); color: var(--fg1); background: var(--paper); border: 1px solid var(--mist); border-radius: var(--r-sm); padding: 11px 13px; min-height: 46px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
input[type=file] { padding: 9px; min-height: 0; font-size: 14px; }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; min-height: 0; accent-color: var(--blue-deep); margin: 2px 0 0; flex: none; }
textarea { resize: vertical; }
.code-in { font-family: var(--mono); font-size: 26px; letter-spacing: .4em; text-align: center; max-width: 260px; }
.sig-in { font-size: 20px; font-style: italic; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg2); }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.row-code { display: flex; gap: 12px; align-items: flex-end; } .row-code .field { max-width: 260px; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.note { padding: 12px 14px; border-radius: var(--r-sm); font-size: 14px; background: var(--blue-tint); color: var(--blue-ink); }
.note-error { background: var(--bad-bg); color: var(--bad); } .note-ok { background: var(--ok-bg); color: var(--ok); }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--mist); color: var(--fg2); }
.badge-green { background: var(--ok-bg); color: var(--ok); } .badge-amber { background: var(--warn-bg); color: var(--warn); }
.badge-red { background: var(--bad-bg); color: var(--bad); } .badge-blue { background: var(--blue-tint); color: var(--blue-ink); }

/* auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 42%) 1fr; }
.auth-side { background: var(--ink-1); color: #fff; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-side::after { content: ''; position: absolute; right: -30%; bottom: -30%; width: 90%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(46,185,234,.28), rgba(46,185,234,0) 65%); pointer-events: none; }
.auth-side .eyebrow { color: rgba(255,255,255,.5); }
.auth-side h2 { font-size: clamp(26px, 3vw, 38px); max-width: 14em; color: #fff; }
.auth-side-txt { position: relative; z-index: 1; }
.auth-main { display: grid; place-items: center; padding: 40px 16px; }
.auth-box { width: 100%; max-width: 420px; }
.auth-box h1 { margin-bottom: 20px; }
.auth-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 22px; font-size: 14px; color: var(--fg3); }
.langs { display: flex; gap: 4px; position: relative; z-index: 1; }
.langs button { background: none; border: 1px solid var(--mist); color: var(--fg2); font: 700 12px var(--font); padding: 6px 9px; border-radius: 999px; cursor: pointer; }
.langs.dark button { border-color: rgba(255,255,255,.18); color: rgba(255,255,255,.7); }
.langs button.on { background: var(--blue); border-color: var(--blue); color: var(--ink-1); }

/* shell */
.shell { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 64px 1fr; }
.topbar { grid-column: 1 / -1; background: var(--ink-1); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 24px; position: sticky; top: 0; z-index: 20; border-bottom: 2px solid var(--blue); }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff; }
.brand-sub { font-size: 13px; color: rgba(255,255,255,.6); padding-left: 14px; border-left: 1px solid rgba(255,255,255,.2); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--ink-4); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; text-decoration: none; }
.avatar.on, .avatar:hover { background: var(--blue); color: var(--ink-1); }
.burger { display: none; background: none; border: 0; padding: 8px; cursor: pointer; }
.burger span { display: block; width: 22px; height: 2px; background: #fff; margin: 4px 0; }
.side { background: var(--paper); border-right: 1px solid var(--mist); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--r-sm); color: var(--fg2); text-decoration: none; font: 400 15px var(--font); background: none; border: 0; cursor: pointer; text-align: left; width: 100%; }
.nav:hover { background: var(--bone); color: var(--fg1); }
.nav.on { background: var(--ink-1); color: #fff; } .nav.on svg { color: var(--blue); }
.nav.alert { color: var(--bad); } .nav.alert.on { color: #fff; }
.nav .count { margin-left: auto; min-width: 22px; height: 22px; border-radius: 11px; background: var(--blue); color: var(--ink-1); font-size: 12px; display: grid; place-items: center; padding: 0 6px; }
.nav.alert .count { background: var(--bad); color: #fff; }
.nav-out { width: 18px; text-align: center; }
.side-foot { margin-top: auto; border-top: 1px solid var(--mist); padding-top: 10px; }
.main { padding: 36px clamp(16px, 4vw, 48px) 64px; max-width: 1180px; width: 100%; min-width: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.page-head .lead { color: var(--fg2); max-width: 46em; margin: 0; }
.back { display: inline-block; margin-bottom: 14px; text-decoration: none; color: var(--fg3); font-size: 14px; }
.block { margin-top: 36px; }
.site-h { font-size: 20px; margin-bottom: 16px; }
.empty { background: var(--paper); border: 1px dashed var(--steel); border-radius: var(--r-md); padding: 28px; color: var(--fg2); }

/* cards and lists */
.card { background: var(--paper); border-radius: var(--r-md); padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.cards .card { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-top h3 { margin: 0; }
.kind { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue-deep); font-weight: 700; }
.sys { border-top: 3px solid var(--blue); }
.sys-solar { border-top-color: #FFB547; } .sys-ev_charger { border-top-color: #37C98A; } .sys-ems { border-top-color: var(--ink-1); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--fg3); } .kv dd { margin: 0; }
.warr { font-size: 13px; color: var(--fg2); margin: 0; }
.cards .btn { align-self: flex-start; margin-top: auto; }
.docs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.docs li:first-child { border-top: 0; }
.docs li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 8px 0; border-top: 1px solid var(--mist); }
.docs.wide { background: var(--paper); border-radius: var(--r-md); padding: 6px 18px; box-shadow: var(--shadow); }
.doc-ic { font-size: 10px; font-weight: 700; color: var(--bad); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; }
.doc-t { flex: 1; min-width: 0; } .doc-t small { display: block; color: var(--fg3); font-size: 12px; }
.list { background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
.row-link { display: flex; align-items: center; gap: 16px; padding: 16px 20px; text-decoration: none; color: var(--fg1); border-top: 1px solid var(--mist); }
.row-link:first-child { border-top: 0; } .row-link:hover { background: var(--bone); }
.row-link.urgent { box-shadow: inset 4px 0 0 var(--bad); }
.row-link .grow { flex: 1; min-width: 0; } .row-link small { display: block; color: var(--fg3); font-size: 13px; }
.chev { color: var(--steel); font-size: 22px; }
.alertbox { background: var(--bad-bg); color: #7A2318; border-left: 4px solid var(--bad); border-radius: var(--r-sm); padding: 16px 18px; margin-bottom: 20px; }
.alertbox h3 { font-weight: 700; font-size: 16px; }
.pdf-wrap { margin: 20px 0; display: grid; gap: 10px; justify-items: start; }
.pdf-wrap iframe { width: 100%; height: 70vh; border: 1px solid var(--mist); border-radius: var(--r-md); background: #fff; }
.sign { border-top: 3px solid var(--blue); display: grid; gap: 16px; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--mist); border-radius: var(--r-sm); cursor: pointer; }
.choice.on { border-color: var(--blue); background: var(--blue-tint); }
.signed { background: var(--ok-bg); color: #145C3F; border-radius: var(--r-sm); padding: 16px 18px; }
.steps { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding: 0; margin: 16px 0 18px; counter-reset: s; }
.steps li { position: relative; font-size: 12px; color: var(--fg3); text-align: center; padding-top: 22px; }
.steps li span { position: absolute; top: 4px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--mist); z-index: 1; }
.steps li::before { content: ''; position: absolute; top: 9px; left: -50%; right: 50%; height: 2px; background: var(--mist); }
.steps li:first-child::before { display: none; }
.steps li.done { color: var(--fg1); } .steps li.done span, .steps li.done::before { background: var(--blue); }
.lines { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; display: grid; gap: 6px; }
.lines li span { color: var(--fg3); } .lines small { color: var(--fg3); }
.kpi { background: var(--ink-1); color: #fff; border-radius: var(--r-md); padding: 12px 18px; text-align: right; }
.kpi small { display: block; color: rgba(255,255,255,.6); font-size: 12px; } .kpi b { font-size: 22px; font-weight: 400; }
.table-wrap { overflow-x: auto; background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.tbl th { text-align: left; font-weight: 400; color: var(--fg3); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 14px 16px; border-bottom: 1px solid var(--mist); }
.tbl td { padding: 14px 16px; border-top: 1px solid var(--mist); vertical-align: top; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl .ref { display: block; font-size: 12px; color: var(--fg3); }

/* support thread */
.thread { display: grid; gap: 14px; margin-bottom: 20px; }
.msg { background: var(--paper); border-radius: var(--r-md); padding: 16px 18px; box-shadow: var(--shadow); max-width: 820px; }
.msg.staff { border-left: 3px solid var(--blue); }
.msg.mine { margin-left: auto; background: #FBFCFD; }
.msg-h { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--fg3); margin-bottom: 6px; } .msg-h b { color: var(--fg1); }
.msg p { margin: 0; }
.atts { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }

/* assistant */
.chat-wrap { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
.chat-wrap:has(> .chat:only-child) { grid-template-columns: 1fr; }
.chat-list { display: grid; gap: 4px; background: var(--paper); border-radius: var(--r-md); padding: 8px; box-shadow: var(--shadow); max-height: 70vh; overflow-y: auto; }
.chat-list button { text-align: left; background: none; border: 0; padding: 10px; border-radius: var(--r-sm); font: 14px var(--font); color: var(--fg1); cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
.chat-list button small { display: block; color: var(--fg3); font-size: 12px; }
.chat-list button.on, .chat-list button:hover { background: var(--bone); }
.chat { background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.chat-msgs { min-height: 320px; max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px; }
.bubble { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 15px; }
.bubble p { margin: 0; }
.bubble.user { align-self: flex-end; background: var(--ink-1); color: #fff; border-bottom-right-radius: 4px; }
.bubble.assistant { align-self: flex-start; background: var(--bone); border-bottom-left-radius: 4px; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--steel); animation: bl 1s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bl { 50% { opacity: .2; } }
.starters { display: grid; gap: 8px; margin: auto 0; }
.starters button { text-align: left; background: var(--bone); border: 1px solid var(--mist); border-radius: var(--r-sm); padding: 12px 14px; font: 15px var(--font); cursor: pointer; color: var(--fg1); }
.starters button:hover { border-color: var(--blue); }
.chat-in { display: flex; gap: 10px; align-items: flex-end; } .chat-in textarea { min-height: 52px; }
.fine { font-size: 12px; color: var(--fg3); margin: 0; }

/* account */
.sec-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; } .sec-row p { margin: 0; }
.enroll { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; background: var(--bone); border-radius: var(--r-md); padding: 16px; }
.enroll img { background: #fff; border-radius: var(--r-sm); padding: 6px; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,15,.5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--paper); border-radius: var(--r-lg); padding: 28px; max-width: 460px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }

@media (max-width: 900px) {
  .auth { grid-template-columns: 1fr; }
  .auth-side { padding: 22px 16px; flex-direction: row; align-items: center; gap: 12px; }
  .auth-side-txt { display: none; }
  .auth-side::after { display: none; }
  .shell { grid-template-columns: 1fr; }
  .topbar { padding: 0 12px; gap: 10px; }
  .burger { display: block; }
  .brand-sub { display: none; }
  .top-right .langs { display: none; }
  .side { position: fixed; left: 0; top: 64px; bottom: 0; width: 280px; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 20px 40px rgba(0,0,0,.2); height: auto; }
  .side.open { transform: none; }
  .main { padding: 24px 16px 48px; }
  .row2, .row3 { grid-template-columns: 1fr; }
  .chat-wrap { grid-template-columns: 1fr; }
  .chat-list { display: flex; overflow-x: auto; max-height: none; }
  .chat-list button { flex: 0 0 200px; }
  .steps li { font-size: 10px; }
  .bubble { max-width: 92%; }
  .cards { grid-template-columns: 1fr; }
  .tbl { min-width: 0; }
  .tbl thead { display: none; }
  .tbl tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-top: 1px solid var(--mist); }
  .tbl tr:first-child { border-top: 0; }
  .tbl td { padding: 0; border: 0; }
  .tbl td[data-l]::before { content: attr(data-l) ' '; color: var(--fg3); font-size: 12px; }
  .tbl .num { text-align: left; }
  .kpi { width: 100%; text-align: left; }
}

/* product library + registration */
.lib-group { padding: 6px 0 14px; border-bottom: 1px solid var(--line, #e7eaee); margin-bottom: 12px; }
.lib-group:last-child { border-bottom: 0; margin-bottom: 0; }
.lib-list { list-style: none; margin: 0; padding: 0; }
.lib-list li { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; align-items: center; padding: 8px 0; font-size: 15px; }
.lib-name { font-weight: 400; }
.lib-list a, .lib-actions a { color: var(--blue, #1B8FBE); text-decoration: none; font-size: 14px; white-space: nowrap; }
.lib-actions { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: auto; padding-top: 8px; }
.lib-card h3 { margin: 0; }
.small { font-size: 13px; }
.reg-item { border: 1px solid var(--line, #e7eaee); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 640px) { .lib-list li { grid-template-columns: 1fr; gap: 4px; } }

/* ---- Support desk (staff) ---- */
.desk-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.desk-tab { padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--fg2); text-decoration: none; background: var(--paper); box-shadow: var(--shadow); }
.desk-tab.on { background: var(--ink-2); color: #fff; }
.desk-find { margin-bottom: 14px; max-width: 420px; } .desk-find input { width: 100%; }
.desk-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.desk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.desk-side h3 { margin: 0; font-size: 15px; } .desk-side .card { margin-bottom: 14px; }

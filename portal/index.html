<style>/* Investor area: Clavoris platform layout in the belinus.com look (Belinus Main design system). Light is the standard for everyone (set in the page head); dark via the toggle. */
@font-face { font-family: 'Arial Nova'; src: url('fonts/ArialNova-Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }

:root { --blue:#2EB9EA; --ink:#0A0C0F; --sbw:256px; --font:'Arial Nova','Helvetica Neue',Helvetica,Arial,sans-serif; --caps:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; --ease:cubic-bezier(.22,1,.36,1);

* { box-sizing:border-box; } html,body { margin:0; background:var(--page); color:var(--fg1); font:400 16px/1.55 var(--font); -webkit-font-smoothing:antialiased; }

:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

.boot { min-height:100vh; display:grid; place-items:center; }
.card form img { background:#fff; padding:8px; border-radius:8px; box-sizing:content-box; }

.tools { display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-bottom:24px; } .lang-switch { display:flex; gap:4px; } .lang-switch button { border:1px solid transparent; background:none; color:var(--fg3); border-radius:999px; padding:5px 10px; font:500 11px/1 var(--caps); letter-spacing:.14em; } .lang-switch button:hover { color:var(--fg1); } .lang-switch button.on { border-color:var(--frame); color:var(--link); }

.sb-nav { flex:1; overflow-y:auto; padding:4px 12px 8px; } .sb-h { margin:16px 12px 6px; font:500 10px/1.4 var(--caps); letter-spacing:.2em; text-transform:uppercase; color:var(--fg3); white-space:nowrap; }

.auth-belinus { display:block; height:40px; width:auto; } .auth-evc { display:block; height:auto; width:min(100%,420px); margin-top:18px; }

  .sb-top { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--glass); border-bottom:1px solid var(--line); min-height:60px; padding:8px 12px 8px 16px; position:sticky; top:0; z-index:40; } .sb-top img { height:22px; width:auto; display:block; } .sb-top .logos { gap:12px; min-width:0; } .sb-top .av { width:40px; height:40px; text-decoration:none; } .sb-top .acts { display:flex; align-items:center; gap:8px; }
  .sb-tabs { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--glass); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); } .sb-tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:52px; border:0; background:none; font-size:11px; color:var(--fg3); text-decoration:none; } .sb-tab .ic { width:23px; height:23px; } .sb-tab.on { color:var(--link); }
  table.cards thead { display:none; } table.cards,table.cards tbody,table.cards tr,table.cards td { display:block; width:100%; } table.cards tr { border-bottom:1px solid var(--line); padding:10px 0; } table.cards td,table.cards td:first-child { white-space:normal; } table.cards td { border:0; padding:4px 0; display:flex; justify-content:space-between; gap:14px; text-align:right; } table.cards td .chip { align-self:flex-start; flex:none; } table.cards td::before { content:attr(data-l); color:var(--fg3); font-size:13px; text-align:left; } table.cards td.n { white-space:normal; } .card { padding:20px; } .modal { padding:20px; } .tile b { font-size:24px; }
}

.picker { display:grid; grid-template-columns:minmax(260px,400px) 1fr; gap:28px; align-items:start; }
.picker-times { border-left:1px solid var(--line); padding-left:28px; min-height:100%; }
.picker-day { margin:6px 0 14px; font-size:18px; text-transform:capitalize; }
.picker-times .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; }
@media (max-width:760px) { .picker { grid-template-columns:1fr; } .picker-times { border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:18px; } }

.seg { display:inline-flex; gap:4px; padding:4px; border:1px solid var(--line2); border-radius:999px; flex-wrap:wrap; }
.seg-b { border:0; background:none; padding:8px 16px; border-radius:999px; font-size:14px; color:var(--fg2); }
.seg-b.on { background:var(--tint2); color:var(--link); }
.agm { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
.agm-day { min-height:104px; display:flex; flex-direction:column; align-items:stretch; gap:3px; text-align:left; padding:6px; border:1px solid var(--line); border-radius:8px; background:none; color:var(--fg1); }
.agm-day:hover { border-color:var(--blue); }
.agm-day.today .agm-n { background:var(--blue); color:#fff; border-radius:999px; padding:0 7px; align-self:flex-start; }
.agm-n { font-size:13px; color:var(--fg2); }
.agm-it { font-size:11.5px; line-height:1.35; padding:2px 6px; border-radius:5px; background:var(--tint2); color:var(--link); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.agm-it.k-visit { background:#E6F6EC; color:#1F7A44; } .agm-it.k-callback { background:#FFF3E0; color:#9A5B00; }
.agm-more { font-size:11px; color:var(--fg3); }
.agd { display:flex; flex-direction:column; gap:10px; }
.agd-it { display:grid; grid-template-columns:70px 1fr auto; gap:14px; align-items:start; padding:14px; border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:10px; }
.agd-it.k-visit { border-left-color:#2E9D5B; } .agd-it.k-callback { border-left-color:#E59A1C; } .agd-it.off { opacity:.5; }
.agd-t { font-size:20px; font-weight:600; }
tr.grp td { border-top:2px solid var(--line2); }
@media (max-width:760px) { .agm-day { min-height:64px; } .agm-it { font-size:0; padding:0; height:6px; } .agd-it { grid-template-columns:56px 1fr; } .agd-it > :last-child { grid-column:1 / -1; } }
@media print { .sb-side,.sb-tabs,.sb-top,.seg,.page-head .row,.btn { display:none !important; } .main { margin:0 !important; } }

.inv-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; align-items:start; margin-bottom:16px; }
.inv-grid > .card { margin:0; }
.appt { border-left:3px solid var(--blue); padding:2px 0 4px 12px; }
.appt.k-visit { border-left-color:#2E9D5B; } .appt.k-callback { border-left-color:#E59A1C; } .appt.off { opacity:.55; }
.notes { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.note-it { background:#FFF8E6; color:#3A2A00; border-radius:8px; padding:8px 10px; } .note-it p { margin:0 0 4px; white-space:pre-wrap; font-size:14px; }
.note-new textarea { width:100%; font-size:14px; } .note-new { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.agd-notes { grid-column:1 / -1; }
.nav-badge { margin-left:auto; font-style:normal; font-size:11px; min-width:20px; height:20px; border-radius:999px; background:var(--blue); color:#fff; display:grid; place-items:center; padding:0 6px; }
@media (max-width:900px) { .inv-grid { grid-template-columns:1fr; } }

/* collapsible menu sections */
.sb-fold { display:flex; align-items:center; justify-content:space-between; gap:8px; width:calc(100% - 24px); border:0; background:none; padding:0; text-align:left; cursor:pointer; } .sb-fold:hover { color:var(--fg1); } .sb-fold.on { color:var(--link); }
.sb-chev { width:14px; height:14px; flex:none; stroke:currentColor; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; transition:transform 150ms var(--ease); } .sb-sec.shut .sb-chev { transform:rotate(-90deg); } .sb-sec.shut .sb-rows { display:none; } html.rail .sb-sec.shut .sb-rows { display:block; }

.otp { display:flex; gap:10px; justify-content:flex-start; }
.otp-box { width:52px; height:60px; padding:0; text-align:center; font-size:26px; font-weight:500; border-radius:10px; caret-color:transparent; }
.otp-box.on { border-color:var(--blue, #2EB9EA); }
.otp-box:focus { outline:none; border-color:var(--blue, #2EB9EA); box-shadow:0 0 0 3px rgba(46,185,234,.25); }
@media (max-width:420px) { .otp { gap:6px; } .otp-box { width:42px; height:52px; font-size:22px; } }

.thread { display:flex; flex-direction:column; gap:12px; max-height:560px; overflow-y:auto; overflow-x:hidden; padding:4px 2px; }
.msg { max-width:82%; align-self:flex-start; background:var(--line); border-radius:14px 14px 14px 4px; padding:10px 14px; }
.msg.right { align-self:flex-end; background:var(--tint2); border-radius:14px 14px 4px 14px; }
.msg-head { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; font-size:12.5px; color:var(--fg3); margin-bottom:4px; }
.msg-head b { color:var(--fg1); font-weight:600; font-size:13.5px; }
.msg-tag { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--line2); }
.msg-body { white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; line-height:1.55; color:var(--fg1); }
.msg-foot { display:flex; gap:14px; margin-top:6px; font-size:13px; }
.msg-raw { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; max-height:260px; overflow:auto; background:var(--bg,#fff); border:1px solid var(--line); border-radius:8px; padding:8px; margin:8px 0 0; }
.composer { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:14px; }
.composer textarea { width:100%; font-size:15px; resize:vertical; }
.composer-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
@media (max-width:600px) { .msg { max-width:95%; } .composer-row .hint { display:none; } }

.preview-modal { max-width:720px; width:100%; }
.mail-meta { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; } .mail-meta span { color:var(--fg3); } .mail-meta b { font-weight:500; overflow-wrap:anywhere; }
.mail-frame { width:100%; height:62vh; border:1px solid var(--line); border-radius:10px; background:#F5F6F7; }

.totp-nudge { max-width:440px; text-align:left; }
.totp-phone { width:96px; height:136px; align-self:center; }
.ph-body { fill:#0A0C0F; } .ph-screen { fill:#F2FAFE; } .ph-dot { fill:#3A4048; }
.ph-shield { fill:#2EB9EA; } .ph-check { fill:none; stroke:#fff; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
.ph-code { font:700 13px/1 'Arial Nova',Arial,sans-serif; letter-spacing:1.5px; fill:#0A0C0F; } .ph-bar { fill:#2EB9EA; opacity:.35; }
/* The footer line sits at the bottom of the page, also on short pages. */
.main { box-sizing:border-box; min-height:100vh; display:flex; flex-direction:column; } .main-in { flex:1 0 auto; width:100%; box-sizing:border-box; display:flex; flex-direction:column; } .main-in > * { flex-shrink:0; } .main-in > .foot { margin-top:auto; } .main-in > :nth-last-child(2) { margin-bottom:28px; }
@media print { .main { min-height:0; display:block; } .main-in { display:block; } }

/* Customer portal. Layout, type, colours and components come from the investor stylesheet (built in front of this file);
   this file only adds what exists in the customer portal alone, in the same tokens. */
html {
  --paper: var(--surface); --bone: var(--tint); --mist: var(--line); --steel: var(--line2); --blue-deep: var(--link); --blue-tint: var(--tint); --blue-ink: var(--link);
  --bad-bg: var(--badbg); --ok-bg: var(--okbg); --warn-bg: var(--warnbg); --r-sm: 8px; --r-md: 12px; --r-lg: 12px; --shadow: var(--card-shadow);
  --mono: 'Space Grotesk', ui-monospace, monospace;
}
h2 { font-size: 24px; margin-bottom: 14px; } h3 { font-size: 19px; font-weight: 400; margin-bottom: 8px; } h4 { font-size: 15px; font-weight: 700; margin: 1em 0 .4em; }
.muted { color: var(--fg3); } .mono { font-family: var(--mono); font-size: .9em; } .small { font-size: 13px; } .pre { white-space: pre-wrap; }
.logo { height: 26px; width: auto; display: block; } .boot .logo { height: 34px; opacity: .6; }
.auth-form h1 { font-size: 30px; margin-bottom: 20px; letter-spacing: -.01em; } .auth-form .auth-box > p { color: var(--fg2); font-size: 14px; }
.field > span.field-h { font: 400 12px/1.4 var(--font); letter-spacing: 0; text-transform: none; color: var(--fg3); } .field-h.ok { color: var(--ok) !important; } .field-h.bad { color: var(--bad) !important; }
input[type=file] { padding: 9px; min-height: 0; font-size: 14px; }
.code-in { font-size: 26px; letter-spacing: .35em; text-align: center; max-width: 260px; } .sig-in { font-size: 20px; font-style: italic; }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.row-code { display: flex; gap: 12px; align-items: flex-end; } .row-code .field { max-width: 260px; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.back { display: inline-block; margin-bottom: 14px; text-decoration: none; color: var(--fg3); font-size: 14px; } .block { margin-top: 36px; } .site-h { font-size: 20px; margin-bottom: 16px; }
.empty { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; color: var(--fg2); box-shadow: var(--card-shadow); }
.nav-row .count { margin-left: auto; min-width: 22px; height: 22px; border-radius: 11px; background: var(--tint2); color: var(--link); font: 500 11px/22px var(--caps); text-align: center; padding: 0 6px; }
.nav-row.alert { color: var(--bad); } .nav-row.alert .count { background: var(--badbg); color: var(--bad); } html.rail .nav-row .count { display: none; }
a.seg-b { text-decoration: none; } .desk-seg { margin-bottom: 14px; }

/* cards and lists */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.cards .card { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-top h3 { margin: 0; }
.kind { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue-deep); font-weight: 700; }
.sys { border-top: 3px solid var(--blue); }
.sys-solar { border-top-color: #FFB547; } .sys-ev_charger { border-top-color: #37C98A; } .sys-ems { border-top-color: var(--ink-1); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--fg3); } .kv dd { margin: 0; }
.warr { font-size: 13px; color: var(--fg2); margin: 0; }
.cards .btn { align-self: flex-start; margin-top: auto; }
.docs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.docs li:first-child { border-top: 0; }
.docs li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 8px 0; border-top: 1px solid var(--mist); }
.docs.wide { background: var(--paper); border-radius: var(--r-md); padding: 6px 18px; box-shadow: var(--shadow); }
.doc-ic { font-size: 10px; font-weight: 700; color: var(--bad); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; }
.doc-t { flex: 1; min-width: 0; } .doc-t small { display: block; color: var(--fg3); font-size: 12px; }
.list { background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
.row-link { display: flex; align-items: center; gap: 16px; padding: 16px 20px; text-decoration: none; color: var(--fg1); border-top: 1px solid var(--mist); }
.row-link:first-child { border-top: 0; } .row-link:hover { background: var(--bone); }
.row-link.urgent { box-shadow: inset 4px 0 0 var(--bad); }
.row-link .grow { flex: 1; min-width: 0; } .row-link small { display: block; color: var(--fg3); font-size: 13px; }
.chev { color: var(--steel); font-size: 22px; }
.alertbox { background: var(--bad-bg); color: #7A2318; border-left: 4px solid var(--bad); border-radius: var(--r-sm); padding: 16px 18px; margin-bottom: 20px; }
.alertbox h3 { font-weight: 700; font-size: 16px; }
.pdf-wrap { margin: 20px 0; display: grid; gap: 10px; justify-items: start; }
.pdf-wrap iframe { width: 100%; height: 70vh; border: 1px solid var(--mist); border-radius: var(--r-md); background: #fff; }
.sign { border-top: 3px solid var(--blue); display: grid; gap: 16px; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--mist); border-radius: var(--r-sm); cursor: pointer; }
.choice.on { border-color: var(--blue); background: var(--blue-tint); }
.signed { background: var(--ok-bg); color: #145C3F; border-radius: var(--r-sm); padding: 16px 18px; }
.steps { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding: 0; margin: 16px 0 18px; counter-reset: s; }
.steps li { position: relative; font-size: 12px; color: var(--fg3); text-align: center; padding-top: 22px; }
.steps li span { position: absolute; top: 4px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--mist); z-index: 1; }
.steps li::before { content: ''; position: absolute; top: 9px; left: -50%; right: 50%; height: 2px; background: var(--mist); }
.steps li:first-child::before { display: none; }
.steps li.done { color: var(--fg1); } .steps li.done span, .steps li.done::before { background: var(--blue); }
.lines { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; display: grid; gap: 6px; }
.lines li span { color: var(--fg3); } .lines small { color: var(--fg3); }
.kpi { background: var(--ink-1); color: #fff; border-radius: var(--r-md); padding: 12px 18px; text-align: right; }
.kpi small { display: block; color: rgba(255,255,255,.6); font-size: 12px; } .kpi b { font-size: 22px; font-weight: 400; }
.table-wrap { overflow-x: auto; background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.tbl .num { text-align: right; white-space: nowrap; }
.tbl .ref { display: block; font-size: 12px; color: var(--fg3); }

/* support thread */
.thread { display: grid; gap: 14px; margin-bottom: 20px; }
.msg { background: var(--paper); border-radius: var(--r-md); padding: 16px 18px; box-shadow: var(--shadow); max-width: 820px; }
.msg.staff { border-left: 3px solid var(--blue); }
.msg.mine { margin-left: auto; background: #FBFCFD; }
.msg-h { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--fg3); margin-bottom: 6px; } .msg-h b { color: var(--fg1); }
.msg p { margin: 0; }
.atts { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }

/* assistant */
.chat-wrap { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
.chat-wrap:has(> .chat:only-child) { grid-template-columns: 1fr; }
.chat-list { display: grid; gap: 4px; background: var(--paper); border-radius: var(--r-md); padding: 8px; box-shadow: var(--shadow); max-height: 70vh; overflow-y: auto; }
.chat-list button { text-align: left; background: none; border: 0; padding: 10px; border-radius: var(--r-sm); font: 14px var(--font); color: var(--fg1); cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
.chat-list button small { display: block; color: var(--fg3); font-size: 12px; }
.chat-list button.on, .chat-list button:hover { background: var(--bone); }
.chat { background: var(--paper); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.chat-msgs { min-height: 320px; max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px; }
.bubble { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 15px; }
.bubble p { margin: 0; }
.bubble.user { align-self: flex-end; background: var(--ink-1); color: #fff; border-bottom-right-radius: 4px; }
.bubble.assistant { align-self: flex-start; background: var(--bone); border-bottom-left-radius: 4px; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--steel); animation: bl 1s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bl { 50% { opacity: .2; } }
.starters { display: grid; gap: 8px; margin: auto 0; }
.starters button { text-align: left; background: var(--bone); border: 1px solid var(--mist); border-radius: var(--r-sm); padding: 12px 14px; font: 15px var(--font); cursor: pointer; color: var(--fg1); }
.starters button:hover { border-color: var(--blue); }
.chat-in { display: flex; gap: 10px; align-items: flex-end; } .chat-in textarea { min-height: 52px; }
.fine { font-size: 12px; color: var(--fg3); margin: 0; }

/* account */
.sec-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; } .sec-row p { margin: 0; }
.enroll { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; background: var(--bone); border-radius: var(--r-md); padding: 16px; }
.enroll img { background: #fff; border-radius: var(--r-sm); padding: 6px; }

@media (max-width: 900px) {
  .chat-wrap { grid-template-columns: 1fr; }
  .chat-list { display: flex; overflow-x: auto; max-height: none; }
  .chat-list button { flex: 0 0 200px; }
  .steps li { font-size: 10px; }
  .bubble { max-width: 92%; }
  .cards { grid-template-columns: 1fr; }
  .tbl { min-width: 0; }
  .tbl tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-top: 1px solid var(--mist); }
  .tbl tr:first-child { border-top: 0; }
  .tbl td { padding: 0; border: 0; }
  .tbl td[data-l]::before { content: attr(data-l) ' '; color: var(--fg3); font-size: 12px; }
  .tbl .num { text-align: left; }
  .kpi { width: 100%; text-align: left; }
}

/* product library + registration */
.lib-group { padding: 6px 0 14px; border-bottom: 1px solid var(--line, #e7eaee); margin-bottom: 12px; }
.lib-group:last-child { border-bottom: 0; margin-bottom: 0; }
.lib-list { list-style: none; margin: 0; padding: 0; }
.lib-list li { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; align-items: center; padding: 8px 0; font-size: 15px; }
.lib-name { font-weight: 400; }
.lib-list a, .lib-actions a { color: var(--blue, #1B8FBE); text-decoration: none; font-size: 14px; white-space: nowrap; }
.lib-actions { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: auto; padding-top: 8px; }
.lib-card h3 { margin: 0; }
.small { font-size: 13px; }
.reg-item { border: 1px solid var(--line, #e7eaee); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 640px) { .lib-list li { grid-template-columns: 1fr; gap: 4px; } }

/* ---- Support desk (staff) ---- */
.desk-find { margin-bottom: 14px; max-width: 420px; } .desk-find input { width: 100%; }
.desk-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.desk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.desk-side h3 { margin: 0; font-size: 15px; } .desk-side .card { margin-bottom: 14px; }
.desk-side select { width: 100%; }
.desk-assign { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; }

/* same surfaces as the investor cards */
.list, .docs.wide, .table-wrap, .chat, .chat-list { background: var(--card); border: 1px solid var(--line); box-shadow: var(--card-shadow); }
.table-wrap { padding: 0 18px; }
.msg { background: var(--card); border: 1px solid var(--line); box-shadow: var(--card-shadow); } .msg.mine, .msg.customer { background: var(--card); } .msg.internal { background: var(--warnbg); border-color: transparent; box-shadow: none; }
.alertbox { color: var(--bad); } .signed { color: var(--ok); }
.bubble.user { background: var(--tint2); color: var(--fg1); }

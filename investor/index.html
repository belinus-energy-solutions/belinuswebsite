en herinneringen van afspraken, informatie over betalingen en rapportering, wijzigingen van deze voorwaarden en antwoorden op uw berichten.","Die e-mails worden verstuurd vanaf adressen van belinus.com en dienen de uitvoering van de overeenkomst en het beheer van uw investering. Bij de verzending kan worden gemeten of een e-mail is afgeleverd, geopend of geweigerd, om de levering te controleren. U kunt uw toestemming intrekken via investor@belinus.com. Mededelingen die noodzakelijk zijn voor de overeenkomst blijven we ook dan sturen."]],["Verwerking van uw persoonsgegevens (AVG)",["Verwerkingsverantwoordelijke is EVChargeking (Some BV), Probastraat 21, 2235 Westmeerbeek. Belinus verwerkt de gegevens namens EVChargeking als verwerker. Contact voor privacyvragen: legal@belinus.com.","Verwerkte gegevens: identiteits- en contactgegevens, investeringsgegevens, betalings- en rekeninggegevens, uw keuzes en afspraken, berichten, inlog- en beveiligingsgegevens (zoals tijdstip, IP-adres en verificatie) en gegevens over de bezorging van e-mails.","Doeleinden en grondslag: de uitvoering van de overeenkomst en de daaraan verbonden betalingen en rapportering (art. 6.1.b AVG); wettelijke verplichtingen, zoals fiscale, boekhoudkundige en antiwitwasverplichtingen (art. 6.1.c); de beveiliging van het platform en de preventie van fraude (art. 6.1.f); en uw toestemming voor e-mails die niet noodzakelijk zijn voor de overeenkomst (art. 6.1.a).","Verwerking op het platform: uw gegevens worden verwerkt op het investeerdersplatform investor.belinus.com. Hosting, database, serverfuncties en e-mailverzending worden verzorgd door gespecialiseerde dienstverleners die onder verwerkersovereenkomsten werken De hosting en de database staan in Frankfurt (Duitsland).. Gegevens worden niet verkocht en niet voor marketing van derden gebruikt.","Uw rechten: u kunt inzage, rectificatie, wissing, beperking, overdraagbaarheid en bezwaar vragen en uw toestemming intrekken. U kunt een klacht indienen bij de Gegevensbeschermingsautoriteit (www.gegevensbeschermingsautoriteit.be).","Beveiliging: verificatie in twee stappen, versleutelde verbindingen, beperkte toegang voor medewerkers en een logboek van beheerhandelingen."]],["Bewaartermijnen",["Investeringsgegevens en de overeenkomst: gedurende de looptijd en daarna 10 jaar, en in elk geval de wettelijke bewaartermijn van zeven jaar voor boekhoudkundige en fiscale stukken.","Berichten en e-mails: 10 jaar na het laatste contact.","Inlog- en beveiligingslogboeken: 10 jaar.","Na afloop van de bewaartermijn worden gegevens verwijderd of geanonimiseerd, tenzij een wettelijke verplichting of een lopend geschil langer bewaren vereist."]],["Aanvaarding en wijzigingen",["U aanvaardt deze voorwaarden bij uw eerste aanmelding door ze te lezen en te bevestigen. Zonder aanvaarding hebt u geen toegang tot het platform.","Bij elke wijziging worden deze voorwaarden bij uw eerstvolgende aanmelding opnieuw voorgelegd. Per aanvaarding bewaren we de versie, het tijdstip en uw keuze voor e-mails."]],["Beschikbaarheid en aansprakelijkheid",["Het platform wordt met zorg aangeboden, zonder garantie van ononderbroken beschikbaarheid. Informatie op het platform is informatief en vervangt niet de overeenkomst of de offici\xEBle mededelingen."]],["Toepasselijk recht",["Op deze voorwaarden is Belgisch recht van toepassing. Geschillen worden voorgelegd aan de bevoegde rechtbank van Antwerpen."]]],scroll:"Scrol naar beneden om de volledige voorwaarden te lezen.",consent:"Ik heb de voorwaarden gelezen en ik aanvaard ze. Ik ga ermee akkoord dat Belinus namens EVChargeking e-mails naar mij stuurt over mijn investering en het platform, zoals beschreven in punt 3.",accept:"Aanvaarden en verder",out:"Afmelden",err:"Er ging iets mis. Probeer het opnieuw."},fr:{title:"Conditions d\u2019utilisation de la plateforme investisseurs",ver:"Version 2026-11-09",sec:[["Qui nous sommes et votre contrat",["Les pr\xE9sentes conditions sont les conditions g\xE9n\xE9rales d\u2019utilisation du nouveau portail investisseurs sur investor.belinus.com.","La plateforme investisseurs sur investor.belinus.com est propos\xE9e par EVChargeking (Some BV, Probastraat 21, 2235 Westmeerbeek, num\xE9ro d\u2019entreprise BE 0829.249.337), ci-apr\xE8s \xAB EVChargeking \xBB. Belinus g\xE8re la plateforme et l\u2019administration au nom d\u2019EVChargeking.","Chaque investisseur est li\xE9 contractuellement \xE0 EVChargeking par l\u2019obligation ou le contrat de pr\xEAt de la tranche \xE0 laquelle il a souscrit, ci-apr\xE8s \xAB le contrat \xBB. Les pr\xE9sentes conditions r\xE8glent l\u2019usage de la plateforme et compl\xE8tent le contrat. En cas de contradiction, le contrat pr\xE9vaut."]],["Acc\xE8s et s\xE9curit\xE9",["Vous vous connectez avec votre compte personnel et une deuxi\xE8me \xE9tape de v\xE9rification (code par e-mail, application d\u2019authentification ou lien personnel). Vous gardez vos identifiants secrets et ne partagez pas votre acc\xE8s. La plateforme est r\xE9serv\xE9e \xE0 l\u2019investisseur lui-m\xEAme. Signalez-nous au plus vite tout usage suspect de votre compte."]],["E-mails de Belinus",["Vous acceptez que Belinus envoie, au nom d\u2019EVChargeking, des e-mails \xE0 l\u2019adresse de votre compte au sujet de votre investissement et de la plateforme : invitations, liens d\u2019acc\xE8s, codes de connexion, confirmations et rappels de rendez-vous, informations sur les paiements et le reporting, modifications des pr\xE9sentes conditions et r\xE9ponses \xE0 vos messages.","Ces e-mails sont envoy\xE9s depuis des adresses belinus.com et servent \xE0 l\u2019ex\xE9cution du contrat et \xE0 la gestion de votre investissement. Lors de l\u2019envoi, la livraison, l\u2019ouverture ou le refus de l\u2019e-mail peuvent \xEAtre mesur\xE9s pour en contr\xF4ler la distribution. Vous pouvez retirer votre consentement via investor@belinus.com. Les communications n\xE9cessaires au contrat continueront d\u2019\xEAtre envoy\xE9es."]],["Traitement de vos donn\xE9es personnelles (RGPD)",["Le responsable du traitement est EVChargeking (Some BV), Probastraat 21, 2235 Westmeerbeek. Belinus traite les donn\xE9es au nom d\u2019EVChargeking en qualit\xE9 de sous-traitant. Contact pour les questions de vie priv\xE9e : legal@belinus.com.","Donn\xE9es trait\xE9es : donn\xE9es d\u2019identit\xE9 et de contact, donn\xE9es d\u2019investissement, donn\xE9es de paiement et de compte bancaire, vos choix et rendez-vous, messages, donn\xE9es de connexion et de s\xE9curit\xE9 (moment, adresse IP, v\xE9rification) et donn\xE9es de livraison des e-mails.","Finalit\xE9s et base juridique : l\u2019ex\xE9cution du contrat et les paiements et reporting qui s\u2019y rattachent (art. 6.1.b RGPD) ; les obligations l\xE9gales, notamment fiscales, comptables et de lutte contre le blanchiment (art. 6.1.c) ; la s\xE9curit\xE9 de la plateforme et la pr\xE9vention de la fraude (art. 6.1.f) ; et votre consentement pour les e-mails non n\xE9cessaires au contrat (art. 6.1.a).","Traitement sur la plateforme : vos donn\xE9es sont trait\xE9es sur la plateforme investisseurs investor.belinus.com. L\u2019h\xE9bergement, la base de donn\xE9es, les fonctions serveur et l\u2019envoi d\u2019e-mails sont assur\xE9s par des prestataires sp\xE9cialis\xE9s li\xE9s par des contrats de sous-traitance L\u2019h\xE9bergement et la base de donn\xE9es se trouvent \xE0 Francfort (Allemagne).. Les donn\xE9es ne sont ni vendues ni utilis\xE9es pour le marketing de tiers.","Vos droits : acc\xE8s, rectification, effacement, limitation, portabilit\xE9 et opposition, ainsi que le retrait de votre consentement. Vous pouvez introduire une r\xE9clamation aupr\xE8s de l\u2019Autorit\xE9 de protection des donn\xE9es (www.autoriteprotectiondonnees.be).","S\xE9curit\xE9 : v\xE9rification en deux \xE9tapes, connexions chiffr\xE9es, acc\xE8s limit\xE9 pour le personnel et journal des actions d\u2019administration."]],["Dur\xE9es de conservation",["Donn\xE9es d\u2019investissement et contrat : pendant la dur\xE9e du contrat puis 10 ans, et en tout cas le d\xE9lai l\xE9gal de sept ans pour les pi\xE8ces comptables et fiscales.","Messages et e-mails : 10 ans apr\xE8s le dernier contact.","Journaux de connexion et de s\xE9curit\xE9 : 10 ans.","\xC0 l\u2019issue de ces d\xE9lais, les donn\xE9es sont supprim\xE9es ou anonymis\xE9es, sauf si une obligation l\xE9gale ou un litige en cours impose une conservation plus longue."]],["Acceptation et modifications",["Vous acceptez les pr\xE9sentes conditions lors de votre premi\xE8re connexion en les lisant et en les confirmant. Sans acceptation, vous n\u2019avez pas acc\xE8s \xE0 la plateforme.","En cas de modification, les conditions vous seront \xE0 nouveau pr\xE9sent\xE9es lors de votre connexion suivante. Pour chaque acceptation, nous conservons la version, la date et heure et votre choix concernant les e-mails."]],["Disponibilit\xE9 et responsabilit\xE9",["La plateforme est propos\xE9e avec soin, sans garantie de disponibilit\xE9 ininterrompue. Les informations qu\u2019elle contient sont indicatives et ne remplacent ni le contrat ni les communications officielles."]],["Droit applicable",["Le droit belge est applicable aux pr\xE9sentes conditions. Les litiges sont soumis au tribunal comp\xE9tent d\u2019Anvers."]]],scroll:"Faites d\xE9filer jusqu\u2019en bas pour lire l\u2019int\xE9gralit\xE9 des conditions.",consent:"J\u2019ai lu les conditions et je les accepte. J\u2019accepte qu\u2019EVChargeking, par l\u2019interm\xE9diaire de Belinus, m\u2019envoie des e-mails au sujet de mon investissement et de la plateforme, comme d\xE9crit au point 3.",accept:"Accepter et continuer",out:"Se d\xE9connecter",err:"Une erreur s\u2019est produite. R\xE9essayez."},en:{title:"Terms of use of the investor platform",ver:"Version 2026-11-09",sec:[["Who we are and your contract",["These terms are the general terms of use of the new investor portal at investor.belinus.com.",'The investor platform at investor.belinus.com is provided by EVChargeking (Some BV, Probastraat 21, 2235 Westmeerbeek, company number BE 0829.249.337), "EVChargeking". Belinus operates the platform and administration on behalf of EVChargeking.','Each investor is contractually bound to EVChargeking under the bond or loan agreement of the tranche they subscribed to, "the agreement". These terms govern the use of the platform and supplement the agreement. In case of conflict, the agreement prevails.']],["Access and security",["You sign in with your personal account and a second verification step (e-mail code, authenticator app or personal link). You keep your sign-in details secret and do not share your access. The platform is for the investor only. Tell us as soon as possible if you suspect misuse of your account."]],["E-mails from Belinus",["You agree that Belinus, on behalf of EVChargeking, sends e-mails to the address of your account about your investment and the platform: invitations, access links, sign-in codes, confirmations and appointment reminders, payment and reporting information, changes to these terms and replies to your messages.","These e-mails are sent from belinus.com addresses and serve the performance of the agreement and the management of your investment. Delivery, opening or rejection of an e-mail may be measured to check distribution. You may withdraw your consent via investor@belinus.com. Communications necessary for the agreement will continue to be sent."]],["Processing of your personal data (GDPR)",["The controller is EVChargeking (Some BV), Probastraat 21, 2235 Westmeerbeek. Belinus processes the data on behalf of EVChargeking as processor. Privacy contact: legal@belinus.com.","Data processed: identity and contact details, investment data, payment and bank account details, your choices and appointments, messages, sign-in and security data (such as time, IP address and verification) and e-mail delivery data.","Purposes and legal basis: performance of the agreement and the related pa

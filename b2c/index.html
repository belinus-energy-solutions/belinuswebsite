}
.app-card .display-sm { color: var(--fg-2); }
.app-card .body-md { margin: 0; }
.app-uses {
  list-style: none; margin: 4px 0 0; padding: 0;
  border-top: 1px solid var(--ink-4);
}
.app-uses li {
  padding: 12px 0 12px 22px; position: relative;
  border-bottom: 1px solid var(--ink-4);
  font-size: 15px; line-height: 1.45; color: var(--fg-1);
}
.app-uses li::before {
  content: ""; position: absolute; left: 2px; top: 19px;
  width: 8px; height: 1px; background: var(--brand-blue);
}

.app-compare {
  margin-top: 64px;
  border: 1px solid var(--ink-4);
  border-radius: var(--r-md);
  overflow-x: auto;
}
.app-compare-row {
  display: grid; grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 16px; align-items: center;
  min-width: 560px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--ink-4);
}
.app-compare-row:last-child { border-bottom: 0; }
.app-compare-head { background: rgba(255,255,255,0.02); }
.app-compare-head .label { color: var(--fg-3); }
.app-compare-need { color: var(--fg-1); font-size: 15px; }
.app-fit {
  font-family: var(--font-caps); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3);
}
.app-fit.fit-bestfit, .app-fit.fit-yes { color: var(--brand-blue); }
.app-fit.fit-goodfit { color: var(--fg-1); }

/* ------------------ Home intro: power vs energy ------------------ */
.intro-scale {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 20px;
  font-family: var(--font-caps); font-size: 11px; font-weight: 500;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3);
}
.intro-scale-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--brand-blue), var(--ink-5));
}
.intro-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4);
}
@media (max-width: 900px) { .intro-grid { grid-template-columns: 1fr; } .intro-scale { display: none; } }
.intro-card {
  min-width: 0; background: var(--ink-0);
  padding: 40px 32px;
  display: flex; flex-direction: column; gap: 16px;
}
.intro-card-head { display: flex; justify-content: space-between; gap: 12px; }
.intro-card .body-md { margin: 0; }
.intro-tech { margin-top: auto; padding-top: 12px; color: var(--fg-3); font-size: 12px; }
.intro-power { background: linear-gradient(180deg, rgba(46,185,234,0.07), var(--ink-0) 70%); }

.partner-logo-tile {
  display: inline-flex; align-items: center; justify-content: flex-start;
  background: transparent;
  width: 200px; height: 84px; max-width: 100%;
}
.partner-logo-tile img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

.ref-cell.has-logo {
  display: grid; grid-template-columns: auto 1fr;
  column-gap: 20px; row-gap: 6px; align-content: center; align-items: center;
}
.ref-cell.has-logo .ref-logo { grid-row: 1 / span 2; }
.ref-logo { height: 64px; width: auto; max-width: 96px; object-fit: contain; }

/* ------------------ Header support link ------------------ */
.header-support {
  color: var(--fg-2); text-decoration: none; padding: 8px 6px;
  border-bottom: 1px solid transparent;
}
.header-support:hover, .header-support.is-active { color: var(--fg-1); border-bottom-color: var(--brand-blue); }
@media (max-width: 640px) { .header-support { display: none; } }

/* ------------------ Support & partner pages ------------------ */
.support-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 900px) { .support-grid { grid-template-columns: 1fr; } }
.support-grid > * { min-width: 0; }
.login-box, .support-contact {
  display: flex; flex-direction: column; gap: 16px;
  border: 1px solid var(--ink-4); border-radius: var(--r-md);
  padding: 40px 36px;
  background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
}
.login-box { border-color: rgba(46,185,234,0.4); }
.login-box label { display: flex; flex-direction: column; gap: 6px; }
.login-box input {
  font: inherit; font-size: 15px; color: var(--fg-1);
  background: var(--ink-1); border: 1px solid var(--ink-5); border-radius: var(--r-sm);
  padding: 12px 14px;
}
.login-box input:focus-visible { outline: 1px solid var(--brand-blue); border-color: var(--brand-blue); }
.login-box .btn { align-self: flex-start; }
.login-note { min-height: 1.4em; margin: 0; color: var(--brand-blue); font-size: 14px; }
.login-small { margin: 0; color: var(--fg-3); font-size: 13px; line-height: 1.5; }
.support-contact .body-md { margin: 0; }

.copy-email { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px; }
.copy-email-addr {
  font-family: var(--font-display); font-size: clamp(20px, 2.2vw, 28px); font-weight: 300;
  color: var(--fg-1); user-select: all; overflow-wrap: anywhere;
}
.copy-email-btn {
  font-family: var(--font-caps); font-size: 11px; font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; cursor: pointer;
  color: var(--brand-blue); background: rgba(46,185,234,0.08);
  border: 1px solid rgba(46,185,234,0.35); border-radius: var(--r-pill); padding: 7px 14px;
}
.copy-email-btn:hover { background: rgba(46,185,234,0.16); }
.copy-email-open { color: var(--fg-3); }

.steps-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.step {
  display: grid; grid-template-columns: 64px 1fr; gap: 24px;
  padding: 28px 0; border-bottom: 1px solid var(--ink-4);
}
.step > div { min-width: 0; }
.step-num { color: var(--brand-blue); font-size: 14px; padding-top: 4px; }
.step-h { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin-bottom: 8px; }
.step .body-md { margin: 0; max-width: 62ch; }
.support-note {
  margin-top: 40px; padding: 24px 28px;
  border: 1px solid rgba(245,179,1,0.35); border-radius: var(--r-md);
  background: rgba(245,179,1,0.05);
}
.support-note .body-md { margin: 0; }
.support-note b { color: var(--warning); font-weight: 500; }

.partner-types {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4);
}
@media (max-width: 900px) { .partner-types { grid-template-columns: 1fr; } }
.partner-type { background: var(--ink-0); padding: 36px 32px; min-width: 0; }
.partner-type .body-md { margin: 12px 0 0; }
.partner-gets { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.partner-gets li {
  padding: 11px 0 11px 22px; position: relative; border-bottom: 1px solid var(--ink-4);
  font-size: 15px; color: var(--fg-1);
}
.partner-gets li::before { content: ""; position: absolute; left: 2px; top: 20px; width: 8px; height: 1px; background: var(--brand-blue); }

/* ------------------ Legal pages ------------------ */
.footer-legal { display: inline-flex; gap: 20px; flex-wrap: wrap; }
.footer-legal a { color: var(--fg-3); text-decoration: none; }
.footer-legal a:hover { color: var(--fg-1); }
.legal-wrap { max-width: 860px; }
.legal-meta { color: var(--fg-3); margin-top: 16px; }
.legal-toc {
  display: flex; flex-direction: column; gap: 6px;
  padding: 20px 24px; margin-bottom: 48px;
  border: 1px solid var(--ink-4); border-radius: var(--r-md);
}
.legal-toc a { color: var(--fg-2); text-decoration: none; font-size: 15px; }
.legal-toc a:hover { color: var(--brand-blue); }
.legal-sec { padding: 28px 0; border-top: 1px solid var(--ink-4); scroll-margin-top: 96px; }
.legal-sec h3 {
  font-family: var(--font-display); font-weight: 400; font-size: 22px;
  color: var(--fg-1); margin-bottom: 14px;
}
.legal-sec p, .legal-sec li { color: var(--fg-2); font-size: 16px; line-height: 1.65; max-width: 68ch; }
.legal-sec p { margin: 0 0 12px; }
.legal-sec ul { margin: 0 0 12px; padding-left: 20px; }
.legal-sec li { margin-bottom: 6px; }
.legal-sec b { color: var(--fg-1); font-weight: 500; }
.legal-sec a { color: var(--brand-blue); }
.legal-ph { background: rgba(245,179,1,0.18); color: var(--warning); padding: 0 4px; border-radius: 3px; }

/* ------------------ News ------------------ */
.news-empty {
  display: flex; flex-direction: column; gap: 12px;
  padding: 40px 36px; max-width: 640px;
  border: 1px dashed var(--ink-5); border-radius: var(--r-md);
}
.news-empty .body-md { margin: 0; }
.news-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.news-item {
  display: grid; grid-template-columns: 200px 1fr; gap: 32px;
  padding: 32px 0; border-bottom: 1px solid var(--ink-4);
}
@media (max-width: 700px) { .news-item { grid-template-columns: 1fr; gap: 12px; } }
.news-item > * { min-width: 0; }
.news-meta { display: flex; flex-direction: column; gap: 8px; color: var(--fg-3); }
.news-meta time { color: var(--brand-blue); font-size: 13px; }
.news-body .body-md { margin: 12px 0 0; max-width: 62ch; }

.news-link { display: inline-block; margin-top: 16px; color: var(--brand-blue); text-decoration: none; }
.news-link:hover { text-decoration: underline; }

/* ------------------ Press kit ------------------ */
.press-h { display: block; color: var(--fg-3); margin: 56px 0 20px; }
.press-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
@media (max-width: 800px) { .press-grid { grid-template-columns: 1fr; } }
.press-card { min-width: 0; border: 1px solid var(--ink-4); border-radius: var(--r-md); overflow: hidden; }
.press-preview { height: 180px; display: flex; align-items: center; justify-content: center; padding: 32px; }
.press-preview img { max-width: 80%; max-height: 100%; object-fit: contain; }
.press-light { background: #FFFFFF; }
.press-dark { background: var(--ink-1); }
.press-card-body { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 22px; border-top: 1px solid var(--ink-4); }
.press-name { color: var(--fg-1); font-size: 15px; }
.press-files { display: flex; gap: 8px; flex-wrap: wrap; }
.press-file {
  color: var(--brand-blue); text-decoration: none;
  border: 1px solid rgba(46,185,234,0.35); border-radius: var(--r-pill); padding: 6px 12px;
}
.press-file:hover { background: rgba(46,185,234,0.1); }
.press-slogan { font-family: var(--font-display); font-weight: 300; font-size: clamp(32px, 4.5vw, 64px); line-height: 1.1; letter-spacing: -0.015em; color: var(--fg-1); margin: 0; }
.press-slogan em { font-style: normal; color: var(--brand-blue); }
.press-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 800px) { .press-colors { grid-template-columns: 1fr 1fr; } }
.press-color { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.press-swatch { height: 72px; border-radius: var(--r-sm); border: 1px solid var(--ink-4); }
.press-hex { color: var(--fg-2); font-size: 13px; }
.press-fonts { display: flex; flex-direction: column; border-top: 1px solid var(--ink-4); }
.press-font { display: grid; grid-template-columns: 200px 220px 1fr; gap: 16px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--ink-4); }
@media (max-width: 800px) { .press-font { grid-template-columns: 1fr; gap: 4px; } }
.press-font > * { min-width: 0; }
.press-font .body-md { margin: 0; }
.press-font a { color: var(--brand-blue); }
.press-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 24px 28px; border: 1px solid var(--ink-4); border-radius: var(--r-md); max-width: 760px; }
.press-copy .body-md { margin: 0; }
.press-rules { margin: 0; padding-left: 20px; color: var(--fg-2); max-width: 70ch; }
.press-rules li { margin-bottom: 8px; line-height: 1.6; }

/* ---- International row + B2C note in drawer ---- */
.drawer-country.is-intl { border-bottom: 1px dashed var(--ink-4); }
.drawer-region-note { font-size: 13px; line-height: 1.5; color: var(--fg-3); margin: 0 0 12px; }
.drawer-region-note b { color: var(--fg-1); font-weight: 600; }
.drawer-cookie-link { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-caps); font-size: 11px; letter-spacing: .14em; color: var(--fg-3); text-decoration: underline; text-underline-offset: 3px; }
.drawer-cookie-link:hover { color: var(--brand-blue); }
.footer-cookie-btn { background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-caps); font-size: 10px; letter-spacing: .2em; color: var(--fg-3); }
.footer-cookie-btn:hover { color: var(--brand-blue); }
.legal-table { width: 100%; border-collapse: collapse; margin: 16px 0 20px; font-size: 14px; }
.legal-table th, .legal-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--ink-4); vertical-align: top; }
.legal-table th { font-family: var(--font-caps); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; }
.legal-table code { font-family: var(--font-mono, monospace); color: var(--brand-blue); font-size: 13px; }
@media (max-width: 640px) { .legal-table { display: block; overflow-x: auto; } }

/* News: scheduled badge, multiple links, recall notice */
.news-sched { color: #F5A623; border: 1px solid rgba(245,166,35,.5); border-radius: 999px; padding: 4px 10px; align-self: flex-start; font-size: 11px; }
.news-links { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.news-recall { border-left: 2px solid #F5A623; padding-left: 20px; }
.news-recall .news-meta .label:not(.news-sched) { color: #F5A623; }

/* ---- Website forms (shared B2B + B2C) ---- */
.contact-form { max-width: 760px; margin: 64px auto 0; padding: 0 var(--gutter, 24px); text-align: left; }
.webform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.webform-grid .wide { grid-column: 1 / -1; }
@media (max-width: 600px) { .webform-grid { grid-template-columns: 1fr; } }
.webform label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.webform input, .webform select, .webform textarea {
  font: inherit; font-size: 15px; color: var(--fg-1); width: 100%;
  background: var(--ink-1); border: 1px solid var(--ink-5); border-radius: var(--r-sm); padding: 12px 14px;
}
.webform textarea { resize: vertical; min-height: 110px; }
.webform input:focus-visible, .webform select:focus-visible, .webform textarea:focus-visible { outline: 1px solid var(--brand-blue); border-color: var(--brand-blue); }
.webform label.webform-consent, .webform label.b2c-check { flex-direction: row; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--fg-2); line-height: 1.45; }
.webform-consent input { width: 18px; height: 18px; margin: 1px 0 0; padding: 0; accent-color: var(--brand-blue); flex: 0 0 auto; }
.webform-consent a, .webform-fail a { color: var(--brand-blue); }
.webform-hp { position: absolute !important; left: -9999px !important; width: 1px !important; height: 1px !important; opacity: 0; }
.webform button[disabled] { opacity: .6; cursor: progress; }
.webform-fail { margin: 0; color: #F5A623; font-size: 14px; line-height: 1.5; }
.webform-ok { align-items: flex-start; }
.webform-ok .b2c-thanks-check { width: 56px; height: 56px; }
.webform-ok .b2c-thanks-check circle { fill: none; stroke: var(--brand-blue); stroke-width: 2; }
.webform-ok .b2c-thanks-check path { fill: none; stroke: var(--brand-blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.b2b-sheets { margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--ink-4); display: flex; flex-direction: column; gap: 12px; }
.b2b-sheets .body-md { margin: 0; color: var(--fg-3); }
.b2b-sheets-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.b2b-sheet { display: inline-flex; gap: 10px; align-items: center; padding: 10px 16px; border: 1px solid var(--ink-5); border-radius: 999px; color: var(--fg-1); text-decoration: none; font-size: 14px; }
.b2b-sheet:hover { border-color: var(--brand-blue); color: var(--brand-blue); }
.b2b-sheet .mono { font-size: 11px; color: var(--brand-blue); }

/* ---- Small screens: no horizontal overflow ---- */
@media (max-width: 640px) {
  .site-footer-bottom { flex-wrap: wrap; gap: 8px 16px; }
  .product-card { padding: 28px 22px; }
  .product-card-head { flex-wrap: wrap; gap: 6px 12px; }
  .roadmap-row { grid-template-columns: 84px 16px minmax(0, 1fr); gap: 12px; }
  .roadmap-event { overflow-wrap: anywhere; }
  .label { overflow-wrap: anywhere; }
}
@media (max-width: 420px) {
  .region-country, .region-country + .region-sep { display: none; }
}

/* ---- Portal login (customer / partner) ---- */
.portal input { width: 100%; }
.portal-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.portal-link { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--brand-blue); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.portal-error { color: #F5A623; line-height: 1.5; }
.portal-info { margin: 8px 0 0; padding-top: 20px; border-top: 1px solid var(--ink-4); display: grid; gap: 12px; }
.portal-info div { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 12px; align-items: baseline; }
.portal-info dt { color: var(--fg-3); }
.portal-info dd { margin: 0; color: var(--fg-1); font-size: 14px; line-height: 1.5; }
.portal-info a { color: var(--brand-blue); }
@media (max-width: 480px) { .portal-info div { grid-template-columns: 1fr; gap: 4px; } }
.support-form { margin-top: 32px; }

/* ---- Company: about, story, values, people ---- */
.about-facts { margin: 56px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4); border-radius: var(--r-md); overflow: hidden; }
.about-fact { background: var(--ink-0, #0A0C0F); padding: 24px 28px; display: flex; flex-direction: column; gap: 8px; }
.about-fact dt { color: var(--fg-3); }
.about-fact dd { margin: 0; color: var(--fg-1); font-size: 16px; line-height: 1.5; }
@media (max-width: 900px) { .about-facts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .about-facts { grid-template-columns: 1fr; } }
.story-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-4); }
.story-item { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 32px; padding: 28px 0; border-bottom: 1px solid var(--ink-4); }
.story-date { color: var(--brand-blue); font-size: 13px; padding-top: 6px; }
.story-h { margin: 0; font-size: 22px; font-weight: 400; color: var(--fg-1); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.story-body .body-md { margin: 10px 0 0; max-width: 62ch; }
@media (max-width: 640px) { .story-item { grid-template-columns: 1fr; gap: 8px; } }
.values-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1000px) { .values-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .values-grid { grid-template-columns: 1fr; } }
.value-card { border: 1px solid var(--ink-4); border-radius: var(--r-md); padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; }
.value-card .body-md { margin: 0; }
.value-num { color: var(--brand-blue); font-size: 13px; }
.people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .people-grid { grid-template-columns: 1fr; } }
.person-card { border: 1px solid var(--ink-4); border-radius: var(--r-md); padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; }
.person-card .body-md { margin: 0; }
.person-card.is-placeholder { border-style: dashed; }
.about-confirm { color: #F5A623; border: 1px dashed rgba(245,166,35,.6); border-radius: 999px; padding: 3px 10px; font-size: 10px; }
.form-reveal { display: flex; }
.form-reveal.is-open { display: block; scroll-margin-top: 100px; animation: b2cStepIn 400ms var(--ease-out, ease-out); }
@keyframes b2cStepIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.form-open-btn { margin-top: 12px; }
.contact-form .form-open-btn { display: flex; justify-content: center; margin-top: 0; }

/* ---- Product cards link to product line pages ---- */
.product-card-link { display: block; color: inherit; text-decoration: none; cursor: pointer; }
.product-card-link:hover { border-color: var(--brand-blue); }
.product-card-more { display: inline-block; margin-top: 28px; color: var(--brand-blue); }
.product-card-link:hover .product-card-more { text-decoration: underline; text-underline-offset: 4px; }

/* ---- Product line pages ---- */
.pl-back { display: inline-block; margin-bottom: 40px; color: var(--fg-3); text-decoration: none; }
.pl-back:hover { color: var(--brand-blue); }
.pl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 8px; }
@media (max-width: 1000px) { .pl-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .pl-grid { grid-template-columns: 1fr; } }
.pl-card { border: 1px solid var(--ink-4); border-radius: var(--r-md); padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; transition: border-color 300ms; }
.pl-card:hover { border-color: rgba(46,185,234,.5); }
.pl-card .body-md { margin: 0; }
.pl-specs { margin: 0; display: grid; gap: 0; border-top: 1px solid var(--ink-4); }
.pl-specs div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--ink-4); }
.pl-specs dt { color: var(--fg-3); }
.pl-specs dd { margin: 0; color: var(--fg-1); font-size: 14px; text-align: right; }
.pl-project { color: var(--fg-3); }
.pl-actions { margin-top: auto; padding-top: 8px; }
.pl-sheet { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--ink-5); border-radius: 999px; color: var(--fg-1); text-decoration: none; font-size: 14px; }
.pl-sheet .mono { font-size: 11px; color: var(--brand-blue); }
.pl-sheet:hover { border-color: var(--brand-blue); }
.pl-sheet.is-request { border-style: dashed; }
.pl-foot { margin-top: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; }
.pl-homes { color: var(--brand-blue); text-decoration: none; }
.pl-card, .pl-card * { min-width: 0; }
.pl-card h3 { overflow-wrap: anywhere; hyphens: auto; }
.pl-specs dt, .pl-specs dd { overflow-wrap: anywhere; }
@media (max-width: 640px) { .pl-card { padding: 26px 20px; } }

/* ---- Product cards: two actions ---- */
.product-card-v2 { display: flex; flex-direction: column; }
.product-card-v2 .product-bom { flex: 1; }
.product-card-actions { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--ink-4); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.product-card-actions .product-card-more { margin-top: 0; text-decoration: none; }
.product-card-actions .product-card-more:hover { text-decoration: underline; text-underline-offset: 4px; }

/* ---- Project request form ---- */
.pr-box { margin-top: 8px; }
.pr-grid { animation: b2cStepIn 400ms var(--ease-out, ease-out); }
.pr-chips { border: 0; padding: 0; margin: 0; grid-column: 1 / -1; }
.pr-chips legend { margin-bottom: 10px; padding: 0; color: var(--fg-3); }
.pr-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pr-chip { font: inherit; font-size: 14px; color: var(--fg-2); background: var(--ink-1); border: 1px solid var(--ink-5); border-radius: 999px; padding: 9px 14px; cursor: pointer; text-align: left; }
.pr-chip:hover { border-color: var(--brand-blue); color: var(--fg-1); }
.pr-chip.is-on { border-color: var(--brand-blue); color: var(--fg-1); background: rgba(46,185,234,.12); }
.pr-chip.is-on::before { content: '✓ '; color: var(--brand-blue); }
.b2c-quote-head { display: flex; justify-content: space-between; gap: 12px; }
.b2c-quote-bar { height: 2px; background: var(--ink-4); border-radius: 2px; overflow: hidden; }
.b2c-quote-bar span { display: block; height: 100%; background: var(--brand-blue); transition: width 500ms; }
.b2c-quote-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.b2c-quote-nav .btn { margin-left: auto; }
.footer-address { margin: 20px 0 0; color: var(--fg-2); font-size: 13px; line-height: 1.7; }

/* ---- Warranty strip ---- */
.warranty-wrap { margin: 4px 0 0; }
.warranty-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px 0; border-top: 1px solid var(--ink-4); border-bottom: 1px solid var(--ink-4); }
.warranty-strip.n1 { grid-template-columns: 1fr; }
.warranty-item { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.warranty-v { color: var(--brand-blue); font-size: 26px; font-weight: 300; line-height: 1; letter-spacing: -.01em; white-space: nowrap; }
.warranty-v small { font-size: 13px; letter-spacing: 0; }
.warranty-k { color: var(--fg-3); font-size: 10px; line-height: 1.4; overflow-wrap: normal; word-break: normal; hyphens: auto; }
.warranty-strip.is-project { display: block; }
.warranty-note { margin: 8px 0 0; font-size: 12px; color: var(--fg-3); }
.warranty-k { hyphens: manual; overflow-wrap: normal !important; word-break: keep-all; letter-spacing: .08em; }
@media (max-width: 520px) {
  .warranty-strip { grid-template-columns: 1fr; gap: 10px; }
  .warranty-item { flex-direction: row; align-items: baseline; gap: 14px; }
  .warranty-v { min-width: 72px; font-size: 22px; }
}
@media (max-width: 640px) { .display, .display-mid, .display-sm { hyphens: auto; overflow-wrap: break-word; } }
/* Align warranty strips and data sheet buttons across cards in a row */
.pl-card .warranty-wrap { margin-top: auto; padding-top: 8px; }
.pl-card .pl-actions { margin-top: 0; }
.pl-card .pl-specs div:last-child { border-bottom: 0; }
.pl-card .warranty-strip { min-height: 92px; align-content: center; }
.pl-card .warranty-wrap { min-height: 128px; display: flex; flex-direction: column; justify-content: flex-start; }
.pl-card .warranty-strip.is-project { min-height: 92px; display: flex; align-items: center; }

/* ---- Home energy infographic ---- */
.home-energy { margin: 8px 0 48px; border: 1px solid var(--ink-4); border-radius: var(--r-md); overflow: hidden; background: #05080b; }
.home-energy svg { display: block; width: 100%; height: auto; }
.he-dash { animation: heDash 1.2s linear infinite; }
@keyframes heDash { to { stroke-dashoffset: -24; } }
.home-energy-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 24px; padding: 20px 24px; border-top: 1px solid var(--ink-4); font-size: 13px; color: var(--fg-2); }
.home-energy-legend span { display: flex; align-items: center; gap: 10px; }
.home-energy-legend b { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--brand-blue); color: var(--fg-1); font-size: 11px; display: grid; place-items: center; }
@media (max-width: 900px) { .home-energy-legend { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .home-energy-legend { grid-template-columns: 1fr; } }
.ha-pulse { animation: haPulse 3s linear infinite; }
@keyframes haPulse { from { stroke-dashoffset: 614; } to { stroke-dashoffset: 0; } }
.home-energy-legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-blue); flex: 0 0 auto; }
.home-energy-legend em { font-style: normal; color: var(--brand-blue); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-left: 4px; }
.home-energy svg text { font-family: inherit; }

/* Solar product line: why back-contact + families */
.pl-why { list-style: none; margin: 8px 0 24px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.pl-why li { border-left: 1px solid var(--brand-blue); padding: 2px 0 2px 16px; color: var(--fg-2); min-width: 0; }
@media (max-width: 1000px) { .pl-why { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .pl-why { grid-template-columns: 1fr; } }
.pl-group { padding-top: 56px; margin-top: 40px; border-top: 1px solid var(--ink-4); scroll-margin-top: 96px; }
.pl-group-head { display: grid; gap: 12px; margin-bottom: 24px; max-width: 72ch; }
.pl-group-head .eyebrow { color: var(--brand-blue); }
.products-grid.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .products-grid.n4 { grid-template-columns: 1fr; } }
/* ================================================================
   B2C (homes) — small additions on top of the B2B stylesheets.
   Everything else comes from the B2B site so both look identical.
   ================================================================ */

.display-mid em, .b2c-em { font-style: normal; color: var(--brand-blue); }

.page-home > .b2c-hero { padding-top: 0; }
.b2c-hero .hero-bg img { object-position: 55% 35%; }

/* 4-up grids */
.b2c-grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .b2c-grid-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .b2c-grid-4 { grid-template-columns: 1fr; } }
.b2c-grid-4 .pillar { padding: 40px 32px; }

/* two-column split: heading left, content right */
.b2c-split { display: grid; grid-template-columns: 1fr 1.15fr; gap: 80px; align-items: start; }
@media (max-width: 900px) { .b2c-split { grid-template-columns: 1fr; gap: 48px; } }

/* media breaks with video */
.b2c-break .puma-media video { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) brightness(.9); }
.b2c-break-foot { margin-top: 28px; }
.b2c-terms { color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; }
a.b2c-terms:hover { color: var(--brand-blue); }
.b2c-break-logo {
  position: absolute; right: 48px; bottom: 40px; z-index: 2;
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
}
.b2c-break-logo img { height: 22px; width: auto; filter: brightness(0) invert(1); opacity: .9; }
@media (max-width: 900px) { .b2c-break-logo { right: 24px; bottom: 24px; } }

/* CTA bands */
.b2c-scan-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
.b2c-scan-inner .display-mid { margin: 0; }
.b2c-partner-band { background: linear-gradient(180deg, rgba(46,185,234,0.07), transparent 80%); }

/* product blocks */
.b2c-stack { display: flex; flex-direction: column; gap: 24px; }
.b2c-product-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: start; margin-top: 8px; }
.b2c-product .product-card-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
.b2c-specs { margin-bottom: 0; }
@media (max-width: 900px) {
  .b2c-product-grid { grid-template-columns: 1fr; gap: 32px; }
}
@media (max-width: 480px) { .b2c-specs { grid-template-columns: 1fr; } }

/* forms */
.b2c-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .b2c-form-row { grid-template-columns: 1fr; } }
.b2c-form select, .b2c-form textarea {
  font: inherit; font-size: 15px; color: var(--fg-1);
  background: var(--ink-1); border: 1px solid var(--ink-5); border-radius: var(--r-sm);
  padding: 12px 14px; width: 100%;
}
.b2c-form textarea { resize: vertical; min-height: 110px; }
.b2c-form input { width: 100%; }
.b2c-form select:focus-visible, .b2c-form textarea:focus-visible { outline: 1px solid var(--brand-blue); border-color: var(--brand-blue); }
.login-small a, .fineprint a, .spec-row dd a { color: var(--brand-blue); }
.spec-row dd { color: var(--fg-1); font-size: 15px; line-height: 1.5; }
.b2c-hero .display { font-size: clamp(42px, 6vw, 96px); }

/* ---- Animated "how it works" steps ---- */
.b2c-anim-steps { position: relative; }
.b2c-rail {
  position: absolute; left: 20px; top: 52px; bottom: 52px; width: 1px;
  background: var(--ink-4); pointer-events: none;
}
.b2c-rail-fill {
  position: absolute; left: 0; top: 0; width: 1px;
  height: calc(var(--p, 0) * 100%);
  background: linear-gradient(180deg, rgba(46,185,234,0.2), var(--brand-blue));
  box-shadow: 0 0 10px rgba(46,185,234,0.6);
  transition: height 120ms linear;
}
.b2c-rail-fill::after {
  content: ""; position: absolute; left: -3px; bottom: -3px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--brand-blue); box-shadow: 0 0 12px 2px rgba(46,185,234,0.8);
  opacity: calc(var(--p, 0) * 40);  /* hidden at 0 */
}
.b2c-step { align-items: start; }
.b2c-step-node {
  position: relative; z-index: 1;
  width: 41px; height: 41px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; color: var(--fg-3);
  background: var(--ink-0); border: 1px solid var(--ink-5);
  transition: color 400ms var(--ease-out), border-color 400ms var(--ease-out), box-shadow 600ms var(--ease-out), transform 500ms var(--ease-out);

.b2c-step .step-h { transition: color 500ms var(--ease-out); color: var(--fg-2); }
.b2c-step.is-on .b2c-step-body { opacity: 1; transform: none; }
.b2c-step.is-on .step-h { color: var(--fg-1); }
.b2c-step.is-on .b2c-step-node {
  color: var(--brand-blue); border-color: var(--brand-blue);
  box-shadow: 0 0 0 6px rgba(46,185,234,0.07), 0 0 18px rgba(46,185,234,0.35);
}
.b2c-step.is-current .b2c-step-node { animation: b2cPulse 1.6s var(--ease-out) 1; transform: scale(1.06); }

  0%   { box-shadow: 0 0 0 0 rgba(46,185,234,0.55), 0 0 18px rgba(46,185,234,0.35); }

}
@media (prefers-reduced-motion: reduce) {
  .b2c-step-node, .b2c-step-body, .b2c-rail-fill, .b2c-step .step-h { transition: none; animation: none; }
}
@media (min-width: 901px) {
  .b2c-steps .b2c-split > .section-head { position: sticky; top: 120px; }
}

/* ---- Quote form (steps like the energy scan) ---- */
.b2c-quote { gap: 18px; }
.b2c-quote-head { display: flex; justify-content: space-between; gap: 12px; }
.b2c-quote-bar { height: 2px; background: var(--ink-4); border-radius: 2px; overflow: hidden; }
.b2c-quote-bar span { display: block; height: 100%; background: var(--brand-blue); box-shadow: 0 0 10px rgba(46,185,234,.6); transition: width 500ms var(--ease-out); }
.b2c-quote-step { display: flex; flex-direction: column; gap: 16px; animation: b2cStepIn 450ms var(--ease-out); }
.b2c-quote-step label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
@keyframes b2cStepIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.b2c-reveal { animation: b2cStepIn 350ms var(--ease-out); }
.b2c-quote-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.b2c-quote-nav .btn { margin-left: auto; }
.b2c-checks { border: 0; padding: 0; margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 10px 20px; }
.b2c-checks legend { margin-bottom: 10px; padding: 0; }
.b2c-quote label.b2c-check { flex-direction: row; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--fg-2); line-height: 1.45; }
.b2c-check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--brand-blue); flex: 0 0 auto; }
.b2c-check a { color: var(--brand-blue); }
@media (prefers-reduced-motion: reduce) { .b2c-quote-step, .b2c-reveal { animation: none; } .b2c-quote-bar span { transition: none; } }
.b2c-check input { padding: 0; }

/* ---- Quote: thank-you state ---- */
.b2c-thanks { align-items: flex-start; animation: b2cStepIn 450ms var(--ease-out); }
.b2c-thanks .b2c-quote-bar, .b2c-thanks .b2c-quote-nav { width: 100%; }
.b2c-thanks-check { width: 56px; height: 56px; }
.b2c-thanks-check circle { fill: none; stroke: var(--brand-blue); stroke-width: 2; stroke-dasharray: 151; stroke-dashoffset: 151; animation: b2cDraw 700ms var(--ease-out) forwards; }
.b2c-thanks-check path { fill: none; stroke: var(--brand-blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 36; stroke-dashoffset: 36; animation: b2cDraw 450ms 550ms var(--ease-out) forwards; filter: drop-shadow(0 0 6px rgba(46,185,234,.6)); }
@keyframes b2cDraw { to { stroke-dashoffset: 0; } }
.b2c-thanks-mail { color: var(--brand-blue); font-size: 14px; }
.b2c-countdown { width: 100%; animation: b2cCount 10s linear forwards; }
@keyframes b2cCount { from { width: 100%; } to { width: 0%; } }
@media (prefers-reduced-motion: reduce) { .b2c-thanks, .b2c-thanks-check *, .b2c-countdown { animation: none; stroke-dashoffset: 0; } }

/* ---- Product visuals ---- */
.pv-stage {
  position: relative; height: clamp(300px, 34vw, 440px); margin: 0 0 40px;
  border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--ink-4);
  background:
    radial-gradient(ellipse 60% 70% at 50% 85%, rgba(46,185,234,0.16), transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,0.04), transparent 70%),
    linear-gradient(180deg, #0b0e12, #050608);
  display: flex; align-items: center; justify-content: center; perspective: 1400px;
}
.pv-float { height: 82%; display: flex; align-items: center; justify-content: center; animation: pvFloat 7s ease-in-out infinite; }
.pv-svg { height: 100%; width: auto; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6)); }
.pv-gaia .pv-float, .pv-gaia-smart .pv-float { transform-style: preserve-3d; }
.pv-panel { transform: rotateY(-24deg) rotateX(10deg) rotateZ(2deg); transition: transform 900ms var(--ease-out); }
.pv-stage:hover .pv-panel { transform: rotateY(-10deg) rotateX(6deg) rotateZ(1deg); }
.pv-cabinet, .pv-inverter { transition: transform 900ms var(--ease-out); }
.pv-stage:hover .pv-cabinet, .pv-stage:hover .pv-inverter { transform: translateY(-6px) scale(1.02); }
.pv-floor { position: absolute; left: 25%; right: 25%; bottom: 7%; height: 18px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(46,185,234,0.35), transparent 70%); filter: blur(6px); animation: pvShadow 7s ease-in-out infinite; }
.pv-sheen { animation: pvSheen 6s ease-in-out infinite; }
.pv-led { animation: pvLed 2.8s ease-in-out infinite; }
.pv-pulse-stroke { animation: pvLed 3.2s ease-in-out infinite; }
@keyframes pvFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pvShadow { 0%,100% { opacity: .9; transform: scaleX(1); } 50% { opacity: .55; transform: scaleX(.9); } }
@keyframes pvSheen { 0% { transform: translateX(-60%); } 60%,100% { transform: translateX(60%); } }
@keyframes pvLed { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.pv-photo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1px; background: var(--ink-4); }
.pv-photo img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) brightness(.92); }
@media (max-width: 640px) { .pv-photo { grid-template-columns: 1fr; } .pv-photo img + img { display: none; } }
@media (prefers-reduced-motion: reduce) { .pv-float, .pv-floor, .pv-sheen, .pv-led, .pv-pulse-stroke { animation: none; } }

/* ---- Referral ---- */
.b2c-referral .b2c-split { align-items: start; }
.b2c-ref-side { position: sticky; top: 110px; }
.b2c-ref-result { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--ink-4); }
.b2c-ref-link { background: var(--ink-1); border: 1px solid rgba(46,185,234,.4); border-radius: var(--r-sm); padding: 12px 14px; font-family: var(--font-mono, monospace); font-size: 13px; color: var(--fg-1); word-break: break-all; }
.b2c-ref-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.b2c-ref-actions .btn { padding: 11px 16px; font-size: 11px; }
.b2c-ref-note { margin: 0; padding: 12px 14px; border-radius: var(--r-sm); background: rgba(46,185,234,.08); border: 1px solid rgba(46,185,234,.35); color: var(--fg-1); font-size: 14px; line-height: 1.5; }
.b2c-terms-box { margin-top: 24px; border-top: 1px solid var(--ink-4); padding-top: 18px; }
.b2c-terms-box summary { cursor: pointer; color: var(--fg-2); }
.b2c-terms-box summary:hover { color: var(--brand-blue); }
.b2c-terms-box ol { margin: 16px 0 0; padding-left: 20px; color: var(--fg-2); font-size: 14px; line-height: 1.6; }
.b2c-terms-box li + li { margin-top: 8px; }
@media (max-width: 900px) { .b2c-ref-side { position: static; } }
.b2c-form input.is-valid { border-color: var(--brand-blue); box-shadow: 0 0 0 3px rgba(46,185,234,.12); }

/* ---- Products menu: sub-items in drawer ---- */
.drawer-nav a.is-sub { font-size: 17px; padding: 12px 4px 12px 22px; color: var(--fg-2); border-bottom-color: rgba(255,255,255,0.04); }
.drawer-nav a.is-sub .drawer-nav-label::before { content: ""; display: inline-block; width: 10px; height: 1px; background: var(--brand-blue); vertical-align: middle; margin-right: 12px; opacity: .7; }
.drawer-nav a.is-sub:hover { padding-left: 30px; }

/* ---- Data-sheet downloads ---- */
.b2c-sheets { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
.b2c-sheet {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 16px; border: 1px solid var(--ink-4); border-radius: var(--r-md);
  color: var(--fg-1); text-decoration: none; transition: border-color 200ms var(--ease-out), background 200ms var(--ease-out);
}
.b2c-sheet:hover { border-color: var(--brand-blue); background: rgba(46,185,234,0.05); }
.b2c-sheet-icon { font-family: var(--font-caps); font-size: 10px; letter-spacing: .14em; color: var(--brand-blue); border: 1px solid rgba(46,185,234,.45); border-radius: 6px; height: 36px; display: grid; place-items: center; }
.b2c-sheet strong { font-weight: 500; font-size: 14px; }
.b2c-sheet .sub { font-size: 12px; color: var(--fg-3); }
.b2c-sheet-arrow { color: var(--brand-blue); font-size: 16px; }
.b2c-page section .b2c-sheets, section .wrap > .b2c-sheets { display: grid; grid-template-columns: repeat(2, 1fr); }
@media (max-width: 760px) { section .wrap > .b2c-sheets { grid-template-columns: 1fr; } }

/* ---- Products overview ---- */
.b2c-prod-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--ink-4); border: 1px solid var(--ink-4); }
@media (max-width: 1100px) { .b2c-prod-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .b2c-prod-grid { grid-template-columns: 1fr; } }
.b2c-prod-card { background: var(--ink-0); padding: 24px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--fg-1); transition: background 300ms var(--ease-out); min-width: 0; }
.b2c-prod-card:hover { background: rgba(46,185,234,0.05); }
.b2c-prod-media .pv-stage { height: 240px; margin: 0 0 12px; }
.b2c-prod-media .pv-photo { grid-template-columns: 1fr; }
.b2c-prod-media .pv-photo img + img { display: none; }

.pv-themis .pv-svg { height: 80%; }
.th-flow { animation: thFlow 1.6s linear infinite; }
@keyframes thFlow { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) { .th-flow { animation: none; } }
.b2c-prod-grid { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 1280px) { .b2c-prod-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 860px) { .b2c-prod-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .b2c-prod-grid { grid-template-columns: 1fr; } }

.pv-cut { position: relative; height: 72%; aspect-ratio: 183 / 243; filter: drop-shadow(0 26px 34px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(46,185,234,.25)); transition: transform 900ms var(--ease-out); }

.pv-cut img { width: 100%; height: 100%; object-fit: contain; display: block; }

.pv-stage:hover .pv-cut { transform: translateY(-6px) scale(1.02); }

.ep-v { font-size: clamp(48px, 6vw, 72px); font-weight: 300; line-height: 1; color: var(--fg-1); font-variant-numeric: tabular-nums; }
.ep-big .label { color: var(--fg-3); }
.ep-sub { margin: 0; color: var(--fg-2); }
.ep-list { margin: 8px 0 0; display: grid; gap: 0; }
.ep-list dt { margin-top: 18px; padding-bottom: 8px; color: var(--fg-3); }
.ep-list dd { margin: 0; display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--ink-4); font-size: 15px; color: var(--fg-2); }

.ep-note { margin: auto 0 0; padding-top: 12px; font-size: 13px; line-height: 1.6; color: var(--fg-3); }
.ep-note a { color: var(--brand-blue); text-decoration: none; }
.ep-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px 32px; flex-wrap: wrap; margin-top: 32px; }

.ep-bat { margin-top: 12px; padding: 18px 20px; border-radius: var(--r-sm); background: rgba(46,185,234,0.06); border: 1px solid rgba(46,185,234,0.35); display: grid; gap: 10px; }

.ep-batnote { margin-top: 28px; max-width: 110ch; }

trekken via service@belinus.com.",termsH:"Voorwaarden verwijs een vriend",terms:["Iedereen van 18 jaar of ouder kan iemand doorverwijzen, ook wie zelf geen klant is van Belinus Energy BV. Je kan jezelf of iemand van je eigen gezin niet doorverwijzen.","De doorverwezen persoon is een nieuwe klant, woont in Belgi\xEB en laat de installatie in Belgi\xEB plaatsen.","De doorverwezen persoon vraagt de offerte aan via de persoonlijke link of vermeldt de verwijscode bij de aanvraag.","De verwijzer ontvangt \u20AC150 per doorverwezen klant, uitsluitend nadat diens bestelling geleverd, ge\xEFnstalleerd en volledig betaald is.","Belinus Energy BV volgt de doorverwezen bestelling op en stuurt de verwijzer automatisch een e-mail zodra het project geleverd en volledig betaald is. Na ontvangst van de gegevens voor de uitbetaling betaalt Belinus Energy BV de premie per overschrijving binnen 30 dagen.","De doorverwezen klant ontvangt 3 maanden service cadeau, bovenop de gekozen formule.","Belinus Energy BV deelt geen gegevens van de doorverwezen klant met de verwijzer, behalve de melding dat een verwijzing tot een beloning heeft geleid.","Belinus Energy BV kan de actie op elk moment wijzigen of be\xEBindigen; verwijzingen die v\xF3\xF3r dat moment via de link zijn aangevraagd, blijven geldig. Belgisch recht is van toepassing."],err:"Vul je naam en een geldig e-mailadres in en aanvaard de voorwaarden.",friendNote:a=>`Je bent doorverwezen (code ${a}). Na je installatie krijg je 3 maanden service cadeau.`,refField:"Verwijscode"},fr:{eyebrow:"Parrainez un ami",h:"Partagez votre lien personnel.",lead:"Vous connaissez quelqu\u2019un qui veut \xE9conomiser sur l\u2019\xE9nergie ? Tout le monde peut recommander belinus, m\xEAme sans \xEAtre client. Cr\xE9ez votre lien personnel et partagez-le avec vos amis ou votre famille. Ils demandent eux-m\xEAmes leur devis ; c\u2019est vous qui choisissez avec qui partager le lien.",steps:[["Cr\xE9ez votre lien","Saisissez votre nom et votre adresse e-
